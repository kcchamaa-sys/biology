    terms: [["trachea", "windpipe supported by cartilage rings"], ["bronchus", "one of two tubes branching from the trachea (plural: bronchi)"], ["bronchiole", "small airway leading to the alveoli"], ["alveolus", "tiny air sac where gas exchange happens (plural: alveoli)"], ["cilia", "tiny hairs that sweep mucus"], ["mucus", "sticky liquid that traps dust and germs"], ["cartilage", "firm tissue that keeps the trachea open"]] },
  { id: "t13s2", t: "t13", s: 2, name: "The Breathing Bellows", focus: "Ventilation: how we breathe", scene: "clinic",
    special: "belljar", specialName: "Bell-jar model", specialLine: "Pull the rubber sheet down and the balloons inflate... magic?",
    tint: "#C7D3F2", floor: "#98A6CC", dim: .62, code: "30687", item: "🎈 Balloon-lung sticker",
    intro: [K("chiikawa", "normal", "Huff... puff... how do our lungs actually fill up? 🤔"), K("hachiware", "normal", "Muscles change the volume of the chest, and air flows in or out because of pressure."), K("kurimanju", "happy", "Deep breaths... like smelling tea... 🍵")],
    notes: [
      "<b>Inhalation</b>: external intercostal muscles <b>contract</b> → ribcage moves <b>up and out</b>; diaphragm muscles <b>contract</b> → diaphragm <b>flattens</b>; chest volume <b>increases</b> → pressure <b>decreases</b> below atmospheric → air flows <b>in</b>.",
      "<b>Exhalation</b> (at rest): external intercostal muscles and diaphragm <b>relax</b>; ribcage moves down and in; diaphragm domes up; volume decreases → pressure increases → air flows <b>out</b>. Internal intercostal muscles help in forced exhalation.",
      "The <b>bell-jar model</b>: pulling the rubber sheet (diaphragm) down increases volume, so the balloons (lungs) inflate. It can't show ribcage movement.",
      "A <b>spirometer</b> trace shows <b>tidal volume</b> (volume of a normal breath) and <b>vital capacity</b> (maximum volume breathed out after a deepest breath in).",
      "During exercise, breathing rate and depth increase to supply more O₂ and remove more CO₂."
    ],
    rules: ["Inhale: muscles contract → volume ↑ → pressure ↓ → air in", "Exhale: muscles relax → volume ↓ → pressure ↑ → air out", "Air moves from high to low pressure"],
    terms: [["ventilation", "breathing: moving air in and out of the lungs"], ["intercostal muscles", "muscles between the ribs"], ["diaphragm", "dome-shaped muscle sheet below the lungs"], ["inhalation", "breathing in"], ["exhalation", "breathing out"], ["tidal volume", "volume of air in one normal breath"], ["vital capacity", "maximum volume of air breathed out after a deepest breath"], ["spirometer", "apparatus that measures breathing volumes"]] },
  { id: "t13s3", t: "t13", s: 3, name: "The Smoky Alley", focus: "Air composition, smoking and lung health", scene: "lab",
    special: "limewater", specialName: "Breath flask", specialLine: "Breathe through the tube... the limewater goes cloudy!",
    tint: "#B8B2A6", floor: "#8C877C", dim: .76, code: "57219", item: "🚭 Clean-air sticker",
    intro: [K("rakko", "brave", "Boss stage. Smoke is an enemy you can't cut with a sword. Know how it harms. ⚔️"), K("chiikawa", "cry", "Cough cough... the air is so smoky... 😖"), K("hachiware", "happy", "Let's clear the air with science! ✨")],
    notes: [
      "Inhaled vs exhaled air: O₂ about <b>21% → 16%</b>; CO₂ about <b>0.04% → 4%</b>; exhaled air is also <b>warmer</b> and <b>saturated with water vapour</b>. Nitrogen stays about 78%.",
      "<b>Limewater</b> turns milky faster with exhaled air, showing it has more CO₂.",
      "<b>Tar</b> in tobacco smoke paralyses cilia and contains <b>carcinogens</b> (cause lung cancer); mucus builds up → smoker's cough, <b>chronic bronchitis</b>.",
      "<b>Emphysema</b>: alveolar walls break down → smaller surface area → breathlessness.",
      "<b>Nicotine</b> is addictive and raises heart rate and blood pressure. <b>Carbon monoxide</b> binds to haemoglobin, reducing O₂ transport.",
      "Air pollutants (e.g. suspended particulates, sulphur dioxide) also irritate airways and worsen asthma."
    ],
    rules: ["Exhaled air: less O₂, more CO₂, warmer, more water vapour", "Tar → cancer, paralysed cilia · CO → less O₂ carried · nicotine → addiction", "Emphysema → smaller alveolar surface area"],
    terms: [["tar", "sticky substance in smoke containing carcinogens"], ["carcinogen", "substance that can cause cancer"], ["nicotine", "addictive drug in tobacco"], ["carbon monoxide", "gas that binds to haemoglobin and reduces O₂ transport"], ["emphysema", "disease in which alveolar walls break down"], ["bronchitis", "inflammation of the bronchi with excess mucus"]] },

  /* ---------------- Transport in Humans ---------------- */
  { id: "t14s1", t: "t14", s: 1, name: "The Blood Bank", focus: "Blood and blood vessels", scene: "clinic",
    special: "bloodbag", specialName: "Blood bag", specialLine: "A red blood bag hangs on a stand... it's full of cells and plasma!",
    tint: "#F2C4C4", floor: "#C99A9A", dim: .6, code: "43851", item: "🩸 Blood-drop sticker",
    intro: [K("chiikawa", "shock", "Is that... BLOOD?! 😱🩸"), K("hachiware", "normal", "Don't faint! Blood is a busy delivery system with plasma, red cells, white cells and platelets."), K("momonga", "happy", "My blood type is 'cute'. 💜")],
    notes: [
      "<b>Plasma</b> (mostly water) carries dissolved glucose, amino acids, CO₂, urea, hormones and heat.",
      "<b>Red blood cells</b>: contain <b>haemoglobin</b> (carries O₂ as oxyhaemoglobin); biconcave disc (large surface area); <b>no nucleus</b> (more room for haemoglobin).",
      "<b>White blood cells</b> defend the body: <b>phagocytes</b> engulf germs; <b>lymphocytes</b> make antibodies. <b>Platelets</b> help <b>blood clotting</b>.",
      "<b>Arteries</b> carry blood <b>away</b> from the heart at high pressure: thick, muscular, elastic walls, small lumen.",
      "<b>Veins</b> carry blood <b>to</b> the heart at low pressure: thin walls, large lumen, <b>valves</b> stop backflow.",
      "<b>Capillaries</b>: walls <b>one cell thick</b>, very narrow; exchange substances with body cells."
    ],
    rules: ["Artery: away, thick elastic wall, high pressure", "Vein: to heart, thin wall, valves, low pressure", "Capillary: one cell thick → exchange"],
    terms: [["plasma", "liquid part of blood"], ["red blood cell", "cell with haemoglobin that carries oxygen"], ["white blood cell", "cell that defends the body against pathogens"], ["platelet", "cell fragment that helps blood clot"], ["artery", "vessel carrying blood away from the heart"], ["vein", "vessel carrying blood back to the heart"], ["capillary", "tiny vessel with walls one cell thick"], ["lumen", "the space inside a blood vessel"]] },
  { id: "t14s2", t: "t14", s: 2, name: "The Heart Pump House", focus: "The heart and double circulation", scene: "cellworld",
    special: "heart", specialName: "Beating heart", specialLine: "Ba-dum! Ba-dum! A giant heart beats... one chamber holds a riddle.",
    tint: "#F7B7C0", floor: "#CE8C96", dim: .62, code: "91672", item: "❤️ Heartbeat sticker",
    intro: [K("chiikawa", "sparkle", "Ba-dum... ba-dum... it's like a drum! 🥁✨"), K("hachiware", "normal", "The heart is two pumps side by side: right side to the lungs, left side to the body."), K("usagi", "happy", "Ba-dum ba-dum YAHA! 🐰")],
    notes: [
      "The heart has four chambers: <b>right atrium</b>, <b>right ventricle</b>, <b>left atrium</b>, <b>left ventricle</b>. Atria receive blood; ventricles pump it out.",
      "<b>Double circulation</b>: <b>pulmonary</b> circulation (heart → lungs → heart) and <b>systemic</b> circulation (heart → body → heart). Blood passes through the heart twice per round.",
      "Right side: deoxygenated blood from the <b>vena cava</b> → right atrium → right ventricle → <b>pulmonary artery</b> → lungs.",
      "Left side: oxygenated blood from the <b>pulmonary vein</b> → left atrium → left ventricle → <b>aorta</b> → body.",
      "The <b>left ventricle</b> wall is thickest: it pumps blood all round the body at high pressure.",
      "<b>Valves</b> (bicuspid, tricuspid, semilunar) prevent backflow. The <b>septum</b> separates oxygenated and deoxygenated blood. <b>Coronary arteries</b> supply the heart muscle."
    ],
    rules: ["Body → vena cava → RA → RV → pulmonary artery → lungs", "Lungs → pulmonary vein → LA → LV → aorta → body", "Left ventricle wall thickest · valves stop backflow"],
    terms: [["atrium", "upper chamber of the heart that receives blood (plural: atria)"], ["ventricle", "lower chamber of the heart that pumps blood out"], ["aorta", "largest artery, carrying blood from the left ventricle"], ["vena cava", "large vein bringing blood back to the right atrium"], ["pulmonary artery", "carries deoxygenated blood to the lungs"], ["pulmonary vein", "carries oxygenated blood from the lungs"], ["double circulation", "blood passes through the heart twice per circuit"], ["septum", "wall dividing the left and right sides of the heart"], ["coronary artery", "artery supplying blood to the heart muscle"]] },
  { id: "t14s3", t: "t14", s: 3, name: "The Capillary Maze", focus: "Tissue fluid, lymph and heart health", scene: "pond",
    special: "villi", specialName: "Capillary bed", specialLine: "Tiny tubes leak a clear fluid around the cells... where does it go?",
    tint: "#A9C8E8", floor: "#7F9FC0", dim: .76, code: "26348", item: "💧 Tissue-fluid sticker",
    intro: [K("rakko", "brave", "Boss stage. Blood never touches the cells directly. Explain how they are fed. ⚔️"), K("chiikawa", "cry", "Everything is leaking... uuu... 🥺"), K("hachiware", "happy", "It's supposed to leak! That's tissue fluid. Nantoka naare~! ✨")],
    notes: [
      "At the <b>arterial end</b> of a capillary, high blood pressure forces plasma (without red cells or large proteins) out to form <b>tissue fluid</b>.",
      "Tissue fluid bathes cells: O₂ and nutrients diffuse into cells; CO₂ and wastes diffuse out.",
      "At the <b>venous end</b>, most tissue fluid returns to the capillaries (pressure is lower). The rest drains into <b>lymph vessels</b> as <b>lymph</b>, which returns to the blood near the heart.",
      "<b>Lymph nodes</b> contain lymphocytes and filter germs. The lymphatic system also carries fats from the lacteals.",
      "<b>Coronary heart disease</b>: fatty deposits (<b>atherosclerosis</b>) narrow coronary arteries, which can cause a <b>heart attack</b>. Risk factors: smoking, high-fat diet, lack of exercise, high blood pressure, obesity.",
      "Regular exercise strengthens the heart, raising stroke volume and lowering resting heart rate."
    ],
    rules: ["Arterial end: pressure pushes fluid out · venous end: most returns", "Excess tissue fluid → lymph → back to blood", "Fatty deposits in coronary arteries → heart attack"],
    terms: [["tissue fluid", "fluid that bathes body cells, formed from plasma"], ["lymph", "tissue fluid inside lymph vessels"], ["lymph node", "swelling in lymph vessels that filters germs"], ["atherosclerosis", "build-up of fatty deposits in arteries"], ["heart attack", "death of heart muscle when its blood supply is blocked"], ["blood pressure", "force of blood on vessel walls"]] },

  /* ---------------- Reproduction, Growth and Development ---------------- */
  { id: "t15s1", t: "t15", s: 1, name: "The Flower Garden", focus: "Reproduction in flowering plants", scene: "greenhouse",
    special: "flower", specialName: "Giant flower", specialLine: "A giant flower sways... a bee has left a pollen-covered note!",
    tint: "#F5D0E0", floor: "#C9A6B8", dim: .56, code: "75034", item: "🌸 Petal sticker",
    intro: [K("chiikawa", "sparkle", "Flowers everywhere! It smells so sweet! 🌸✨"), K("hachiware", "normal", "Flowers are for reproduction! Pollen goes from anther to stigma. Let's follow its journey."), K("usagi", "happy", "Bzzz! I'm a bee! URA! 🐝🐰")],
    notes: [
      "Flower parts: <b>sepals</b> (protect bud), <b>petals</b> (attract insects), <b>stamens</b> = <b>anther</b> (makes pollen) + filament; <b>carpel</b> = <b>stigma</b> (receives pollen) + style + <b>ovary</b> (contains ovules).",
      "<b>Pollination</b>: transfer of pollen from anther to stigma. <b>Insect-pollinated</b> flowers: bright petals, scent, nectar, sticky pollen, stigma inside. <b>Wind-pollinated</b>: small dull petals, feathery stigmas outside, huge amounts of light, smooth pollen.",
      "<b>Fertilisation</b>: a <b>pollen tube</b> grows down the style; the male gamete fuses with the female gamete in the ovule.",
      "After fertilisation: ovule → <b>seed</b>; ovary → <b>fruit</b>. Seeds and fruits are <b>dispersed</b> by wind, animals, water or explosion, reducing competition.",
      "<b>Germination</b> needs <b>water</b>, <b>oxygen</b> and a <b>suitable temperature</b> (not light).",
      "<b>Asexual reproduction</b> (vegetative propagation, e.g. cuttings, bulbs, runners) makes genetically identical offspring quickly."
    ],
    rules: ["Anther → pollen · stigma receives pollen · ovary → fruit · ovule → seed", "Pollination ≠ fertilisation", "Germination needs water + O₂ + suitable temperature"],
    terms: [["anther", "part of the stamen that makes pollen"], ["stigma", "sticky tip of the carpel that receives pollen"], ["ovary", "part of the carpel containing ovules; becomes the fruit"], ["ovule", "structure containing the female gamete; becomes the seed"], ["pollination", "transfer of pollen from anther to stigma"], ["pollen tube", "tube that carries the male gamete to the ovule"], ["germination", "the start of growth of a seed"], ["dispersal", "spreading of seeds away from the parent plant"]] },
  { id: "t15s2", t: "t15", s: 2, name: "The Baby Clinic", focus: "Human reproduction", scene: "clinic",
    special: "egg", specialName: "Zygote lamp", specialLine: "A glowing round lamp... it's shaped like a fertilised egg cell!",
    tint: "#FFD6DF", floor: "#D4A6B0", dim: .58, code: "48560", item: "👶 Baby-footprint sticker",
    intro: [K("chiikawa", "shock", "B-babies come from ONE tiny cell?! 😳"), K("hachiware", "normal", "Yes! A sperm fertilises an egg to form a zygote, which grows by mitosis."), K("momonga", "sparkle", "I was the cutest zygote ever. 💜")],
    notes: [
      "Male: <b>testes</b> make sperm and testosterone; <b>sperm duct</b> carries sperm; <b>seminal vesicle</b> and <b>prostate gland</b> add fluid; urethra.",
      "Female: <b>ovaries</b> release eggs (ovulation); <b>oviduct</b> (site of fertilisation); <b>uterus</b> (fetus develops); <b>cervix</b>; vagina.",
      "<b>Menstrual cycle</b> (about 28 days): menstruation (days 1–5), uterine lining thickens, <b>ovulation</b> around day 14, then the lining is kept if an embryo implants.",
      "<b>Fertilisation</b> in the oviduct forms a <b>zygote</b>, which divides into an embryo and <b>implants</b> in the uterine lining.",
      "The <b>placenta</b> exchanges substances between mother and fetus (O₂, nutrients in; CO₂, urea out) without mixing blood. The <b>umbilical cord</b> links the fetus to the placenta; <b>amniotic fluid</b> protects it.",
      "<b>Birth control</b>: barrier (condom, prevents sperm meeting egg; also reduces STIs), hormonal (pill, stops ovulation), IUD, sterilisation (vasectomy, tubal ligation)."
    ],
    rules: ["Fertilisation in the oviduct → zygote → implantation in the uterus", "Ovulation ≈ day 14 of a 28-day cycle", "Placenta: exchange without mixing blood"],
    terms: [["testis", "male organ that makes sperm (plural: testes)"], ["ovary", "female organ that releases eggs"], ["oviduct", "tube where fertilisation happens"], ["uterus", "organ where the fetus develops"], ["ovulation", "release of an egg from the ovary"], ["implantation", "embryo embedding in the uterine lining"], ["placenta", "organ for exchange between mother and fetus"], ["menstruation", "shedding of the uterine lining"]] },
  { id: "t15s3", t: "t15", s: 3, name: "The Growth Chart Tower", focus: "Growth and development", scene: "library",
    special: "heightchart", specialName: "Growth chart", specialLine: "Pencil lines on the wall mark how tall everyone grew each year!",
    tint: "#DCE8B4", floor: "#B3C286", dim: .74, code: "12987", item: "📈 Growth-curve sticker",
    intro: [K("rakko", "brave", "Boss stage. Growth isn't just getting taller. Measure it properly. ⚔️"), K("chiikawa", "brave", "I'll grow big and strong... one question at a time! 💪"), K("usagi", "happy", "Grow grow grow! YAHA! 🐰")],
    notes: [
      "<b>Growth</b> is a permanent increase in size or <b>dry mass</b>, due to cell division, cell enlargement and cell differentiation. <b>Development</b> is the change in form and function (e.g. specialised cells).",
      "Ways to measure growth: height/length, fresh mass, <b>dry mass</b> (most reliable: removes changes in water content, but kills the organism), cell number.",
      "Human growth curve: fast in infancy, steady in childhood, a <b>growth spurt</b> at puberty (earlier in girls), then stops in adulthood.",
      "Germinating seeds: <b>dry mass decreases</b> at first (stored food is used in respiration) until leaves photosynthesise, then it increases.",
      "Plant growth happens mainly at <b>meristems</b> (root and shoot tips). Growth needs food, and is affected by hormones and the environment.",
      "<b>Metamorphosis</b> (e.g. butterfly: egg → larva → pupa → adult) is a type of development with big changes in form."
    ],
    rules: ["Growth = permanent increase in size / dry mass", "Dry mass is most reliable (water content varies)", "Seed germination: dry mass falls, then rises once photosynthesis starts"],
    terms: [["growth", "permanent increase in size or dry mass"], ["development", "changes in form and function as an organism matures"], ["dry mass", "mass after all water is removed"], ["differentiation", "cells becoming specialised"], ["meristem", "region of cell division in plants"], ["growth spurt", "rapid growth at puberty"], ["metamorphosis", "big change in body form during development"]] },

  /* ---------------- Coordination and Response ---------------- */
  { id: "t16s1", t: "t16", s: 1, name: "The Eye and Ear Studio", focus: "Stimuli, receptors, the eye and the ear", scene: "library",
    special: "eye", specialName: "Giant eyeball", specialLine: "A giant eyeball blinks at you... its pupil is getting smaller!",
    tint: "#C8D8F0", floor: "#9DAFCB", dim: .6, code: "65821", item: "👁️ Sharp-eye sticker",
    intro: [K("chiikawa", "shock", "The eyeball is LOOKING at me! 👁️😱"), K("hachiware", "normal", "It's a model of the eye! Receptors turn stimuli like light and sound into nerve impulses."), K("usagi", "happy", "I can hear EVERYTHING with these ears! URA! 🐰")],
    notes: [
      "A <b>stimulus</b> is a change in the environment. <b>Receptors</b> detect stimuli and produce nerve impulses; <b>effectors</b> (muscles, glands) respond.",
      "The eye: <b>cornea</b> (refracts light most) · <b>iris</b> (controls pupil size) · <b>lens</b> (fine focusing) · <b>retina</b> (rods and cones) · <b>optic nerve</b> · <b>blind spot</b> (no receptors).",
      "<b>Rods</b>: sensitive to dim light, black-and-white vision. <b>Cones</b>: colour vision in bright light; most at the <b>fovea</b> (yellow spot).",
      "<b>Pupil reflex</b>: in bright light, circular muscles of the iris contract → pupil constricts (less light enters, protects retina).",
      "<b>Accommodation</b>: near object → ciliary muscles contract, suspensory ligaments slacken, lens becomes <b>thicker/rounder</b>. Distant object → ciliary muscles relax, ligaments tighten, lens <b>thinner</b>.",
      "The ear: <b>ear drum</b> vibrates → <b>ear ossicles</b> amplify → <b>cochlea</b> (receptor cells) → auditory nerve. <b>Semicircular canals</b> detect head movement (balance)."
    ],
    rules: ["Stimulus → receptor → nerve → brain/spinal cord → effector → response", "Bright light: circular muscles contract → pupil smaller", "Near object: ciliary muscles contract → lens thicker"],
    terms: [["stimulus", "a change in the environment that is detected"], ["receptor", "cell or organ that detects a stimulus"], ["effector", "muscle or gland that carries out a response"], ["retina", "light-sensitive layer with rods and cones"], ["accommodation", "changing the lens shape to focus"], ["ciliary muscle", "muscle that changes the shape of the lens"], ["cochlea", "coiled part of the inner ear with sound receptors"], ["pupil", "hole in the iris that lets light in"]] },
  { id: "t16s2", t: "t16", s: 2, name: "The Nerve Network", focus: "The nervous system and reflexes", scene: "cellworld",
    special: "brain", specialName: "Brain dome", specialLine: "A wrinkly pink brain glows under a glass dome... it's thinking!",
    tint: "#E3C9EE", floor: "#B89AC3", dim: .62, code: "80375", item: "⚡ Nerve-spark sticker",
    intro: [K("chiikawa", "shock", "OUCH! I touched something hot and my hand jumped away before I thought! 😱🔥"), K("hachiware", "normal", "That was a reflex! The impulse went through your spinal cord, not your thinking brain."), K("kurimanju", "happy", "Hot tea... also causes reflexes... *careful sip* 🍵")],
    notes: [
      "The <b>central nervous system</b> (CNS) = brain + spinal cord. The <b>peripheral nervous system</b> = nerves.",
      "Neurones: <b>sensory neurone</b> (receptor → CNS), <b>interneurone</b> (relay, in the CNS), <b>motor neurone</b> (CNS → effector). The <b>myelin sheath</b> speeds up impulses.",
      "A <b>synapse</b> is a gap between neurones: impulses cross by <b>neurotransmitters</b> diffusing across, so impulses travel <b>one way</b>.",
      "<b>Reflex arc</b>: receptor → sensory neurone → interneurone (spinal cord) → motor neurone → effector. Reflexes are rapid, automatic and protective (e.g. knee jerk, withdrawal).",
      "Brain: <b>cerebrum</b> (thinking, memory, voluntary actions, senses) · <b>cerebellum</b> (balance, coordination of movement) · <b>medulla oblongata</b> (heart rate, breathing rate).",
      "Voluntary actions are conscious and controlled by the cerebrum; reflex actions are involuntary."
    ],
    rules: ["Receptor → sensory → interneurone → motor → effector", "Synapse: chemical transmission, one direction", "Cerebrum: thinking · cerebellum: balance · medulla: heart & breathing"],
    terms: [["neurone", "nerve cell that carries impulses"], ["sensory neurone", "carries impulses from receptors to the CNS"], ["motor neurone", "carries impulses from the CNS to effectors"], ["interneurone", "relay neurone inside the CNS"], ["synapse", "junction between two neurones"], ["reflex arc", "pathway of a reflex action"], ["cerebellum", "part of the brain for balance and coordination"], ["medulla oblongata", "part of the brain controlling heart and breathing rates"]] },
  { id: "t16s3", t: "t16", s: 3, name: "The Hormone Post Office", focus: "Hormones and plant responses", scene: "greenhouse",
    special: "sun", specialName: "One-sided lamp", specialLine: "A lamp shines from one side... the seedlings are all bending towards it!",
    tint: "#F7E3A1", floor: "#CDB873", dim: .6, code: "37916", item: "📮 Hormone-letter sticker",
    intro: [K("chiikawa", "normal", "The seedlings are leaning over... are they tired? 🌱"), K("hachiware", "happy", "No! They're growing towards light. Plant hormones called auxins control it."), K("usagi", "happy", "Hormone mail delivery! URA! 📮🐰")],
    notes: [
      "<b>Hormones</b> are chemicals made by <b>endocrine glands</b>, carried in the <b>blood</b> to target organs. Effects are slower and longer-lasting than nerve impulses.",
      "Examples: <b>insulin</b> and <b>glucagon</b> (pancreas) · <b>adrenaline</b> (adrenal glands: fight or flight) · <b>growth hormone</b> (pituitary) · <b>oestrogen</b>, <b>progesterone</b>, <b>testosterone</b> (sex hormones).",
      "Nervous vs hormonal: nerve impulses are electrical, fast, short-lived and precise; hormones are chemical, slower, longer-lasting and widespread.",
      "Plant responses are <b>tropisms</b>: growth responses to a directional stimulus. <b>Phototropism</b>: shoots grow towards light. <b>Gravitropism</b>: roots grow down.",
      "<b>Auxin</b> made at the shoot tip moves to the <b>shaded side</b>, making cells there elongate more, so the shoot bends towards light.",
      "Experiments: removing the tip or covering it with foil stops bending, showing the tip detects light and produces auxin."
    ],
    rules: ["Hormones: chemical, in blood, slower, longer-lasting", "Auxin collects on the shaded side → more elongation → bends towards light", "Tip removed or covered → no bending"],
    terms: [["hormone", "chemical messenger carried in the blood"], ["endocrine gland", "ductless gland that secretes hormones into blood"], ["target organ", "organ that responds to a hormone"], ["adrenaline", "hormone for the fight-or-flight response"], ["tropism", "directional growth response of a plant"], ["phototropism", "growth response towards light"], ["auxin", "plant hormone that causes cell elongation"]] },
  { id: "t16s4", t: "t16", s: 4, name: "The Dance Studio", focus: "Movement: bones, joints and muscles", scene: "kitchen",
    special: "bone", specialName: "Skeleton arm", specialLine: "A model arm bends at the elbow... the muscles take turns pulling!",
    tint: "#E8D5F0", floor: "#BFA9CC", dim: .76, code: "59240", item: "💃 Dance-move sticker",
    intro: [K("rakko", "brave", "Boss stage. Every sword swing needs muscles working in pairs. Show me. ⚔️"), K("chiikawa", "brave", "Biceps... triceps... I'll flex my brain! 💪"), K("usagi", "happy", "DANCE! URA! URAAA! 🐰💃")],
    notes: [
      "The <b>skeleton</b> supports the body, protects organs, allows movement, and makes blood cells in bone marrow.",
      "A <b>synovial joint</b> (e.g. elbow = hinge joint; hip/shoulder = ball-and-socket joint) has <b>cartilage</b> (reduces friction, absorbs shock), <b>synovial fluid</b> (lubricates) and <b>ligaments</b> (join bone to bone).",
      "<b>Tendons</b> join muscle to bone; they are inelastic so muscle pull moves the bone.",
      "Muscles can only <b>contract</b> (pull), not push, so they work in <b>antagonistic pairs</b>.",
      "Bending the arm: <b>biceps contracts</b>, triceps relaxes. Straightening: <b>triceps contracts</b>, biceps relaxes.",
      "Muscle contraction needs <b>ATP</b> from respiration, and is triggered by motor neurones. Exercise and a balanced diet keep bones and muscles healthy."
    ],
    rules: ["Ligament: bone–bone · tendon: muscle–bone", "Muscles only pull → antagonistic pairs", "Bend elbow: biceps contracts · straighten: triceps contracts"],
    terms: [["synovial joint", "freely movable joint with fluid-filled cavity"], ["ligament", "tissue joining bone to bone"], ["tendon", "inelastic tissue joining muscle to bone"], ["antagonistic muscles", "a pair of muscles producing opposite movements"], ["biceps", "muscle that bends the arm at the elbow"], ["triceps", "muscle that straightens the arm"], ["synovial fluid", "liquid that lubricates a joint"], ["hinge joint", "joint allowing movement in one plane, e.g. elbow"]] },

  /* ---------------- Homeostasis ---------------- */
  { id: "t17s1", t: "t17", s: 1, name: "The Sugar Balance Bakery", focus: "Negative feedback and blood glucose", scene: "kitchen",
    special: "scale", specialName: "Sugar scale", specialLine: "A balance scale tips when sugar is added... then slowly levels again!",
    tint: "#F3D9B0", floor: "#CBA67B", dim: .6, code: "84103", item: "⚖️ Balance sticker",
    intro: [K("chiikawa", "sparkle", "Cakes! Sweets! Blood sugar go UP! 🍰✨"), K("hachiware", "normal", "Then insulin brings it back down! Homeostasis keeps our inside world steady."), K("usagi", "shock", "Haa?! My sugar is going up and down like a see-saw?! 🐰")],

[2, "Taking a cutting of a plant to grow a new plant uses which type of division?", ["Mitosis (asexual reproduction)", "Meiosis (sexual reproduction)", "Fertilisation", "Phagocytosis"], "The new plant is a clone.", "Cuttings grow by mitosis, so the new plant is genetically identical to the parent: asexual reproduction."],
[3, "Which of these would divide by meiosis?", ["A cell in the anther making pollen", "A root tip cell", "A skin cell", "A white blood cell precursor in bone marrow"], "Pollen grains contain male gametes.", "Anthers make pollen by meiosis. Root tips, skin and bone marrow divide by mitosis."],
[3, "A cell divides and gives two cells, each with 46 chromosomes and identical DNA. Which division was it?", ["Mitosis", "Meiosis I", "Meiosis II", "Fertilisation"], "Two identical diploid cells.", "Two identical diploid daughter cells mean mitosis."],
{ b: 3, type: "dial", q: "Compare mitosis and meiosis.", labels: ["Mitosis: daughter cells", "Meiosis: daughter cells", "Crossing over happens in"], dials: [["2 diploid", "4 haploid", "2 haploid"], ["2 diploid", "4 haploid", "2 haploid"], ["Mitosis", "Meiosis", "Both"]], answer: [0, 1, 1],
  hint: "Mitosis: 1 division. Meiosis: 2 divisions and pairing of homologues.", explain: "Mitosis gives 2 identical diploid cells; meiosis gives 4 genetically different haploid cells, with crossing over in meiosis I." },
[4, "A cell has 20 chromosomes. After meiosis, how many chromosomes are in each cell, and how many cells are there?", ["10 chromosomes, 4 cells", "20 chromosomes, 2 cells", "10 chromosomes, 2 cells", "40 chromosomes, 4 cells"], "Meiosis: halve the number, 4 cells.", "Meiosis produces 4 haploid cells, each with 20 ÷ 2 = 10 chromosomes."],
[4, "Why is cancer linked to cell division?", ["Cancer cells divide by mitosis in an uncontrolled way, forming a tumour", "Cancer cells divide by meiosis", "Cancer cells stop dividing", "Cancer cells have no DNA"], "What goes wrong with the control of the cell cycle?", "Normally mitosis is tightly controlled. In cancer, mutations let cells divide without control, forming tumours."],
[4, "Identical twins form when one zygote splits into two. Why are they genetically identical?", ["The two embryos came from the same zygote, whose cells were made by mitosis", "They came from two different sperm", "They were made by meiosis only", "They share the same gametes by chance"], "One zygote → mitosis.", "Both twins come from the same fertilised egg and develop by mitosis, so their DNA is identical."],
[5, "A gardener wants many copies of a prize-winning rose with exactly the same flower colour. Which method is best, and why?", ["Cuttings, because mitosis produces genetically identical plants", "Seeds, because meiosis produces identical offspring", "Seeds, because they grow faster", "Cuttings, because meiosis mixes genes"], "Which division gives clones?", "Cuttings grow by mitosis, so every new plant is identical to the parent. Seeds (from meiosis and fertilisation) would show variation."],
[5, "Hachiware says: 'Asexual reproduction is always better than sexual reproduction.' Which is the best judgement?", ["Not always: it is fast and keeps good features, but the lack of variation means a new disease could wipe out all the clones", "True: variation is always bad", "False: asexual reproduction is always slower", "True: clones never get diseases"], "Weigh pros and cons.", "Asexual reproduction is fast and needs one parent, but no variation means the population may not survive changes like new diseases."],
[6, "You design a revision table. Which row correctly compares mitosis and meiosis?", ["Mitosis: 1 division, 2 identical diploid cells, growth/repair | Meiosis: 2 divisions, 4 varied haploid cells, gametes", "Mitosis: 2 divisions, gametes | Meiosis: 1 division, repair", "Both: 4 haploid cells", "Mitosis: crossing over | Meiosis: no pairing"], "Divisions, number, ploidy, variation, purpose.", "Mitosis: one division → 2 identical diploid cells. Meiosis: two divisions → 4 genetically different haploid gametes."],
[6, "A scientist wants to test a new drug that stops cancer cells dividing. Which cells would be best to watch in the first lab test?", ["Fast-dividing cells grown in culture, comparing treated and untreated groups", "Red blood cells, which do not divide", "Dead cells", "Only gametes"], "You need dividing cells and a control.", "Use actively dividing cells, compare a treated group with an untreated control and count the proportion of cells in mitosis."]
];

QB.t5s1 = [
[1, "What is an enzyme?", ["A biological catalyst, usually a protein", "A type of sugar", "A hormone made of fat", "A mineral ion"], "It speeds up reactions without being used up.", "Enzymes are biological catalysts, mostly proteins, that speed up reactions in living things."],
[1, "What is the name of the part of an enzyme where the substrate binds?", ["Active site", "Centromere", "Stroma", "Nucleus"], "It's where the action happens!", "The substrate fits into the active site to form an enzyme–substrate complex."],
[2, "How do enzymes speed up reactions?", ["They lower the activation energy needed", "They raise the temperature of the cell", "They add energy to the substrate", "They are used up in the reaction"], "Think of lowering a hurdle.", "Enzymes provide a pathway with lower activation energy, so reactions happen faster at body temperature."],
[2, "What does 'enzymes are specific' mean?", ["Each enzyme acts on only one substrate (or a few similar ones) because of the shape of its active site", "Enzymes work at every temperature", "Enzymes can digest anything", "Enzymes are only found in the stomach"], "Lock and key.", "The active site has a shape complementary to one particular substrate, so each enzyme catalyses one type of reaction."],
[2, "Which process is an example of anabolism?", ["Making proteins from amino acids", "Digesting starch to maltose", "Respiration of glucose", "Breaking down fat"], "Ana- = building up.", "Anabolism builds large molecules from small ones and needs energy, e.g. protein synthesis, photosynthesis."],
[3, "Amylase digests starch but not protein. Which idea best explains this?", ["The shape of amylase's active site is complementary only to starch", "Protein is too small", "Amylase is used up by starch", "Protein has no active site"], "Only the right key fits the lock.", "Amylase's active site fits starch molecules, not proteins, so it can only catalyse starch hydrolysis."],
{ b: 3, q: "The diagram shows an enzyme and three molecules. Which molecule is most likely to be its substrate?", svg: "lockKey", fix: true, choices: ["A", "B", "C", "All of them"], answer: 0,
  hint: "Compare each shape with the notch in the enzyme.", explain: "Molecule A has a shape complementary to the active site, so it can bind and form an enzyme–substrate complex." },
{ b: 3, type: "dial", q: "Classify each process.", labels: ["Respiration", "Photosynthesis", "Digestion"], dials: [["Anabolism", "Catabolism"], ["Anabolism", "Catabolism"], ["Anabolism", "Catabolism"]], answer: [1, 0, 1],
  hint: "Building up = anabolism. Breaking down = catabolism.", explain: "Respiration and digestion break molecules down (catabolism). Photosynthesis builds glucose from CO₂ and water (anabolism)." },
[4, "After a reaction, the amount of enzyme is the same as at the start. What does this show?", ["Enzymes are not used up, so they can be reused many times", "Enzymes are made by the substrate", "No reaction happened", "Enzymes turn into products"], "Catalysts are unchanged at the end.", "Enzymes are unchanged at the end of a reaction and can catalyse the reaction again and again, so only small amounts are needed."],
[4, "How does the induced fit model differ from the lock-and-key model?", ["In induced fit, the active site changes shape slightly as the substrate binds", "In induced fit, any substrate can bind", "In induced fit, the enzyme is used up", "In induced fit, there is no active site"], "Think of a glove fitting a hand.", "The lock-and-key model shows a rigid active site. The induced fit model says the active site moulds slightly around the substrate for a tighter fit."],
[4, "Digestive enzymes are extracellular. What does this mean?", ["They are made inside cells but work outside the cells that made them", "They work only inside the nucleus", "They are made outside cells", "They never leave the mitochondria"], "Extra- = outside.", "Extracellular enzymes are secreted and act outside the cell, e.g. amylase in the mouth. Respiratory enzymes are intracellular."],
[5, "Usagi says: 'Enzymes make reactions happen that would never happen otherwise.' Which is the best judgement?", ["Not quite: enzymes speed up reactions that could happen anyway, by lowering activation energy", "Correct: enzymes create new reactions", "Correct: enzymes add energy", "Wrong: enzymes slow reactions down"], "Catalysts change the RATE.", "Enzymes don't make impossible reactions happen. They speed up reactions by lowering activation energy, so they happen fast enough at body temperature."],
[5, "Which evidence best supports the idea that enzymes are proteins?", ["Enzymes stop working after boiling, just like other proteins that denature", "Enzymes are colourless", "Enzymes dissolve in water", "Enzymes are found in cells"], "What happens to proteins when heated?", "Like other proteins, enzymes lose their function when heated because they denature. (Most enzymes also give a positive Biuret test.)"],
[6, "You draw a comic of how an enzyme works. Which order is correct?", ["Substrate collides with active site → E–S complex forms → reaction happens → products leave → enzyme is free again", "Enzyme is used up → products form → substrate appears", "Products bind → substrate leaves → enzyme dies", "Enzyme binds to any molecule → it explodes"], "The enzyme is reused.", "The substrate binds to the active site forming an E–S complex; it reacts; the products are released; the unchanged enzyme can bind another substrate."],
[6, "Chiikawa wants to show that catalase in potato speeds up breakdown of hydrogen peroxide. Which plan is best?", ["Add equal volumes of H₂O₂ to fresh potato and to boiled potato; compare the volume of oxygen collected in the same time", "Add H₂O₂ to fresh potato only", "Add water to potato", "Heat H₂O₂ with no potato"], "Include a control with denatured enzyme.", "Boiled potato (denatured enzyme) is the control. Keep volumes, temperature and potato mass the same, and compare O₂ produced."]
];
QB.t5s2 = [
[1, "What is the optimum temperature of most human enzymes?", ["About 37 °C", "About 0 °C", "About 60 °C", "About 100 °C"], "Body temperature.", "Most human enzymes work best at about 37 °C, our body temperature."],
[1, "At which pH does pepsin in the stomach work best?", ["About pH 2", "About pH 7", "About pH 9", "About pH 12"], "The stomach contains hydrochloric acid.", "Pepsin works best in acidic conditions, about pH 2."],
[2, "Why does enzyme activity decrease quickly above the optimum temperature?", ["The enzyme denatures: the active site changes shape so the substrate no longer fits", "The substrate evaporates", "The enzyme is used up", "Molecules move more slowly"], "Heat changes protein shape.", "Above the optimum, bonds holding the enzyme's shape break; the active site changes and can no longer bind the substrate."],
[2, "What happens to an enzyme at 4 °C (in a fridge)?", ["It is inactive but not denatured; it works again when warmed", "It is permanently destroyed", "It works faster", "It turns into a substrate"], "Cold slows molecules down.", "At low temperatures, molecules move slowly and collide less, so activity is low, but the enzyme's shape is not damaged."],
[2, "Why does the rate increase as temperature rises from 10 °C to 30 °C?", ["Molecules gain kinetic energy and collide more often with the active site", "The enzyme denatures", "The substrate is used up faster", "pH falls"], "More energy, more collisions.", "Higher temperature gives molecules more kinetic energy, so more successful collisions between enzyme and substrate happen per second."],
{ b: 3, svg: "tempGraph", fix: true, q: "On the graph, which point shows the optimum temperature?", choices: ["Point B", "Point A", "Point C", "None of them"], answer: 0, hint: "The highest point.", explain: "Point B is the peak of the curve: the temperature at which the rate is highest." },
[3, "Trypsin works in the small intestine. Which pH suits it best?", ["About pH 8 (slightly alkaline)", "About pH 2", "About pH 5", "About pH 12"], "Pancreatic juice and bile are alkaline.", "Trypsin works best in slightly alkaline conditions (about pH 8) in the small intestine."],
{ b: 3, type: "dial", q: "Look at the pH graph. Set each dial.", svg: "phGraph", labels: ["Enzyme P is likely", "Enzyme Q is likely", "Optimum pH of Q"], dials: [["Pepsin", "Trypsin"], ["Pepsin", "Trypsin"], ["About 2", "About 8"]], answer: [0, 1, 1],
  hint: "P peaks in acid; Q peaks in slightly alkaline conditions.", explain: "P peaks at about pH 2 (pepsin in the stomach). Q peaks at about pH 8 (trypsin in the small intestine)." },
{ b: 4, q: "On the temperature graph, why does the rate fall between B and C?", svg: "tempGraph", fix: true, choices: ["The enzyme is being denatured", "The substrate has run out", "Molecules move more slowly", "The pH becomes neutral"], answer: 0,
  hint: "B to C is above the optimum.", explain: "Above the optimum temperature the enzyme's active site changes shape (denaturation), so fewer E–S complexes form and the rate falls." },
{ b: 4, q: "On the substrate graph, what limits the rate at point Y?", svg: "substrateGraph", fix: true, choices: ["Enzyme concentration (all active sites are occupied)", "Substrate concentration", "The enzyme has been denatured", "There is no substrate"], answer: 0,
  hint: "Adding more substrate at Y doesn't raise the rate.", explain: "At Y, all active sites are busy, so extra substrate cannot increase the rate. Enzyme concentration is the limiting factor. At X, substrate concentration is limiting." },
[4, "Two tubes of starch + amylase are kept at 0 °C and 80 °C for 10 minutes, then both moved to 37 °C. What happens?", ["The 0 °C tube starts digesting starch; the 80 °C tube does not", "Both tubes digest starch", "Neither tube digests starch", "Only the 80 °C tube digests starch"], "Cold = inactive; hot = denatured.", "At 0 °C the enzyme was only inactive, so it works when warmed. At 80 °C it was denatured permanently."],
[5, "A student tests amylase at 20, 40 and 60 °C and concludes the optimum is exactly 40 °C. Evaluate.", ["The conclusion is too precise; more temperatures near 40 °C (e.g. 30, 35, 45 °C) are needed", "The conclusion is certainly correct", "The optimum must be 60 °C", "Temperature does not affect amylase"], "Big gaps between temperatures hide the true peak.", "With only three widely spaced temperatures, the true optimum could be anywhere between 20 and 60 °C. Test smaller intervals near the highest rate."],
[5, "Usagi says: 'Boiling an enzyme is the same as putting it in the fridge, because both stop it working.' Evaluate.", ["Wrong: boiling denatures it permanently; cold only makes it inactive temporarily", "Correct: both destroy the enzyme", "Correct: both speed it up", "Wrong: the fridge denatures it"], "Can each one recover?", "Boiling changes the active site shape permanently. Cold slows molecules; the enzyme works again when warmed."],
[6, "You investigate the effect of pH on amylase. Which plan is best?", ["Use buffer solutions of different pH; keep amylase volume, starch concentration and temperature the same; time how long until iodine no longer turns blue-black", "Change pH and temperature at the same time", "Use one pH only", "Add different enzymes at each pH"], "Change ONE variable; measure an end point.", "Buffers control pH; all other variables are kept constant. The time for starch to disappear (iodine stays brown) measures the rate."],
[6, "A factory uses an enzyme from bacteria living in hot springs. Why is this a good idea?", ["The enzyme has a high optimum temperature, so reactions can run fast at high temperatures without denaturing it", "Hot-spring enzymes work only in the cold", "It is cheaper to boil enzymes", "Bacteria enzymes never denature at any temperature"], "Enzymes are adapted to their habitat.", "Enzymes from organisms in hot springs are stable at high temperatures, so industrial processes can run hot and fast."]
];
QB.t5s3 = [
[1, "What does an enzyme inhibitor do?", ["It slows down or stops enzyme activity", "It speeds up the enzyme", "It becomes the product", "It makes more enzyme"], "Inhibit = hold back.", "Inhibitors reduce the rate of enzyme-catalysed reactions."],
[1, "Which enzyme is added to milk to make lactose-free milk?", ["Lactase", "Pepsin", "Amylase", "Lipase"], "Enzymes are often named after their substrate.", "Lactase breaks lactose into glucose and galactose, so people who are lactose intolerant can drink the milk."],
[2, "How does a competitive inhibitor work?", ["It has a similar shape to the substrate and binds to the active site", "It binds elsewhere and changes the enzyme's shape", "It raises the temperature", "It destroys the substrate"], "It competes for the same place.", "A competitive inhibitor resembles the substrate and occupies the active site, blocking the substrate."],
[2, "How does a non-competitive inhibitor work?", ["It binds to a site other than the active site and changes the active site's shape", "It fits into the active site", "It adds more substrate", "It lowers the pH only"], "Non-competitive = doesn't compete for the active site.", "It binds elsewhere on the enzyme, changing the active site so the substrate no longer fits well."],
[2, "Why does biological washing powder contain proteases?", ["To break down protein stains such as blood and egg", "To remove sugar from clothes", "To make clothes smell nice", "To bleach clothes"], "Protease acts on protein.", "Proteases hydrolyse proteins in stains into soluble amino acids and peptides that wash away."],
[3, "Adding more substrate reduces the effect of an inhibitor. What type of inhibitor is it most likely to be?", ["Competitive", "Non-competitive", "A denaturing agent", "A coenzyme"], "More substrate out-competes it.", "With more substrate, the substrate is more likely to reach the active site than the competitive inhibitor."],
[3, "Why should biological washing powder be used in warm water (about 40 °C) and not boiling water?", ["The enzymes would be denatured in boiling water", "Boiling water makes the powder dissolve too slowly", "Enzymes work best in freezing water", "Stains dissolve only in cold water"], "Enzymes have an optimum temperature.", "Boiling denatures the enzymes. At warm temperatures they work well and save energy compared with very hot washes."],
{ b: 3, type: "dial", q: "Match each enzyme to its use.", labels: ["Pectinase", "Protease", "Lactase"], dials: [["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"], ["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"], ["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"]], answer: [0, 1, 2],
  hint: "Pectin is in fruit cell walls; meat is protein.", explain: "Pectinase breaks down pectin to release more, clearer juice; protease tenderises meat; lactase makes lactose-free milk." },
[4, "Cyanide stops a respiratory enzyme, and more substrate cannot reverse it. Which best describes cyanide?", ["A non-competitive inhibitor", "A competitive inhibitor", "A substrate", "A catalyst"], "More substrate doesn't help.", "Because adding substrate does not overcome it, cyanide acts as a non-competitive inhibitor (it binds away from the active site)."],
[4, "With a competitive inhibitor present, the maximum rate is still reached at very high substrate concentration. What does this tell you?", ["At high substrate concentration, substrate molecules out-compete the inhibitor for active sites", "The inhibitor denatures the enzyme", "The enzyme is used up", "The inhibitor has become a product"], "Who wins the race to the active site?", "With lots of substrate, the chance of substrate (not inhibitor) binding is high, so the maximum rate can still be reached."],
[4, "Why is pectinase added when making apple juice?", ["It breaks down pectin in cell walls, so more juice is released and it is clearer", "It adds sugar", "It kills bacteria", "It makes the juice fizzy"], "Pectin holds plant cells together.", "Pectinase hydrolyses pectin, breaking down cell walls to release more juice and reduce cloudiness."],
[5, "Momonga says: 'Enzymes in industry are always better than chemical catalysts.' Which is the best judgement?", ["Often better (specific, work at low temperature, save energy), but they can be denatured and may be expensive to purify", "Always better in every way", "Always worse", "They are the same as chemical catalysts"], "Consider pros and cons.", "Enzymes are specific and work under mild conditions, saving energy. But they are sensitive to temperature and pH, and can be costly."],
[5, "A company claims its washing powder works 'at any temperature'. Which is the best evaluation?", ["Unlikely: enzymes have an optimum temperature and are denatured at high temperatures", "Correct: enzymes work at all temperatures", "Correct: enzymes are not proteins", "Wrong: enzymes work only below 0 °C"], "Remember the temperature graph.", "Enzymes have a limited working range: low activity when cold and denatured when very hot. The claim is misleading."],
[6, "You want to test if a substance X is a competitive inhibitor of an enzyme. Which plan is best?", ["Measure the rate with and without X at several substrate concentrations; if X's effect disappears at high substrate, it is competitive", "Measure the rate with X at one substrate concentration only", "Boil the enzyme with X", "Add X to the product"], "Look at what happens at high substrate.", "A competitive inhibitor's effect decreases as substrate concentration increases. Comparing rates at many concentrations reveals this."],
[6, "Chiikawa invents a stain-removing spray. Which recipe is best for an egg-and-butter stain on a cotton shirt?", ["Protease + lipase, used in warm water", "Amylase only, used in boiling water", "Lactase only", "Pectinase in cold water"], "Egg = protein; butter = fat.", "Protease breaks down egg protein and lipase breaks down butter fat. Warm water keeps the enzymes active without denaturing them."]
];

QB.t6s1 = [

[2, "What is the function of the stomata?", ["To allow gas exchange (CO₂ in, O₂ out)", "To absorb light", "To transport water up the stem", "To store starch"], "Tiny pores in the leaf surface.", "Stomata let CO₂ diffuse in for photosynthesis and O₂ out; water vapour also escapes through them."],

[3, "Why are there large air spaces in the spongy mesophyll?", ["To allow CO₂ and O₂ to diffuse quickly to and from mesophyll cells", "To make the leaf float", "To store starch", "To absorb light"], "Gases move faster through air.", "Air spaces connect to the stomata, so CO₂ reaches all mesophyll cells quickly and O₂ can leave."],
[3, "Why is the upper epidermis transparent and without chloroplasts?", ["So light can pass through to the palisade cells below", "So the leaf looks white", "To stop gas exchange", "To make starch"], "The palisade layer needs the light.", "A transparent epidermis lets most light pass to the palisade mesophyll, where most photosynthesis happens."],

  hint: "Top layer is thin; column cells come next; round loose cells below.", explain: "A is the upper epidermis, B the palisade mesophyll (tall, many chloroplasts), C the spongy mesophyll (loose, air spaces). D shows a stoma between guard cells." },

[5, "Usagi says: 'Plants get their food from the soil.' Which is the best correction?", ["Plants make their own food (glucose) by photosynthesis from CO₂ and water; the soil supplies water and mineral ions only", "Correct: soil is plant food", "Plants eat insects for all food", "Plants get sugar from rain"], "Where does the carbon in glucose come from?", "Plants are autotrophs: they make glucose from CO₂ (air) and water using light. Soil gives water and minerals, not food."],
[5, "A student says: 'Closing stomata on a hot day is always good for a plant.' Which is the best evaluation?", ["Partly true: it saves water, but it also cuts off CO₂ supply, so photosynthesis slows", "Always true: plants never need CO₂", "Always false: stomata never close", "True, because O₂ enters through the roots"], "Think of both gases and water.", "Closing stomata reduces water loss but also stops CO₂ diffusing in, so there is a trade-off between saving water and photosynthesis."],

];

[4, "Why is it useful for a plant to have several different pigments?", ["They absorb a wider range of wavelengths, so more light energy can be used", "They make the leaf heavier", "They stop the leaf from wilting", "They are needed for respiration"], "Each pigment has its own absorption peaks.", "Different pigments absorb different wavelengths, so together they capture more of the light spectrum."],
[4, "Thylakoids are stacked into grana. What is the advantage?", ["A large membrane surface area for pigments to absorb light", "It stores more water", "It makes the chloroplast smaller", "It lets CO₂ in faster"], "More membrane, more pigment.", "Stacking gives a very large area of membrane holding pigments and the carriers for the light-dependent reactions."],
[4, "In a chromatogram, carotene travels furthest up the paper. What does this suggest?", ["Carotene is the most soluble in the solvent", "Carotene is the heaviest pigment", "Carotene is green", "Carotene does not dissolve at all"], "The solvent carries soluble pigments further.", "Pigments that are more soluble in the solvent are carried further up the paper."],
[5, "A student says: 'Chlorophyll absorbs green light best, which is why leaves are green.' Evaluate.", ["Wrong: leaves look green because chlorophyll reflects green light; it absorbs red and blue best", "Correct", "Wrong: chlorophyll absorbs all light equally", "Wrong: leaves are green because of the cell wall"], "What colour do we see: the absorbed or reflected light?", "We see the colour that is reflected. Chlorophyll absorbs mostly red and blue light and reflects green."],
[5, "Momonga says: 'White flowers can't photosynthesise, so the whole plant can't.' Which is the best judgement?", ["Wrong: the green leaves still contain chlorophyll and photosynthesise; petals are not the main site", "Correct: flowers do all the photosynthesis", "Correct: white plants never photosynthesise", "Wrong: plants photosynthesise in the roots"], "Where is chlorophyll found?", "Photosynthesis happens mainly in green leaves. White petals lack chlorophyll, but that doesn't affect the leaves."],
[6, "A farmer asks why a greenhouse should use red and blue LED lights instead of green lights. Which answer is best?", ["Chlorophyll absorbs red and blue best, so these colours drive the light-dependent reactions most efficiently", "Green light is too hot", "Red and blue lights make oxygen directly", "Plants cannot see green"], "Match light to what chlorophyll absorbs.", "Chlorophyll absorbs red and blue strongly and reflects green, so red/blue light gives more photosynthesis per unit of electricity."],
[6, "You want to show which colour of light gives the fastest photosynthesis. Which plan is best?", ["Put the same pondweed under a lamp with red, blue and green filters in turn, at the same distance and temperature; count O₂ bubbles per minute", "Use a different plant for each colour and change the distance", "Only use white light", "Count leaves instead of bubbles"], "Change only the colour.", "Keep plant, lamp distance and temperature the same; change only the colour filter; count bubbles (or collect O₂) and repeat."]

QB.t6s3 = [
[1, "Where do the light-dependent reactions happen?", ["On the thylakoid membranes (grana)", "In the stroma", "In the mitochondria", "In the nucleus"], "Where is the chlorophyll?", "Light-dependent reactions happen on the thylakoid membranes of the grana, where chlorophyll absorbs light."],
[1, "Which gas is released in the light-dependent reactions?", ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"], "It's the gas we breathe in.", "Oxygen is released as a by-product when water is split by light (photolysis)."],
[2, "What is photolysis?", ["The splitting of water molecules using light energy", "The splitting of glucose", "The fixing of carbon dioxide", "The making of starch"], "Photo = light; lysis = splitting.", "In photolysis, light energy splits water into hydrogen ions, electrons and oxygen."],
[2, "Which TWO products of the light-dependent reactions are used in the Calvin cycle?", ["ATP and NADPH", "Oxygen and water", "Glucose and CO₂", "Starch and RuBP"], "One gives energy, one gives hydrogen.", "ATP supplies energy and NADPH supplies hydrogen (reducing power) to reduce GP to triose phosphate."],
[2, "Where does the oxygen released in photosynthesis come from?", ["Water", "Carbon dioxide", "Glucose", "Chlorophyll"], "Which molecule is split by light?", "The O₂ comes from the photolysis of water, not from CO₂.", "Examiners love this! O₂ comes from WATER."],
[3, "What happens to NADP in the light-dependent reactions?", ["It accepts hydrogen and becomes NADPH", "It releases oxygen", "It absorbs light", "It combines with CO₂"], "NADP is a hydrogen carrier.", "NADP is reduced to NADPH by hydrogen from photolysis; NADPH carries the hydrogen to the Calvin cycle."],
[3, "Chiikawa puts pondweed in a dark cupboard. Why does bubbling stop almost at once?", ["Without light there is no photolysis, so no oxygen is released", "The water turns cold immediately", "CO₂ runs out", "The plant dies instantly"], "Which step needs light directly?", "Photolysis and the light-dependent reactions need light directly, so O₂ production stops in darkness."],
{ b: 3, type: "dial", q: "Where does each happen?", labels: ["Photolysis of water", "Carbon fixation", "ATP made using light"], dials: [["Thylakoids", "Stroma"], ["Thylakoids", "Stroma"], ["Thylakoids", "Stroma"]], answer: [0, 1, 0],
  hint: "Anything needing light happens where chlorophyll is.", explain: "Photolysis and ATP production (light-dependent) happen on the thylakoids; carbon fixation (Calvin cycle) happens in the stroma." },
[4, "Why can the light-dependent reactions be described as changing light energy into chemical energy?", ["Light energy is used to make ATP and NADPH, which store energy in chemical bonds", "Light turns into oxygen", "Light turns into water", "Light is stored in chlorophyll forever"], "Where does the light energy end up?", "The energy of absorbed light is trapped in ATP and NADPH, chemical molecules that fuel the Calvin cycle."],
[4, "A chemical that stops photolysis is added to chloroplasts in light. What happens to ATP and NADPH production?", ["Both fall, because the electrons and hydrogen from water are no longer supplied", "Both rise", "Only oxygen rises", "Nothing changes"], "Water is the source of electrons and hydrogen.", "Photolysis supplies the electrons and hydrogen ions needed; without it, NADPH (and most ATP) cannot be made."],
[4, "In bright light, the rate of O₂ release from a leaf is used to measure photosynthesis. Why might it UNDER-estimate the true rate?", ["Some O₂ produced is used immediately by the leaf's own respiration", "Leaves release extra O₂ at night", "O₂ is heavier than air", "Water blocks the O₂"], "Cells respire all the time.", "Part of the O₂ made is used by mitochondria in respiration, so the measured release is the net rate."],
[5, "Scientists gave a plant water containing a special oxygen isotope (¹⁸O). The released O₂ contained ¹⁸O. What does this show?", ["The oxygen released comes from water (photolysis)", "The oxygen comes from CO₂", "Water is not used in photosynthesis", "Oxygen is made from glucose"], "Follow the labelled atom.", "If labelled oxygen in water ends up in the released O₂, the O₂ must come from splitting water in the light-dependent reactions."],
[5, "Usagi says: 'The light-dependent reactions make sugar.' Which is the best correction?", ["They make ATP, NADPH and O₂; sugar is made later in the Calvin cycle in the stroma", "Correct: sugar is made on the thylakoids", "They make only CO₂", "They make starch directly"], "Which stage fixes CO₂?", "Sugar needs carbon from CO₂, which is fixed in the Calvin cycle. The light reactions only supply ATP and NADPH (and release O₂)."],
[6, "You write a comic strip of the light-dependent reactions. Which order of panels is correct?", ["Chlorophyll absorbs light → water is split → O₂ released, hydrogen reduces NADP → ATP made → ATP and NADPH go to the stroma", "CO₂ is fixed → glucose made → light absorbed", "O₂ is absorbed → water made → light released", "Starch is broken down → light made"], "Start with light being absorbed.", "Light is absorbed, water is photolysed (O₂ released), NADPH and ATP are made, then passed to the Calvin cycle."],
[6, "You design an experiment to show that oxygen comes from photolysis of water and needs light. Which plan is best?", ["Put identical pondweed in two tubes of the same water; one in light, one wrapped in foil; collect and compare the gas made", "Put pondweed in two tubes both in darkness", "Use one tube in light only", "Remove the water from the tube"], "Change only the light.", "The light tube makes O₂ but the dark control does not, showing light is needed for O₂ release."]

QB.t6s4 = [
[1, "Where does the Calvin cycle (light-independent reactions) happen?", ["In the stroma", "On the thylakoids", "In the cytoplasm", "In the cell wall"], "The fluid part of the chloroplast.", "The Calvin cycle happens in the stroma, which contains the enzymes needed to fix CO₂."],
[1, "Which gas is fixed in the Calvin cycle?", ["Carbon dioxide", "Oxygen", "Nitrogen", "Water vapour"], "It enters through the stomata.", "CO₂ is fixed by combining with RuBP in the stroma."],
[2, "What is carbon fixation?", ["Joining CO₂ to RuBP to form GP", "Splitting water with light", "Making ATP with light", "Releasing CO₂ in respiration"], "Fixing = joining the gas into an organic compound.", "CO₂ combines with the 5-carbon RuBP, forming two molecules of 3-carbon glycerate 3-phosphate (GP)."],
[2, "Why is the Calvin cycle called a CYCLE?", ["RuBP is regenerated so it can fix more CO₂", "It goes round the chloroplast", "It happens only at night", "It releases oxygen in circles"], "What happens to most triose phosphate?", "Most triose phosphate is used to remake RuBP, which can accept CO₂ again, so the reactions repeat."],
[2, "Which enzyme-controlled stage turns GP into triose phosphate?", ["Reduction using ATP and NADPH", "Photolysis using light", "Oxidation using oxygen", "Hydrolysis using water"], "GP gains hydrogen.", "GP is reduced to triose phosphate using ATP (energy) and NADPH (hydrogen)."],
[3, "CO₂ first combines with which compound in the Calvin cycle?", ["RuBP (a 5-carbon compound)", "Glucose", "ATP", "Oxygen"], "It's regenerated at the end of the cycle.", "CO₂ combines with RuBP (carbon fixation) to form 2 molecules of glycerate 3-phosphate (GP)."],
[3, "What is GP converted into, using ATP and NADPH?", ["Triose phosphate", "RuBP directly without energy", "Oxygen", "Water"], "A 3-carbon sugar.", "GP is reduced to triose phosphate using ATP and NADPH. Triose phosphate is used to make glucose and to regenerate RuBP."],
[3, "Why does the rate of the Calvin cycle rise with temperature (up to a point)?", ["It is controlled by enzymes, which work faster when warmer", "It uses light energy directly", "CO₂ becomes hotter", "Water evaporates faster"], "What controls the reactions?", "The Calvin cycle is a series of enzyme-controlled reactions, so it speeds up with temperature until enzymes start to denature."],
[4, "A plant is moved from light into darkness. What happens to GP and RuBP soon after?", ["GP builds up and RuBP decreases", "RuBP builds up and GP decreases", "Both increase", "Both stay the same"], "No ATP and NADPH → GP can't be reduced.", "Without light, no ATP or NADPH is made, so GP cannot be converted to triose phosphate (GP accumulates) and RuBP isn't regenerated (it falls)."],
[4, "The CO₂ concentration suddenly drops, but light stays bright. What happens to RuBP?", ["RuBP builds up because less is used to fix CO₂", "RuBP decreases", "RuBP turns into oxygen", "No change"], "RuBP is the CO₂ acceptor.", "With less CO₂, less RuBP is used in fixation, while it is still regenerated from triose phosphate, so RuBP accumulates."],
[4, "Why are the light-independent reactions sometimes wrongly called 'dark reactions'?", ["They don't need light directly, but they need ATP and NADPH from the light reactions, so they stop soon in the dark", "They only happen at night", "They happen in dark mitochondria", "They make darkness"], "Do they really happen in darkness?", "They do not use light directly, but they depend on products of the light reactions, so they run in the light and soon stop in the dark."],
[5, "Hachiware says: 'The glucose made in photosynthesis is only used for respiration.' Evaluate.", ["Incomplete: it is also turned into starch (storage), sucrose (transport), cellulose (cell walls), amino acids and lipids", "Correct: plants only respire glucose", "Wrong: plants don't use glucose", "Wrong: glucose is turned into oxygen"], "What else do plants need to build?", "Triose phosphate and glucose are used for respiration and to make starch, sucrose, cellulose, amino acids (with nitrate) and lipids."],
[5, "Why do plants store starch rather than glucose in their cells?", ["Starch is insoluble, so it does not affect osmosis and stays in place", "Starch is sweeter", "Glucose cannot be made in leaves", "Starch releases oxygen"], "Think about water potential.", "Starch is insoluble and compact, so large amounts can be stored without drawing water into the cells by osmosis."],
[6, "You draw a flow chart of photosynthesis. Which is correct?", ["Light + H₂O → (thylakoids) → O₂ + ATP + NADPH → (stroma) CO₂ + RuBP → GP → triose phosphate → glucose / RuBP", "CO₂ → O₂ directly in the thylakoids", "Glucose → CO₂ + H₂O in the stroma", "ATP → light → water"], "Two linked stages.", "Light reactions make O₂, ATP and NADPH; the Calvin cycle uses them to fix CO₂ into GP, then triose phosphate, glucose and RuBP."],
[6, "A student wants to show that CO₂ is fixed into sugar. Which plan would give the clearest evidence?", ["Supply the plant with CO₂ containing radioactive carbon, then detect radioactivity in GP and sugars over time", "Measure leaf length", "Count stomata", "Test the leaf with Benedict's only"], "Follow the carbon atoms.", "Labelled carbon from CO₂ appears first in GP, then in triose phosphate and sugars, showing the path of carbon fixation."]
];

[1, "Which of these is a limiting factor of photosynthesis?", ["Light intensity", "Oxygen concentration", "Soil colour", "Leaf shape"], "Photosynthesis needs light, CO₂ and a suitable temperature.", "The main limiting factors are light intensity, CO₂ concentration and temperature."],
[1, "What is a limiting factor?", ["The factor in shortest supply that holds back the rate", "The factor in largest supply", "A factor that always stops photosynthesis", "The colour of the leaf"], "Think of the slowest runner in a relay.", "The rate is limited by whichever factor is in shortest supply at that moment."],
[2, "Light intensity mainly affects which stage of photosynthesis?", ["The light-dependent reactions", "Carbon fixation only", "Starch storage", "Respiration"], "Light is absorbed on the thylakoids.", "More light means more ATP and NADPH made in the light-dependent reactions."],
[2, "CO₂ concentration mainly affects which step?", ["Carbon fixation in the Calvin cycle", "Photolysis of water", "Absorption of light", "Release of oxygen"], "CO₂ is fixed with RuBP.", "CO₂ is a substrate for carbon fixation, so low CO₂ slows the Calvin cycle."],
[2, "Why does the rate of photosynthesis fall at very high temperatures (e.g. 45 °C)?", ["Enzymes of the Calvin cycle are denatured", "Light becomes weaker", "CO₂ disappears", "Chlorophyll turns red"], "Photosynthesis is enzyme-controlled.", "Above the optimum, the enzymes lose their shape (denature), so the Calvin cycle slows."],

[3, "In winter, a greenhouse is warm and bright, but yield is still low. What is most likely limiting?", ["CO₂ concentration", "Light intensity", "Temperature", "Water only"], "Warm and bright are already dealt with.", "If light and temperature are high, the most likely limiting factor is CO₂; farmers burn paraffin to add CO₂."],

[4, "A student counts bubbles from pondweed with a lamp at different distances. Why is a beaker of water placed between the lamp and the plant?", ["To absorb heat from the lamp so temperature stays constant", "To give the plant water", "To make more light", "To add CO₂"], "Temperature must not change.", "The water absorbs heat, so only light intensity changes, not temperature: a fair test."],
[5, "A student concludes: 'Moving the lamp from 10 cm to 20 cm halved the bubbling, so light intensity halved.' Evaluate.", ["Not correct: light intensity falls with distance faster than halving (about 1/d²), and counting bubbles is not very accurate", "Correct: intensity is proportional to distance", "Correct: bubbles are always exact", "Wrong: distance has no effect"], "Think about the inverse square law and bubble sizes.", "Light intensity is roughly proportional to 1/d², so doubling the distance gives about a quarter. Bubbles also vary in size, so collecting gas volume is more accurate."],
[5, "A farmer adds CO₂ to a greenhouse but the yield does not increase on a dull winter day. Which is the best explanation?", ["Light intensity is the limiting factor, so extra CO₂ has no effect", "CO₂ is poisonous to plants", "Plants don't use CO₂", "The temperature is too high"], "Only the limiting factor matters.", "On dull days light is limiting; adding CO₂ won't raise the rate until light is increased too."],
[6, "A greenhouse owner wants the highest yield at the lowest cost. Which strategy is best?", ["Monitor light, CO₂ and temperature, and increase whichever is limiting, without wasting money on factors that are not limiting", "Always heat to 45 °C", "Always add the maximum CO₂ regardless of light", "Turn off all lights to save money"], "Spend money on the limiting factor.", "Raising a non-limiting factor wastes money. Increase the factor that is actually limiting (and keep temperature below the level that denatures enzymes)."],
[6, "You investigate how CO₂ concentration affects photosynthesis in pondweed. Which plan is best?", ["Add different concentrations of sodium hydrogencarbonate to the water; keep lamp distance and temperature the same; count bubbles per minute and repeat", "Change the lamp distance and CO₂ at the same time", "Use a different plant for each concentration without repeats", "Measure the leaf colour"], "Sodium hydrogencarbonate releases CO₂ in water.", "Varying sodium hydrogencarbonate changes CO₂ supply. Keeping light and temperature constant makes it a fair test."]

[2, "What is glucose broken down into during glycolysis?", ["Two molecules of pyruvate", "Carbon dioxide and water", "Lactic acid only", "Six molecules of CO₂"], "A 6-carbon molecule splits into two 3-carbon molecules.", "Glycolysis splits glucose (6C) into 2 pyruvate (3C), with a net gain of 2 ATP."],

[5, "A student claims 'respiration is the same as breathing'. Which is the best correction?", ["Breathing moves air in and out of the lungs; respiration is a chemical process in cells that releases energy from food", "They are the same thing", "Breathing happens in cells", "Respiration only happens in the lungs"], "One is a physical movement; one is chemistry.", "Breathing (ventilation) is the movement of air. Respiration is a series of enzyme-controlled reactions in every living cell."],
[6, "You design a comic journey of a glucose molecule in aerobic respiration. Which path is correct?", ["Cytoplasm (glycolysis → pyruvate) → matrix (Krebs cycle, CO₂ released) → cristae (oxidative phosphorylation, O₂ → water, most ATP)", "Matrix → cytoplasm → nucleus", "Chloroplast → matrix → cytoplasm", "Cristae → cytoplasm → matrix"], "Follow the order of the stages.", "Glucose is split in the cytoplasm; pyruvate enters the matrix for the Krebs cycle; NADH delivers hydrogen to the cristae where O₂ forms water and most ATP is made."],
[6, "Chiikawa wants to explain why a runner needs oxygen. Which explanation is best?", ["Oxygen allows aerobic respiration, which releases much more ATP per glucose for muscle contraction than anaerobic respiration", "Oxygen gives the muscles sugar", "Oxygen stops lactic acid being made in the lungs", "Oxygen turns fat into muscle"], "Compare ATP yields.", "With oxygen, glucose is fully broken down, releasing far more ATP than glycolysis alone. More ATP powers more contraction."]

{ b: 3, type: "dial", q: "Set each dial for anaerobic respiration.", labels: ["In muscles: product", "In yeast: products", "ATP per glucose"], dials: [["Lactic acid", "Ethanol + CO₂", "CO₂ + water"], ["Lactic acid", "Ethanol + CO₂", "CO₂ + water"], ["2", "About 30+"]], answer: [0, 1, 0],

  hint: "Which liquid goes milky with a gas?", explain: "Y is limewater. It turns milky because the yeast produces CO₂ in anaerobic respiration." },

[5, "Hachiware says: 'Anaerobic respiration is useless because it makes so little ATP.' Evaluate.", ["Not true: it gives a quick burst of energy when oxygen is short, and is useful to humans in baking, brewing and yoghurt", "True: it has no use at all", "True: only plants do it", "False: it makes more ATP than aerobic respiration"], "Think of sprinting and bread.", "Although inefficient, anaerobic respiration lets muscles keep working briefly without enough oxygen, and humans use fermentation to make food and drinks."],
[5, "A student sets up yeast + glucose at 35 °C and yeast + glucose at 80 °C. Only the 35 °C tube bubbles. Which conclusion is best?", ["At 80 °C, the yeast's enzymes were denatured, so respiration stopped", "Yeast only respires at night", "Glucose melts at 80 °C", "CO₂ cannot form at high temperature"], "Respiration is controlled by enzymes.", "Respiration is enzyme-controlled. At 80 °C, enzymes are denatured and yeast cells die, so no CO₂ is produced."],

{ b: 4, type: "dial", q: "Compare aerobic and anaerobic respiration (in muscles).", labels: ["Oxygen needed?", "ATP per glucose", "Waste product"], dials: [["Aerobic only", "Both", "Neither"], ["Aerobic: much more", "Anaerobic: much more"], ["Aerobic: CO₂ + water; anaerobic: lactic acid", "Aerobic: lactic acid; anaerobic: CO₂"]], answer: [0, 0, 0],

[5, "A student concludes from the vacuum flask experiment: 'Germinating seeds respire faster than dry seeds.' The student only used germinating and boiled seeds. Evaluate.", ["Not supported: dry (living) seeds were not tested, so no comparison with them can be made", "Fully supported by the results", "Wrong: boiled seeds respire the most", "Wrong: seeds cannot respire"], "What was actually compared?", "The experiment only compared living germinating seeds with dead seeds. To compare with dry seeds, a flask of dry living seeds is needed."],
[5, "Usagi says: 'Plants give out CO₂ only at night.' Which is the best judgement?", ["Misleading: plants respire and release CO₂ all the time; in bright light, photosynthesis uses more CO₂ than respiration makes, so no net CO₂ is released", "Correct: plants respire only at night", "Wrong: plants never release CO₂", "Correct: light stops respiration"], "Does respiration stop in the day?", "Respiration never stops. In the day, photosynthesis usually exceeds respiration, so there is a net uptake of CO₂ instead."],

const normWord = w => String(w || "").toLowerCase().replace(/[^a-z]/g, "");
const countLetters = w => normWord(w).length;
function spellBoxes(word, typed) {
  const t = normWord(typed); let k = 0;
  return [...word].map((ch, j) => /[a-z]/i.test(ch) ? `<i class="${t[k] ? "f" : ""}">${esc(t[k] ? t[k++] : (j === 0 ? ch.toLowerCase() : ""))}</i>` : ch === " " ? `<i class="gap"></i>` : `<i class="gap">${esc(ch)}</i>`).join("");
}
function misspell(w) {
  const out = new Set(), sw = (a, i) => a.slice(0, i) + a[i + 1] + a[i] + a.slice(i + 2);
  const V = { a: "e", e: "i", i: "e", o: "u", u: "o", y: "i" };
  for (let i = w.length - 3; i >= 2 && out.size < 2; i--) if (w[i] !== w[i + 1]) out.add(sw(w, i));
  const dbl = w.search(/([a-z])\1/); if (dbl > 0) out.add(w.slice(0, dbl) + w.slice(dbl + 1)); else { const c = w.search(/[^aeiou][aeiou]/); if (c > 0) out.add(w.slice(0, c + 1) + w[c] + w.slice(c + 1)); }
  for (let i = 1; i < w.length - 1 && out.size < 5; i++) if (V[w[i]]) out.add(w.slice(0, i) + V[w[i]] + w.slice(i + 1));
  return [...out].filter(x => x !== w).slice(0, 3);
}
function buildPools() {
  ROOMS.forEach(r => {
    r.pool = (QB[r.id] || []).map((q, j) => Array.isArray(q)
      ? { id: "q" + j, b: q[0], type: "mc", q: q[1], choices: q[2], answer: 0, hint: q[3], explain: q[4], tip: q[5] }
      : Object.assign({ type: "mc", answer: 0 }, q, { id: "q" + j }));
    r.terms.forEach(([t, m], j) => {
      const core = normWord(t);
      if (core.length < 5 || /[A-Z]{2}|\d/.test(t) || normWord(m).includes(core)) return;
      r.pool.push({ id: "s" + j, b: 1, type: "spell", gen: "spell", q: `Spell the term: “${m}”`, answer: t, hint: `It starts with “${t.slice(0, 3)}…” and has ${core.length} letters.`, explain: `${t}: ${m}.` });
      if (/^[a-z]+$/.test(t) && t.length >= 6) { const bad = misspell(t); if (bad.length === 3) r.pool.push({ id: "m" + j, b: 1, type: "mc", gen: "spellmc", fix: false, q: `Which spelling is correct? (${m})`, choices: [t, ...bad], answer: 0, hint: "Say it slowly, syllable by syllable.", explain: `The correct spelling is “${t}”.` }); }
    });
    r.pool.forEach(p => { p.rid = r.id; });
  });
}

/* Save code: 12 characters of Crockford base32 (no I, L, O, U), shown as ABCD-EFGH-JKLM.

   the stage in progress and its locks solved (0–4); streak (1–31) and shields (0–3).
   The packed number n (< CODE_M) is multiplied by a constant modulo a large prime P, so codes look random,

const CODE_P = 1152921504606846883n;               // largest prime below 2^60 = 32^12

  return ((s0 % m) + m) % m;
}
const CODE_KINV = modInvBig(CODE_K, CODE_P);

}
const stagesDone = ti => topicRooms(ti).filter(r => S.completed_rooms.includes(r.id)).length;
function topicStars(ti) {

}

// Daily streak: same day → no change; next day → +1; missed days → shields cover them, else restart at 1.
function checkIn() {
  const t = today();
  if (S.last_login_date !== t) S.stats.days += 1;
  if (!S.last_login_date) { S.current_streak = 1; streakNote = "🔥 Day 1 of your streak!"; }
  else if (S.last_login_date !== t) {
    const gap = dayNum(t) - dayNum(S.last_login_date);
    if (gap === 1) { S.current_streak += 1; streakNote = `🔥 Streak up! ${S.current_streak} days in a row.`; }
    else if (gap > 1) {
      const missed = gap - 1;
      if (S.streak_shields >= missed) { S.streak_shields -= missed; S.current_streak += 1; streakNote = `🛡️ Hachiware used ${missed} shield${missed > 1 ? "s" : ""} to protect your streak! Now ${S.current_streak} days.`; }
      else { S.current_streak = 1; streakNote = "🌱 Welcome back! Chiikawa missed you. 🥹 Your streak restarted at 1."; }
    }
    if (S.current_streak % 7 === 0 && S.streak_shields < 3) { S.streak_shields += 1; streakNote += " 🛡️ 7-day milestone: +1 shield!"; }
  }
  S.longest_streak = Math.max(S.longest_streak || 0, S.current_streak);

}
