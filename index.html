<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2433">
<title>Chiikawa Bio Escape</title>
<meta name="description" content="A cute Chiikawa-style biology escape-room adventure for Secondary 4–6.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Single deliberate look: Chiikawa picture-book cream + dim escape-room scenes. */
:root {
  color-scheme: light;
  --cream: #FFFDF0;
  --cream-2: #FFF6DA;
  --ink: #4A3E3D;
  --ink-soft: #7A6A66;
  --pink: #FFB7C5;
  --pink-2: #FFD6DF;
  --blue: #A0C4FF;
  --blue-2: #D3E4FF;
  --yellow: #FDFFB6;
  --green: #B9F3C9;
  --red: #FFADAD;
  --night: #2B2433;
  --led: #FF6B6B;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --line: 3px solid var(--ink);
  --r: 18px;
  --font: "M PLUS Rounded 1c", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- Buttons ---------- */
.btn {
  background: var(--pink); border: var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 18px; font-weight: 800; min-height: 48px; transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.blue { background: var(--blue); }
.btn.yellow { background: var(--yellow); }
.btn.plain { background: var(--cream); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { font-size: 1.1rem; padding: 12px 24px; }
.iconbtn {
  background: var(--cream); border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm);
  min-width: 44px; min-height: 44px; padding: 4px 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.iconbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Top bar ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream); border-bottom: var(--line);
}
.brand { background: none; border: 0; padding: 0; font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 34px; height: 34px; overflow: visible; }
.brand .fr-rainbow, .brand .fr-laser, .brand .fr-sakura { display: inline-flex; padding: 2px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { border: var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: .88rem; background: var(--yellow); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.saved { background: var(--green); animation: pop .4s ease-out; }
@media (max-width: 560px) { .tools .lbl { display: none; } .brand .bt { display: none; } .tools { gap: 6px; } .iconbtn { min-width: 42px; padding: 4px 8px; } }

main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 16px; }
.card { background: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card.cream { background: var(--cream-2); }

/* ---------- Speech ---------- */
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .av { flex: 0 0 56px; width: 56px; height: 56px; animation: bob 2.4s ease-in-out infinite; }
.say .av svg { width: 100%; height: 100%; overflow: visible; }
.bubble { position: relative; background: #fff; border: var(--line); border-radius: 18px; padding: 8px 14px; box-shadow: var(--shadow-sm); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 16px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -6px; top: 18px; border: 7px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble .name { display: block; font-size: .78rem; font-weight: 800; color: var(--ink-soft); }
.bubble.hint { background: var(--blue-2); }
.bubble.hint::after { border-right-color: var(--blue-2); }

/* ---------- Title / map ---------- */
.hero { background: var(--night); color: #fff; border: var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 22px 18px 0; overflow: hidden; position: relative; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(1.7rem, 5.5vw, 2.6rem); position: relative; }
.hero .sub { color: var(--yellow); font-weight: 700; position: relative; }
.hero .stars { position: absolute; inset: 0; pointer-events: none; }
.hero .stars span { position: absolute; color: var(--yellow); animation: twinkle 2.6s ease-in-out infinite; }
.cast { display: flex; justify-content: center; align-items: flex-end; margin-top: 6px; position: relative; }
.cast .fig { width: clamp(64px, 16vw, 120px); margin: 0 -4px; animation: bob 2.6s ease-in-out infinite; }
.cast .fig:nth-child(2) { animation-delay: -.6s; } .cast .fig:nth-child(3) { animation-delay: -1.2s; width: clamp(76px, 19vw, 140px); }
.cast .fig:nth-child(4) { animation-delay: -1.8s; } .cast .fig:nth-child(5) { animation-delay: -2.2s; }
.cast .fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.topic {
  text-align: left; background: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px; display: grid; gap: 6px; align-content: start; transition: transform .12s, box-shadow .12s;
}
.topic:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.topic.next { background: var(--yellow); }
.topic.done { background: var(--green); }
.topic:disabled { opacity: .55; cursor: not-allowed; }
.topic .tnum { font-size: .8rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.topic .tname { font-weight: 800; font-size: 1.05rem; }
.topic .rstars { font-size: 1.1rem; letter-spacing: 2px; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; background: var(--cream); display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Room view ---------- */
.roomhead {
  background: var(--night); color: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 10px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center;
  background-image: radial-gradient(circle at 12% 0%, rgba(255,107,107,.35), transparent 45%), radial-gradient(circle at 90% 100%, rgba(160,196,255,.25), transparent 50%);
}
.roomhead .rt { font-weight: 800; font-size: 1.05rem; }
.roomhead .rtopic { font-size: .85rem; color: var(--yellow); }
.timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: .06em;
  background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 2px 12px;
  text-shadow: 0 0 8px rgba(255,107,107,.9), 0 0 18px rgba(255,107,107,.5); box-shadow: inset 0 0 12px rgba(255,107,107,.25);
}
.timer.low { animation: blink 1s steps(2, start) infinite; }
.timer.over { color: var(--yellow); font-size: clamp(1rem, 3.6vw, 1.4rem); text-shadow: 0 0 8px rgba(253,255,182,.8); }
.status { display: flex; gap: 10px; align-items: center; min-width: 0; }
.status .av { width: 64px; height: 64px; flex: 0 0 64px; }
.status .av svg { width: 100%; height: 100%; overflow: visible; }
.scene-wrap { border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; background: var(--night); }
.scene { position: relative; width: 100%; aspect-ratio: 8 / 5; max-width: 100%; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .obj { cursor: pointer; }
.scene .obj:hover { filter: brightness(1.12); }
.dark {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at var(--sx, 50%) var(--sy, 45%), rgba(20,14,28,0) 0, rgba(20,14,28,0) 16%, rgba(20,14,28,var(--dim, .5)) 46%);
}
.hs {
  position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%;
  border: var(--line); background: var(--yellow); box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem;
  display: grid; place-items: center; animation: glow 1.8s ease-in-out infinite; padding: 0;
}
.hs.done { background: var(--green); animation: none; }
.hs.door { background: var(--pink); }
.hs .lbl { position: absolute; top: 100%; margin-top: 4px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .72rem; background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
@media (max-width: 560px) { .hs { width: 38px; height: 38px; font-size: 1rem; } .hs .lbl { display: none; } }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.slot {
  border: 3px dashed var(--ink-soft); border-radius: 14px; min-height: 80px; display: grid; place-items: center; align-content: center; gap: 2px; text-align: center;
  padding: 6px 4px; font-size: .74rem; font-weight: 700; background: var(--cream); line-height: 1.2; min-width: 0;
}
.slot.full { border-style: solid; border-color: var(--ink); background: #fff; box-shadow: var(--shadow-sm); }
.slot.new { animation: pop .5s ease-out; }
.slot svg { width: 30px; height: 30px; }
.slot .code { display: inline-block; background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; padding: 0 5px; font-size: .8rem; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .slot .nm { display: none; } }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(43,36,51,.6); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.overlay.top { z-index: 60; }
.modal {
  background: var(--cream); border: var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink);
  width: min(640px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px; display: grid; gap: 12px;
  animation: pop .25s ease-out; position: relative;
}
.modal.wide { width: min(760px, 100%); }
.modal .x { position: absolute; top: 10px; right: 10px; }
.modal h2 { padding-right: 52px; }
.kicker { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding-right: 52px; }
.q { font-weight: 800; font-size: 1.06rem; }
.choices { display: grid; gap: 10px; }
@media (min-width: 640px) { .choices { grid-template-columns: 1fr 1fr; } }
.choice { text-align: left; background: #fff; border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 10px 12px; min-height: 48px; display: flex; gap: 8px; }
.choice b { flex: 0 0 auto; }
.choice.right { background: var(--green); }
.choice.wrong { background: var(--red); }
.choice:disabled { cursor: default; }
.keypad { display: grid; gap: 10px; justify-items: center; }
.kdisplay {
  width: min(280px, 100%); background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 6px 12px;
  font-size: 1.7rem; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; min-height: 56px; letter-spacing: .08em;
  text-shadow: 0 0 8px rgba(255,107,107,.8);
}
.kdisplay .u { color: var(--yellow); font-size: .9rem; margin-left: 6px; text-shadow: none; letter-spacing: 0; }
.keys { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
.key { height: 54px; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem; }
.key:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.key.del { background: var(--pink-2); }
.dials { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dial { display: grid; gap: 6px; justify-items: center; }
.dial .dlabel { font-size: .8rem; font-weight: 800; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; text-align: center; }
.dial .face { min-width: 128px; background: #fff; border: var(--line); border-radius: 14px; box-shadow: inset 0 -6px 0 var(--cream-2); padding: 12px 10px; font-weight: 800; text-align: center; font-size: 1.05rem; }
@media (max-width: 560px) { .dials { flex-direction: column; align-items: stretch; } .dial { grid-template-columns: 48px 1fr 48px; align-items: center; } .dial .dlabel { grid-column: 1 / -1; justify-self: center; } .dial .face { min-width: 0; padding: 8px 6px; } .dial .arr { width: 48px; } }
.dial .face.spin { animation: spin .25s ease-out; }
.dial .arr { width: 56px; height: 38px; border: var(--line); border-radius: 10px; background: var(--blue); box-shadow: var(--shadow-sm); font-weight: 800; }
.fb { border: var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.fb.ok { background: #EFFFF3; } .fb.no { background: #FFF0F0; }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { border: 2px solid var(--ink); border-radius: 10px; padding: 2px 8px; font-size: .88rem; background: #fff; }
.term .def { margin-left: 5px; color: #A23E60; font-weight: 500; }
.tip { border: 2px dashed var(--ink); background: var(--yellow); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
.diagram-box { overflow-x: auto; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px; }
.diagram { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
.modal.shake { animation: shake .45s ease-in-out; }
.found { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.found svg { width: 32px; height: 32px; flex: 0 0 32px; }

/* Journal */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tab { flex: 0 0 auto; border: 2px solid var(--ink); border-radius: 999px; background: #fff; padding: 4px 12px; font-weight: 800; font-size: .86rem; }
.tab[aria-selected="true"] { background: var(--pink); }
.jsec { display: grid; gap: 6px; }
.jsec h3 { font-size: 1rem; }
.jsec ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.formula { font-weight: 800; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.tterms { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tterms td { border-bottom: 1px solid #E5DCC9; padding: 4px 6px; }
.tterms tr.hl td { background: var(--yellow); font-weight: 800; }

/* Save code */
.codebox { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.codebox span { width: 34px; height: 48px; display: grid; place-items: center; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-size: 1.35rem; font-weight: 800; }
.codein { font: inherit; font-size: 1.2rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-align: center; width: 300px; max-width: 100%; border: var(--line); border-radius: 14px; padding: 8px; background: #fff; color: var(--ink); }
.linkbox { font-size: .82rem; word-break: break-all; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; user-select: all; }
input.name { font: inherit; font-size: 16px; border: var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 320px; background: #fff; color: var(--ink); min-height: 48px; }
select.name { font: inherit; font-size: 16px; border: var(--line); border-radius: 14px; padding: 8px 10px; width: 100%; max-width: 420px; background: #fff; color: var(--ink); min-height: 48px; }
.preview { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; }

/* Celebration */
.yaha { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none; }
.yaha .inner { display: grid; justify-items: center; animation: jump 1.2s ease-out forwards; }
.yaha .inner svg { width: 140px; height: auto; overflow: visible; }
.yaha .word { font-size: 3rem; font-weight: 800; color: var(--ink); background: var(--yellow); border: var(--line); border-radius: 20px; padding: 0 18px; box-shadow: var(--shadow); transform: rotate(-6deg); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 14px; font-weight: 700; max-width: calc(100% - 32px); }
footer { text-align: center; font-size: .78rem; color: var(--ink-soft); padding: 0 16px 24px; }

.door-panel { transform-box: fill-box; transform-origin: left center; transition: transform .9s ease-in; }
.door-open .door-panel { transform: scaleX(.12); }
.door-light { opacity: 0; transition: opacity .9s; }
.door-open .door-light { opacity: 1; }

/* Trophy cabinet */
.cabinet { background: linear-gradient(#FFF6DA, #FFF6DA) padding-box; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.trophy {
  background: #fff; border: var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); padding: 10px 10px 12px;
  display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; align-content: start;
}
.trophy svg.cup { width: 100px; height: 120px; overflow: visible; }
.trophy.got svg.cup { animation: shine 3s ease-in-out infinite; }
.trophy .tn { font-weight: 800; margin-top: 10px; line-height: 1.2; }
.trophy .rar { font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; }
.rar.bronze { background: #F2C9A0; } .rar.silver { background: #E3E8F0; } .rar.gold { background: #FFE27A; }
.rar.legend { background: linear-gradient(90deg, #FFB7C5, #FDFFB6, #B9F3C9, #A0C4FF, #C9C3F0); }
.trophy .td { font-size: .8rem; color: var(--ink-soft); line-height: 1.3; }
.trophy .pbar { width: 100%; height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); overflow: hidden; }
.trophy .pbar i { display: block; height: 100%; background: var(--pink); }
.trophy .pnum { font-size: .78rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.trophy.locked { background: #F4F0E8; }
.trophy.locked .tn { color: var(--ink-soft); }
.tbanner {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 95;
  background: var(--yellow); border: var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 10px 16px;
  display: flex; gap: 12px; align-items: center; width: min(420px, calc(100% - 32px)); animation: drop .5s ease-out;
}
.tbanner svg { width: 56px; height: 68px; flex: 0 0 56px; overflow: visible; }
/* Trophy aesthetics: ribbons, rarity glows, wooden shelves */
.ribbon { font-size: .68rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.ribbon.bronze { background: #F2C9A0; } .ribbon.silver { background: #E3E8F0; } .ribbon.gold { background: #FFE27A; }
.ribbon.legend { background: linear-gradient(90deg, #FFB7C5, #FDFFB6, #B9F3C9, #A0C4FF, #C9C3F0); background-size: 200% 100%; animation: holo 4s linear infinite; }
.trophy .ribbon { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); z-index: 1; }
.trophy { overflow: hidden; padding-top: 30px; }
.trophy.locked { filter: saturate(.55); }
.trophy.locked .ribbon { opacity: .75; }
.trophy.got.bronze { background: linear-gradient(180deg, #FFF3E6, #fff 60%); }
.trophy.got.silver { background: linear-gradient(180deg, #F1F5FB, #fff 60%); }
.trophy.got.gold { background: linear-gradient(180deg, #FFF6C8, #fff 60%); box-shadow: var(--shadow-sm), 0 0 18px rgba(255, 210, 60, .55); }
.trophy.got.legend { background: linear-gradient(160deg, #FFE3EC, #FFFBD6 30%, #E2FBEA 55%, #E0ECFF 80%, #EEE8FF); box-shadow: var(--shadow-sm), 0 0 22px rgba(201, 160, 255, .6); }
.trophy.got.gold::before, .trophy.got.legend::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-18deg); animation: sweep 3.8s ease-in-out infinite; pointer-events: none; }
.shelf-title { margin: 14px 0 6px; }
.shelf.wood { background: linear-gradient(#E7C39C, #D9A878); border: var(--line); border-radius: 16px; padding: 18px 12px 14px; box-shadow: inset 0 -10px 0 #B97E52; }
.cabinet .shelf { padding-top: 12px; }

<script>
/* ============================================================
   1. Characters: original Chiikawa-style SVG drawings (not official artwork)
   moods: "normal" | "happy" | "cry" | "shock" | "sparkle" | "brave"
   ============================================================ */
const L = en => en; // English-only build: keeps text helpers simple
const INK = "#4A3E3D";
let clipN = 0;
function eyes(x1, x2, y, mood, big) {
  if (mood === "happy") return `<path d="M${x1 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0 M${x2 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
  if (mood === "shock") return `<circle cx="${x1}" cy="${y}" r="4.2" fill="#fff" stroke="${INK}" stroke-width="1.8"/><circle cx="${x2}" cy="${y}" r="4.2" fill="#fff" stroke="${INK}" stroke-width="1.8"/>
    <circle cx="${x1}" cy="${y}" r="1.4" fill="${INK}"/><circle cx="${x2}" cy="${y}" r="1.4" fill="${INK}"/>
    <path d="M${x2 + 10} ${y - 8} q-2.4 4.2 0 6 q2.4 -1.8 0 -6Z" fill="#A0C4FF" stroke="#5B8FC9" stroke-width=".8"/>`;
  const star = (cx, cy) => `<path d="M${cx} ${cy - 5} l1.5 3.4 3.6 .4 -2.7 2.4 .8 3.6 -3.2 -1.9 -3.2 1.9 .8 -3.6 -2.7 -2.4 3.6 -.4z" fill="#FDD66B" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>`;
  if (mood === "sparkle") return star(x1, y) + star(x2, y);
  const rx = big ? 3.8 : 2.7, ry = big ? 4.4 : 3.3, hr = big ? 1.4 : 1;
  let s = `<ellipse cx="${x1}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/><ellipse cx="${x2}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/>
    <circle cx="${x1 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/><circle cx="${x2 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/>`;
  if (mood === "cry") s += `<path d="M${x1} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z M${x2} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z" fill="#A0C4FF" stroke="#5B8FC9" stroke-width=".8"/>`;
  if (mood === "brave") s += `<path d="M${x1 - 4.5} ${y - 7.5} l7 2.2 M${x2 + 4.5} ${y - 7.5} l-7 2.2" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;

function mouth(x, y, mood, open) {

/* ============================================================
   3b. Graphs: one scaled plotting helper + graph data used by graph-reading questions
   ============================================================ */
const G_BLUE = "#3B6FC0", G_GREEN = "#3E8E3A", G_ORANGE = "#D8742F";
// Smooth line through points (Catmull-Rom → cubic Bézier)
function smoothPath(p) {
  if (p.length < 3) return "M" + p.map(q => q.join(" ")).join(" L");
  let d = `M${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += ` C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
  }
  return d;
}
/* plot({ x: [min, max, step, "label"], y: [min, max, step, "label"], series: [{ pts, c, lbl, lx, ly, smooth, dash }],
          bars: { cats, vals, c }, marks: [[x, y, "P", dx, dy]], label }) */
function plot(o) {
  const W = 330, H = 220, Lf = 54, Rt = W - 16, T = 18, B = H - 48;
  const [x0, x1, xs, xl] = o.x || [0, 1, 0, ""], [y0, y1, ys, yl] = o.y;
  const X = v => Lf + (v - x0) / (x1 - x0) * (Rt - Lf), Y = v => B - (v - y0) / (y1 - y0) * (B - T);
  const fmtN = v => (Math.abs(v) < 1e-9 ? "0" : String(+v.toFixed(2)));
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += ys) g += `<path d="M${Lf} ${Y(v).toFixed(1)} H${Rt}" stroke="#E5DCC9" stroke-width="1"/>${small(Lf - 6, Y(v), fmtN(v), "end", INK)}`;
  if (!o.bars && xs) for (let v = x0; v <= x1 + 1e-9; v += xs) g += `<path d="M${X(v).toFixed(1)} ${B} v5" stroke="${INK}" stroke-width="1.6"/>${small(X(v), B + 13, fmtN(v), "middle", INK)}`;
  if (y0 < 0) g += `<path d="M${Lf} ${Y(0)} H${Rt}" stroke="${INK}" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  let body = "";
  if (o.bars) {
    const n = o.bars.cats.length, slot = (Rt - Lf) / n, bw = Math.min(46, slot * .62);
    o.bars.cats.forEach((c, i) => {
      const v = o.bars.vals[i], cx = Lf + slot * (i + .5), top = Y(Math.max(v, y0)), base = Y(Math.max(0, y0));
      body += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(top, base).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(base - top)).toFixed(1)}" rx="3" fill="${(o.bars.colors && o.bars.colors[i]) || o.bars.c || "#A0C4FF"}" stroke="${INK}" stroke-width="1.6"/>`;
      body += small(cx, Math.min(top, base) - 7, String(v), "middle", INK);
      const words = String(c).split(" "), lines = words.length > 1 && c.length > 9 ? [words.slice(0, Math.ceil(words.length / 2)).join(" "), words.slice(Math.ceil(words.length / 2)).join(" ")] : [c];
      lines.forEach((t, k) => { body += small(cx, B + 12 + k * 12, t, "middle", INK); });
    });
  }
  (o.series || []).forEach(s => {
    const pts = s.pts.map(([a, b]) => [X(a), Y(b)]);
    body += `<path d="${s.smooth === false ? "M" + pts.map(q => q.map(n => n.toFixed(1)).join(" ")).join(" L") : smoothPath(pts)}" fill="none" stroke="${s.c || PINK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="7 5"' : ""}/>`;
    if (s.dots) pts.forEach(([a, b]) => { body += `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3" fill="${s.c || PINK}" stroke="${INK}" stroke-width="1"/>`; });
    if (s.lbl) body += small(X(s.lx), Y(s.ly), s.lbl, "start", s.c || PINK);
  });
  (o.marks || []).forEach(([a, b, t, dx = 8, dy = -10]) => { body += dot(X(a), Y(b), t, dx, dy); });
  const xlab = o.bars ? (o.bars.xl || "") : xl;
  return `${svgOpen(W, H, o.label)}${g}
    <path d="M${Lf} ${T - 6} V${B} H${Rt + 6}" fill="none" stroke="${INK}" stroke-width="2.4"/>
    ${body}${small((Lf + Rt) / 2, H - 8, xlab, "middle", INK)}
    <text x="14" y="${(T + B) / 2}" fill="${INK}" font-size="11.5" font-weight="700" text-anchor="middle" transform="rotate(-90 14 ${(T + B) / 2})">${yl}</text></svg>`;
}

    special: "bubble", specialName: "Bubble gate", specialLine: "A wobbly, oily bubble wall... it lets some things through but not others!",
    tint: "#F5C6D6", floor: "#CD98AA", dim: .7, code: "92370", item: "🫧 Bubble-wall sticker",
    intro: [["rakko", "brave", "Boss stage. Only those who understand the membrane may pass through this gate. ⚔️"], ["chiikawa", "cry", "The gate is all wobbly... can we even get through? 😖"], ["momonga", "happy", "Hmph! I'll squeeze through first if you solve the puzzles! 💜"]],
    notes: [
      "The <b>fluid mosaic model</b>: the cell membrane is a <b>phospholipid bilayer</b> with <b>proteins</b> scattered in it. The molecules can move sideways, so it is <b>fluid</b>.",
      "Phospholipids have a <b>hydrophilic</b> (water-loving) head and <b>hydrophobic</b> (water-hating) tails. Heads face the watery outside and cytoplasm; tails face inwards.",
      "The membrane is <b>differentially (selectively) permeable</b>: small or lipid-soluble molecules pass through the bilayer; ions and large polar molecules need <b>protein channels or carriers</b>.",
      "<b>Prokaryotic cells</b> (bacteria): no true nucleus (DNA lies free in the cytoplasm as circular DNA), no membrane-bound organelles, smaller ribosomes, often <b>plasmids</b>, cell wall not made of cellulose.",
      "<b>Eukaryotic cells</b> (animals, plants, fungi): true nucleus with a nuclear envelope, membrane-bound organelles (e.g. mitochondria), larger ribosomes."

    rules: ["Membrane = phospholipid bilayer + proteins (fluid mosaic)", "Heads hydrophilic (outside) · tails hydrophobic (inside)", "Prokaryote: no nucleus, no membrane-bound organelles · Eukaryote: nucleus + organelles"],
    terms: [["fluid mosaic model", "membrane model: phospholipid bilayer with proteins that can move"], ["phospholipid bilayer", "double layer of phospholipids forming the membrane"], ["hydrophilic", "attracted to water"], ["hydrophobic", "repelled by water"], ["differentially permeable", "lets some substances through but not others"], ["prokaryotic cell", "cell without a true nucleus, e.g. a bacterium"], ["eukaryotic cell", "cell with a true nucleus and membrane-bound organelles"], ["plasmid", "small ring of DNA in bacteria"]] },

  /* ---------------- Topic 3: Movement Across Membranes ---------------- */
  { id: "t3s1", t: 2, s: 1, name: "The Perfume Hall", focus: "Diffusion", scene: "library",
    special: "perfume", specialName: "Perfume bottle", specialLine: "Pssst! A sweet smell spreads across the whole room... how does it move?",
    tint: "#E5C7EE", floor: "#B89AC3", dim: .6, code: "27514", item: "🌸 Perfume-cloud sticker",
    intro: [["chiikawa", "happy", "Mmm~ something smells like strawberries... 🍓"], ["hachiware", "normal", "That's diffusion! The smell particles spread from where there are many to where there are few."], ["usagi", "happy", "Sniff sniff! YAHA! 🐰"]],
    notes: [
      "<b>Diffusion</b> is the <b>net movement</b> of particles from a region of <b>higher concentration</b> to a region of <b>lower concentration</b>, down a <b>concentration gradient</b>.",
      "Diffusion is <b>passive</b>: it does not need energy from respiration. It continues until concentrations are even (equilibrium).",
      "Faster diffusion with: <b>steeper</b> concentration gradient · <b>larger surface area</b> · <b>shorter distance</b> (thinner surface) · <b>higher temperature</b> · smaller particles.",
      "Examples: O₂ and CO₂ exchange in the alveoli and leaves; digested food diffusing into villi; perfume spreading in air.",
      "Small cells have a larger <b>surface area to volume ratio</b>, so diffusion can supply all of their needs. Large organisms need special exchange surfaces."
    ],
    rules: ["High concentration → low concentration (down the gradient)", "Passive: no energy from respiration", "Faster: steep gradient · large surface area · short distance · higher temperature"],
    terms: [["diffusion", "net movement of particles from high to low concentration"], ["concentration gradient", "difference in concentration between two regions"], ["passive process", "a process that does not need energy from respiration"], ["surface area to volume ratio", "surface area divided by volume; larger in small cells"], ["equilibrium", "state when concentrations are even and there is no net movement"]] },
  { id: "t3s2", t: 2, s: 2, name: "The Salty Sea Lab", focus: "Osmosis in animal and plant cells", scene: "pond",
    special: "potato", specialName: "Potato strips", specialLine: "Potato strips soaking in salty and fresh water... some went floppy!",
    tint: "#A9D6D8", floor: "#7DAFB2", dim: .64, code: "65038", item: "🥔 Potato-strip sticker",
    intro: [["chiikawa", "cry", "The potato chips went all floppy... my snack! 😭"], ["hachiware", "normal", "Osmosis did that! Water moved out of the potato cells. Let's figure out why."], ["kurimanju", "happy", "Salt... on potato... *sips tea* 🍵"]],
    notes: [
      "<b>Osmosis</b> is the net movement of <b>water</b> molecules from a <b>dilute</b> solution (higher water potential) to a <b>more concentrated</b> solution (lower water potential) through a <b>differentially permeable membrane</b>.",
      "Animal cells: in a <b>dilute</b> solution, water enters and the cell may <b>burst</b> (red blood cells: <b>haemolysis</b>). In a <b>concentrated</b> solution, water leaves and the cell <b>shrinks</b> (crenation).",
      "Plant cells: in a dilute solution, water enters and the cell becomes <b>turgid</b>; the <b>cell wall</b> stops it bursting.",
      "In a concentrated solution, plant cells lose water and become <b>flaccid</b>; with more loss, the cell membrane pulls away from the wall: <b>plasmolysis</b>.",
      "Potato strip experiment: strips <b>gain mass</b> and get longer in dilute solutions and <b>lose mass</b> in concentrated ones. Where there is <b>no change</b>, the solution matches the cell sap.",
      "<b>Visking tubing</b> (dialysis tubing) acts like a differentially permeable membrane in experiments."
    ],
    rules: ["Water moves: dilute (high water potential) → concentrated (low water potential)", "Animal cell in water → bursts · plant cell in water → turgid (wall stops bursting)", "Plant cell in strong solution → flaccid → plasmolysed"],
    terms: [["osmosis", "net movement of water through a differentially permeable membrane from dilute to concentrated solution"], ["water potential", "tendency of water to move out; high in dilute solutions"], ["turgid", "firm plant cell full of water, pressing on its wall"], ["flaccid", "soft plant cell that has lost water"], ["plasmolysis", "cell membrane pulling away from the cell wall after water loss"], ["haemolysis", "bursting of red blood cells in a dilute solution"], ["Visking tubing", "artificial differentially permeable membrane"]] },
  { id: "t3s3", t: 2, s: 3, name: "The Energy Pump Station", focus: "Active transport and phagocytosis", scene: "cellworld",
    special: "pump", specialName: "Uphill pump", specialLine: "A pump pushes little balls UPHILL... it needs a battery to work!",
    tint: "#F2B6A0", floor: "#C98C77", dim: .72, code: "38461", item: "🔋 Pump-battery sticker",
    intro: [["rakko", "brave", "Boss stage. Moving against the gradient needs energy. So does beating me. ⚔️"], ["chiikawa", "brave", "I-I have energy! I ate breakfast! 💪"], ["usagi", "happy", "Ura! Pump it UP! 🐰💥"]],
    notes: [
      "<b>Active transport</b> moves substances <b>against</b> a concentration gradient (low → high concentration) using <b>carrier proteins</b> in the membrane.",
      "It needs <b>energy (ATP) from respiration</b>, so it stops if respiration stops (e.g. no oxygen, cyanide, low temperature).",
      "Examples: <b>root hair cells</b> absorb mineral ions from soil; cells of the small intestine absorb the last glucose and amino acids.",
      "Cells doing active transport have <b>many mitochondria</b>.",
      "<b>Phagocytosis</b>: the cell membrane surrounds and engulfs a large particle (e.g. a bacterium) to form a vacuole. White blood cells (<b>phagocytes</b>) do this. It also needs energy.",
      "Compare: diffusion and osmosis are passive; active transport and phagocytosis need energy."
    ],
    rules: ["Active transport: low → high concentration, carrier proteins, needs ATP", "No respiration → no active transport", "Phagocytosis: membrane engulfs large particles (needs energy)"],
    terms: [["active transport", "movement against a concentration gradient using carrier proteins and energy"], ["carrier protein", "membrane protein that carries a specific substance across"], ["ATP", "the energy-carrying molecule made in respiration"], ["phagocytosis", "engulfing of a large particle by the cell membrane"], ["phagocyte", "white blood cell that engulfs bacteria"], ["root hair cell", "cell with a long extension that absorbs water and mineral ions"]] },

  /* ---------------- Topic 4: Cell Cycle and Division ---------------- */
  { id: "t4s1", t: 3, s: 1, name: "The Copy Room", focus: "Cell cycle and mitosis", scene: "library",
    special: "copier", specialName: "Copy machine", specialLine: "The copier makes perfect twins of everything... just like mitosis!",
    tint: "#C7D3F2", floor: "#98A6CC", dim: .6, code: "71845", item: "📠 Twin-copy sticker",
    intro: [["chiikawa", "shock", "Th-there are TWO Chiikawas?! Which one is me?! 😱"], ["hachiware", "happy", "Haha, it's a copy machine! Mitosis makes two identical cells, just like this!"], ["usagi", "happy", "Double Usagi! YAHA YAHA! 🐰🐰"]],
    notes: [
      "The <b>cell cycle</b> = <b>interphase</b> (the longest phase: the cell grows, makes organelles and <b>replicates its DNA</b>) + <b>mitosis</b> (nuclear division) + <b>cytokinesis</b> (cytoplasm division).",
      "After DNA replication, each chromosome has two identical <b>sister chromatids</b> joined at the <b>centromere</b>.",
      "<b>Prophase</b>: chromosomes condense and become visible; nuclear envelope breaks down; spindle forms.",
      "<b>Metaphase</b>: chromosomes line up at the <b>equator</b>, attached to spindle fibres.",
      "<b>Anaphase</b>: centromeres split and sister chromatids are pulled to <b>opposite poles</b>.",
      "<b>Telophase</b>: nuclear envelopes re-form around the two sets of chromosomes; chromosomes uncoil.",
      "Cytokinesis: animal cells pinch in (<b>cleavage furrow</b>); plant cells build a <b>cell plate</b> that becomes a new wall."
    ],
    rules: ["Interphase: growth + DNA replication", "Order: Prophase → Metaphase → Anaphase → Telophase (PMAT)", "Mitosis → 2 genetically identical diploid cells"],
    terms: [["cell cycle", "sequence of growth and division of a cell"], ["interphase", "stage when the cell grows and copies its DNA"], ["chromatid", "one of the two identical copies of a replicated chromosome"], ["centromere", "point where two sister chromatids are joined"], ["spindle", "fibres that move chromosomes during division"], ["equator", "middle plane of the cell where chromosomes line up"], ["cytokinesis", "division of the cytoplasm"], ["cell plate", "new wall that forms between plant daughter cells"]] },
  { id: "t4s2", t: 3, s: 2, name: "The Shuffle Casino", focus: "Meiosis and variation", scene: "garden",
    special: "cards", specialName: "Card table", specialLine: "Shuffled cards everywhere... every hand is different, like gametes!",
    tint: "#E8B7C8", floor: "#BF8C9E", dim: .66, code: "20397", item: "🃏 Shuffle-card sticker",
    intro: [["chiikawa", "shock", "The cards keep shuffling themselves?! 🃏😱"], ["hachiware", "normal", "Meiosis shuffles chromosomes too. That's why brothers and sisters look different!"], ["momonga", "sparkle", "And that's why nobody is as cute as me. Unique! 💜"]],
    notes: [
      "<b>Meiosis</b> makes <b>gametes</b> (sperm, eggs; pollen nuclei, ovules). It has <b>two divisions</b> (meiosis I and II) and gives <b>four haploid</b> cells.",
      "Body cells are <b>diploid</b> (2n: two sets of chromosomes; 46 in humans). Gametes are <b>haploid</b> (n: one set; 23 in humans).",
      "In meiosis I, <b>homologous chromosomes</b> pair up and then separate, halving the chromosome number.",
      "<b>Crossing over</b>: chromatids of homologous chromosomes exchange parts during meiosis I.",
      "<b>Independent assortment</b>: each homologous pair lines up and separates independently of other pairs.",
      "Crossing over, independent assortment and <b>random fertilisation</b> create <b>genetic variation</b> in offspring.",
      "Meiosis keeps the chromosome number <b>constant</b> from generation to generation: n + n → 2n at fertilisation."
    ],
    rules: ["Meiosis: 2 divisions → 4 haploid (n) cells, all genetically different", "Diploid 2n = 46 · haploid n = 23 (humans)", "Variation: crossing over + independent assortment + random fertilisation"],
    terms: [["meiosis", "cell division that makes 4 haploid gametes"], ["gamete", "sex cell, e.g. sperm or egg"], ["haploid", "having one set of chromosomes (n)"], ["diploid", "having two sets of chromosomes (2n)"], ["homologous chromosomes", "a matching pair of chromosomes, one from each parent"], ["crossing over", "exchange of parts between homologous chromatids"], ["independent assortment", "random separation of each homologous pair"], ["fertilisation", "fusion of two gametes to form a zygote"]] },
  { id: "t4s3", t: 3, s: 3, name: "The Twin Mirror Tower", focus: "Mitosis vs meiosis and their importance", scene: "clinic",
    special: "twins", specialName: "Twin mirror", specialLine: "A mirror that shows TWO different reflections... one identical, one shuffled!",
    tint: "#9FA8DA", floor: "#737CAF", dim: .74, code: "84612", item: "🪞 Twin-mirror sticker",
    intro: [["rakko", "brave", "Boss stage. Mitosis or meiosis? A true fighter never mixes them up. ⚔️"], ["chiikawa", "cry", "Mito... meio... they sound the same... uuu 😖"], ["hachiware", "happy", "Trick: mi-TOE-sis = TWO identical cells. Mei-OH-sis = gametes. We've got this! ✨"]],
    notes: [
      "<b>Mitosis</b>: 1 division · 2 daughter cells · <b>diploid</b> · <b>genetically identical</b> · no pairing of homologous chromosomes.",
      "<b>Meiosis</b>: 2 divisions · 4 daughter cells · <b>haploid</b> · <b>genetically different</b> · homologous chromosomes pair and cross over.",
      "Mitosis is for <b>growth</b>, <b>repair</b> and <b>replacement</b> of cells, and <b>asexual reproduction</b> (e.g. plant cuttings, budding in yeast).",
      "Meiosis is for making <b>gametes</b> in <b>sexual reproduction</b>, giving variation.",
      "Mitosis happens in body cells, e.g. <b>root tips</b>, shoot tips, skin, bone marrow. Meiosis happens in <b>reproductive organs</b> (testes, ovaries, anthers, ovules).",
      "<b>Cancer</b>: cells divide by mitosis in an <b>uncontrolled</b> way, forming a tumour."
    ],
    rules: ["Mitosis: 1 division → 2 identical diploid cells (growth, repair, asexual reproduction)", "Meiosis: 2 divisions → 4 different haploid gametes (sexual reproduction)", "Root tip → best place to see mitosis"],
    terms: [["daughter cell", "a cell formed by division"], ["genetically identical", "having exactly the same DNA"], ["asexual reproduction", "making offspring from one parent by mitosis"], ["sexual reproduction", "making offspring by fusion of gametes"], ["root tip", "growing region where many cells divide by mitosis"], ["tumour", "lump of cells formed by uncontrolled cell division"]] },

  /* ---------------- Topic 5: Enzymes and Metabolism ---------------- */
  { id: "t5s1", t: 4, s: 1, name: "The Lock-and-Key Shop", focus: "Metabolism and how enzymes work", scene: "library",
    special: "lock", specialName: "Giant padlock", specialLine: "A giant padlock with a strangely shaped keyhole... only ONE key fits!",
    tint: "#F7E3A1", floor: "#CDB873", dim: .58, code: "53180", item: "🗝️ Tiny-key sticker",
    intro: [["chiikawa", "shock", "So many keys... which one fits?! 🗝️😵"], ["hachiware", "happy", "Enzymes work like locks and keys! Each enzyme only fits one kind of substrate."], ["usagi", "happy", "Ura! I'll try ALL of them! 🐰"]],
    notes: [
      "<b>Metabolism</b> = all chemical reactions in an organism. <b>Anabolism</b> builds large molecules (needs energy, e.g. protein synthesis). <b>Catabolism</b> breaks them down (releases energy, e.g. respiration, digestion).",
      "<b>Enzymes</b> are <b>biological catalysts</b> (mostly proteins). They <b>speed up</b> reactions by <b>lowering the activation energy</b>, and are <b>not used up</b>.",
      "The substrate binds to the enzyme's <b>active site</b> to form an <b>enzyme–substrate complex</b>; products are released and the enzyme is free again.",
      "<b>Specificity</b>: the shape of the active site is complementary to one substrate only (<b>lock-and-key</b> model).",
      "<b>Induced fit</b> model: the active site changes shape slightly to fit the substrate closely.",
      "<b>Intracellular</b> enzymes work inside cells (e.g. respiratory enzymes); <b>extracellular</b> enzymes are secreted out (e.g. digestive enzymes)."
    ],
    rules: ["Enzyme = biological catalyst · lowers activation energy · not used up", "Enzyme + substrate → E–S complex → enzyme + products", "Active site shape is complementary to the substrate (specific)"],
    terms: [["metabolism", "all the chemical reactions in an organism"], ["anabolism", "building up large molecules from small ones"], ["catabolism", "breaking down large molecules into small ones"], ["enzyme", "biological catalyst, mostly a protein"], ["activation energy", "energy needed to start a reaction"], ["active site", "region of an enzyme where the substrate binds"], ["substrate", "the substance an enzyme acts on"], ["enzyme–substrate complex", "enzyme with its substrate bound in the active site"], ["induced fit", "active site changes shape slightly to fit the substrate"]] },
  { id: "t5s2", t: 4, s: 2, name: "The Hot and Sour Kitchen", focus: "Factors affecting enzyme activity", scene: "kitchen",
    special: "pot", specialName: "Bubbling pot", specialLine: "A pot boiling away... is it too hot for the enzymes inside?",
    tint: "#F4B98F", floor: "#C98E66", dim: .62, code: "96254", item: "🌡️ Thermometer sticker",
    intro: [["chiikawa", "shock", "It's SO HOT in this kitchen! 🥵"], ["hachiware", "normal", "Enzymes feel the heat too. Too hot and their shape is ruined!"], ["kurimanju", "happy", "Perfect tea is made at the right temperature... like enzymes. 🍵"]],
    notes: [
      "<b>Temperature</b>: activity rises as temperature rises (more collisions) up to the <b>optimum temperature</b> (about 37 °C for human enzymes).",
      "Above the optimum, the enzyme is <b>denatured</b>: the active site changes shape, the substrate no longer fits, and activity falls quickly. This is <b>permanent</b>.",
      "At <b>low temperatures</b>, enzymes are <b>inactive</b> but <b>not denatured</b>: activity returns when warmed.",
      "<b>pH</b>: each enzyme has an <b>optimum pH</b> (pepsin about pH 2; salivary amylase about pH 7; trypsin about pH 8). Extreme pH denatures enzymes.",
      "<b>Substrate concentration</b>: rate rises, then levels off when all active sites are occupied (enzyme concentration becomes the <b>limiting factor</b>).",
      "<b>Enzyme concentration</b>: with plenty of substrate, more enzyme gives a faster rate.",
      "Fair tests: change <b>one</b> variable, keep others constant, include a <b>control</b> (e.g. boiled enzyme) and repeat."
    ],
    rules: ["Rate ↑ with temperature → optimum → denatured (permanent)", "Low temperature: inactive, not denatured", "Pepsin pH 2 · amylase pH 7 · trypsin pH 8", "More substrate → rate rises then levels off"],
    terms: [["optimum temperature", "temperature at which an enzyme works fastest"], ["optimum pH", "pH at which an enzyme works fastest"], ["denatured", "active site changed permanently; enzyme stops working"], ["limiting factor", "the factor in short supply that holds back the rate"], ["control", "a set-up to compare with, e.g. with boiled enzyme"], ["pepsin", "protease in the stomach; works best at acidic pH"]] },
  { id: "t5s3", t: 4, s: 3, name: "The Inhibitor Vault", focus: "Enzyme inhibitors and applications", scene: "lab",
    special: "vault", specialName: "Jammed keyhole", specialLine: "Someone jammed gum in the keyhole! Is it blocking the active site?",
    tint: "#B8B2A6", floor: "#8C877C", dim: .76, code: "47309", item: "🧰 Unjammer sticker",
    intro: [["rakko", "brave", "Boss stage. Inhibitors block the way... and so do I. ⚔️"], ["chiikawa", "cry", "The key won't go in... something is blocking it! 😭"], ["usagi", "happy", "Haa?! Then we find another way! URA! 🐰"]],
    notes: [
      "<b>Competitive inhibitors</b> have a shape <b>similar to the substrate</b> and <b>compete for the active site</b>. Adding <b>more substrate</b> reduces their effect.",
      "<b>Non-competitive inhibitors</b> bind to <b>another part</b> of the enzyme (not the active site) and change the active site's shape. More substrate <b>cannot</b> overcome them.",
      "Some poisons are enzyme inhibitors (e.g. <b>cyanide</b> inhibits a respiratory enzyme; some heavy metal ions like mercury).",
      "Applications: <b>biological washing powder</b> (proteases and lipases remove stains at low temperature) · <b>meat tenderiser</b> (protease) · <b>pectinase</b> for clearer, more fruit juice · <b>lactase</b> makes lactose-free milk.",
      "Enzymes in industry work at mild temperatures, saving energy, and are specific, giving fewer unwanted products."
    ],
    rules: ["Competitive: fits active site · more substrate reduces the effect", "Non-competitive: binds elsewhere, changes active site · more substrate doesn't help", "Washing powder: protease + lipase · juice: pectinase · milk: lactase"],
    terms: [["inhibitor", "substance that slows down or stops enzyme activity"], ["competitive inhibitor", "inhibitor similar in shape to the substrate that binds to the active site"], ["non-competitive inhibitor", "inhibitor that binds elsewhere and changes the active site shape"], ["protease", "enzyme that digests proteins"], ["lipase", "enzyme that digests lipids"], ["pectinase", "enzyme that breaks down pectin in fruit cell walls"], ["lactase", "enzyme that digests lactose"]] },

  /* ---------------- Topic 6: Photosynthesis (6 stages) ---------------- */
  { id: "t6s1", t: 5, s: 1, name: "The Leafy Greenhouse", focus: "Leaf structure and gas exchange", scene: "greenhouse",
    special: "plant", specialName: "Potted plant", specialLine: "A sleepy plant in a pot... its leaves are holding a secret!",

    intro: [["chiikawa", "happy", "Waaa~ it's so green and fresh in here! 🌿"], ["hachiware", "normal", "Leaves are food factories! Their shape is perfect for catching light and gases."], ["momonga", "sparkle", "Photograph me next to the flowers! 📸💜"]],
    notes: [
      "Word equation: <b>carbon dioxide + water → (light, chlorophyll) → glucose + oxygen</b>.",
      "Leaf adaptations: <b>broad, flat</b> lamina (large surface area for light and CO₂) · <b>thin</b> (short diffusion distance) · <b>veins</b> (xylem brings water, phloem carries away sugars).",
      "<b>Palisade mesophyll</b>: tightly packed, column-shaped cells near the top with <b>many chloroplasts</b>: the main site of photosynthesis.",
      "<b>Spongy mesophyll</b>: loosely packed cells with large <b>air spaces</b> for gas diffusion. Cell surfaces are moist so gases dissolve.",
      "<b>Stomata</b> (mostly in the lower epidermis) let CO₂ in and O₂ out; <b>guard cells</b> open and close them. The <b>waxy cuticle</b> reduces water loss; the epidermis is transparent.",
      "In light, net CO₂ diffuses <b>into</b> the leaf and O₂ <b>out</b>; in darkness only respiration happens, so the directions reverse."
    ],
    rules: ["CO₂ + H₂O → (light, chlorophyll) → glucose + O₂", "Palisade = most chloroplasts · spongy = air spaces · stomata = gas exchange", "Light: CO₂ in, O₂ out · dark: O₂ in, CO₂ out"],
    terms: [["palisade mesophyll", "column-shaped cells packed with chloroplasts"], ["spongy mesophyll", "loose cells with air spaces for gas exchange"], ["stoma", "pore in the epidermis for gas exchange (plural: stomata)"], ["guard cell", "cell that opens and closes a stoma"], ["cuticle", "waxy layer that reduces water loss"], ["epidermis", "outer layer of cells of a leaf"], ["xylem", "vessels that carry water and minerals up the plant"], ["phloem", "tubes that carry sugars around the plant"]] },
  { id: "t6s2", t: 5, s: 2, name: "The Pigment Gallery", focus: "Chloroplasts and photosynthetic pigments", scene: "library",
    special: "prism", specialName: "Rainbow prism", specialLine: "A prism splits light into a rainbow... which colours do leaves really use?",
    tint: "#D9E8B4", floor: "#AFBF86", dim: .58, code: "60318", item: "🌈 Rainbow-leaf sticker",
    intro: [["chiikawa", "sparkle", "So many colours on the walls! It's an art gallery! 🎨✨"], ["hachiware", "normal", "These are paintings of pigments! Chlorophyll and carotenoids each catch different colours of light."], ["usagi", "happy", "Rainbow! URA! 🌈🐰"]],
    notes: [
      "The <b>chloroplast</b> has a double membrane (envelope), <b>grana</b> (stacks of <b>thylakoids</b>) and the fluid <b>stroma</b>. Starch grains are often stored in the stroma.",
      "<b>Photosynthetic pigments</b> sit on the thylakoid membranes: <b>chlorophyll a</b> and <b>chlorophyll b</b> (green) and <b>carotenoids</b> (yellow–orange, e.g. carotene and xanthophyll).",
      "Chlorophylls absorb mainly <b>blue-violet</b> and <b>red</b> light and reflect <b>green</b>, so leaves look green. Carotenoids absorb blue-violet light and pass the energy to chlorophyll, widening the range of light used.",
      "An <b>absorption spectrum</b> shows how much light of each wavelength a pigment absorbs. An <b>action spectrum</b> shows the rate of photosynthesis at each wavelength.",
      "The two spectra have a similar shape, showing that light absorbed by these pigments is used for photosynthesis.",
      "<b>Paper chromatography</b> separates the pigments of a leaf extract: the most soluble pigment (carotene) moves furthest up the paper.",
      "In autumn, chlorophyll breaks down first, so the yellow and orange carotenoids become visible."

    intro: [K("chiikawa", "shock", "Circles and squares everywhere?! Is this maths?! 😱"), K("hachiware", "happy", "It's a pedigree! Circles are females, squares are males. Shaded means affected."), K("momonga", "sparkle", "My family tree would be full of cute ancestors. 💜")],
    notes: [
      "<b>Pedigree</b> symbols: ○ female, □ male, shaded = affected. Two unaffected parents with an affected child → the trait is <b>recessive</b> (both parents are carriers).",
      "<b>Codominance</b>: both alleles are fully expressed in the heterozygote.",
      "<b>Multiple alleles</b>: more than two alleles exist for a gene. ABO blood groups: Iᴬ and Iᴮ are codominant; i is recessive. Group O = ii; AB = IᴬIᴮ.",
      "<b>Sex determination</b>: females XX, males XY. The father's sperm decides the sex, so the chance of a boy is 1/2 each time.",
      "<b>Sex-linked</b> genes are on the X chromosome (e.g. <b>red-green colour blindness</b>, <b>haemophilia</b>). Males (XʸY) need only one recessive allele to be affected, so they are affected more often. Females can be <b>carriers</b> (XᴬXᵃ)."
    ],
    rules: ["Unaffected parents → affected child ⇒ recessive trait", "Blood group: Iᴬ = Iᴮ (codominant) > i", "XX female · XY male · X-linked recessive traits are more common in males"],
    terms: [["pedigree", "family tree showing how a trait is inherited"], ["carrier", "heterozygous person who carries a recessive allele without showing it"], ["codominance", "both alleles fully expressed in the heterozygote"], ["multiple alleles", "more than two alleles for one gene"], ["sex chromosome", "X or Y chromosome that determines sex"], ["sex-linked", "gene found on a sex chromosome (usually X)"], ["haemophilia", "sex-linked disorder in which blood clots slowly"], ["colour blindness", "sex-linked difficulty telling red from green"]] },
  { id: "t9s3", t: "t9", s: 3, name: "The Variation Arena", focus: "Variation and genetic problem solving", scene: "clinic",
    special: "heightchart", specialName: "Height chart", specialLine: "A wall of heights: nobody is exactly the same! Why?",
    tint: "#B9C4D6", floor: "#8C98AC", dim: .74, code: "58163", item: "📏 Height-chart sticker",
    intro: [K("rakko", "brave", "Boss stage. Everyone is different. Explain why, and solve my crosses. ⚔️"), K("chiikawa", "cry", "Punnett squares... my brain is a square now... 🥺"), K("hachiware", "happy", "Draw the gametes first, then fill the square. Nantoka naare~! ✨")],
    notes: [
      "<b>Discontinuous variation</b>: clear-cut groups with no in-betweens (e.g. ABO blood group, tongue rolling). Usually controlled by one or a few genes; shown in a <b>bar chart</b>.",
      "<b>Continuous variation</b>: a range of values (e.g. height, body mass). Controlled by <b>many genes</b> plus the <b>environment</b>; shows a bell-shaped (normal) <b>distribution</b> in a histogram.",
      "Causes of <b>genetic variation</b>: meiosis (crossing over, independent assortment), random fertilisation, and <b>mutation</b> (the only source of new alleles).",
      "<b>Environmental variation</b> (diet, sunlight, exercise) is not inherited. Identical twins raised apart show the effect of the environment.",
      "Solving crosses: write parental genotypes → gametes → Punnett square → genotype and phenotype ratios. Ratios are <b>probabilities</b>, not guarantees."
    ],
    rules: ["Discontinuous: distinct groups, few genes · Continuous: range, many genes + environment", "Only mutation creates NEW alleles", "Parents → gametes → Punnett square → ratios (probabilities)"],
    terms: [["variation", "differences between individuals of the same species"], ["continuous variation", "variation with a range of values, e.g. height"], ["discontinuous variation", "variation with distinct groups, e.g. blood group"], ["mutation", "a change in the DNA sequence or chromosome"], ["probability", "the chance that an outcome will happen"], ["Punnett square", "grid used to predict the offspring of a cross"]] },

  /* ---------------- Molecular Genetics and Biotechnology ---------------- */
  { id: "t10s1", t: "t10", s: 1, name: "The DNA Staircase", focus: "DNA structure, genes and chromosomes", scene: "cellworld",
    special: "dna", specialName: "DNA ladder", specialLine: "A twisty ladder spins slowly... each rung is a pair of letters!",
    tint: "#C9C3F0", floor: "#9E97CC", dim: .6, code: "60482", item: "🧬 Double-helix sticker",
    intro: [K("chiikawa", "shock", "The staircase is TWISTING! Where does it go?! 😵"), K("hachiware", "normal", "It's DNA's double helix! A pairs with T, and C pairs with G."), K("usagi", "happy", "Climb the ladder! URA! 🐰")],
    notes: [
      "DNA is a <b>double helix</b>: two strands of <b>nucleotides</b>, each nucleotide = <b>deoxyribose</b> sugar + <b>phosphate</b> + a nitrogenous <b>base</b>.",
      "Sugar and phosphate form the backbone. Bases pair by <b>complementary base pairing</b>: <b>A–T</b> and <b>C–G</b>, held by hydrogen bonds.",
      "In a DNA molecule, amount of A = amount of T and amount of C = amount of G.",
      "A <b>gene</b> is a sequence of bases that codes for a polypeptide. The <b>genome</b> is all the DNA of an organism.",
      "DNA is packed with proteins into <b>chromosomes</b> in the nucleus. Humans have 23 pairs.",
      "<b>DNA replication</b> (before cell division): the helix unzips, each strand acts as a template, and new complementary strands are built, so each new molecule has one old and one new strand (<b>semi-conservative</b>)."
    ],
    rules: ["Nucleotide = deoxyribose + phosphate + base", "A–T · C–G (complementary base pairing)", "Replication is semi-conservative: one old strand + one new strand"],
    terms: [["double helix", "the twisted-ladder shape of DNA"], ["nucleotide", "unit of DNA: sugar, phosphate and base"], ["deoxyribose", "the sugar in DNA nucleotides"], ["base pairing", "A pairs with T and C pairs with G"], ["genome", "all the genetic material of an organism"], ["replication", "copying of DNA before cell division"], ["semi-conservative", "each new DNA molecule keeps one original strand"]] },
  { id: "t10s2", t: "t10", s: 2, name: "The Ribosome Factory", focus: "Protein synthesis and mutation", scene: "library",
    special: "copier", specialName: "Code copier", specialLine: "The machine copies a DNA message onto a long paper strip: mRNA!",
    tint: "#D6CFE8", floor: "#ADA4C9", dim: .62, code: "92738", item: "📜 mRNA-strip sticker",
    intro: [K("chiikawa", "normal", "The copier is printing letters... A, U, G, C? 📜"), K("hachiware", "happy", "That's transcription! Then ribosomes read the message three letters at a time to make proteins."), K("kurimanju", "happy", "Three letters... like a haiku... 🍵")],
    notes: [
      "<b>Protein synthesis</b> has two stages: <b>transcription</b> (in the nucleus) and <b>translation</b> (at ribosomes in the cytoplasm).",
      "Transcription: part of the DNA unzips and one strand is the template for making <b>mRNA</b>. RNA has <b>ribose</b>, is single-stranded, and has <b>uracil (U)</b> instead of thymine.",
      "mRNA leaves the nucleus through nuclear pores to a <b>ribosome</b>.",
      "Translation: the ribosome reads mRNA in <b>codons</b> (3 bases). <b>tRNA</b> molecules with matching <b>anticodons</b> bring the correct <b>amino acids</b>, which are joined by peptide bonds.",
      "The <b>genetic code</b> is a triplet code: each codon codes for one amino acid; there are start and stop codons.",
      "<b>Mutations</b>: a <b>gene mutation</b> changes the base sequence (e.g. sickle-cell anaemia); a <b>chromosome mutation</b> changes chromosome number or structure (e.g. Down syndrome: an extra chromosome 21). Mutagens: radiation (UV, X-rays), some chemicals (in tobacco smoke)."
    ],
    rules: ["DNA —transcription (nucleus)→ mRNA —translation (ribosome)→ polypeptide", "RNA: ribose · single strand · U instead of T", "Codon = 3 bases = 1 amino acid"],
    terms: [["transcription", "making mRNA from a DNA template"], ["translation", "making a polypeptide from mRNA at a ribosome"], ["messenger RNA", "mRNA: carries the genetic code to the ribosome"], ["transfer RNA", "tRNA: brings amino acids to the ribosome"], ["codon", "three bases on mRNA that code for one amino acid"], ["anticodon", "three bases on tRNA that pair with a codon"], ["uracil", "base found in RNA instead of thymine"], ["mutagen", "a factor that increases the rate of mutation"]] },
  { id: "t10s3", t: "t10", s: 3, name: "The Gene Lab", focus: "Biotechnology and bioethics", scene: "lab",
    special: "petri", specialName: "Petri dish", specialLine: "Glowing bacteria in a dish... they've been given a new gene!",
    tint: "#A8D8C8", floor: "#7DAF9E", dim: .74, code: "15874", item: "🧫 Glowing-bacteria sticker",
    intro: [K("rakko", "brave", "Boss stage. Cutting and pasting genes needs a steady hand... and careful ethics. ⚔️"), K("chiikawa", "shock", "The bacteria are GLOWING?! Is that safe?! 😱"), K("momonga", "happy", "Obviously they're glowing because I'm here. 💜")],
    notes: [
      "<b>Recombinant DNA technology</b>: a gene is cut out using <b>restriction enzymes</b> (which cut at specific base sequences, leaving <b>sticky ends</b>).",
      "The same restriction enzyme cuts a <b>plasmid</b> (the <b>vector</b>); <b>DNA ligase</b> joins the gene into the plasmid.",
      "The recombinant plasmid is put into bacteria, which multiply and make the protein, e.g. <b>human insulin</b> for diabetics.",
      "<b>Genetically modified organisms (GMOs)</b>: e.g. pest-resistant crops, Golden Rice (vitamin A). Concerns: gene flow to wild plants, allergies, effects on ecosystems.",
      "<b>PCR</b> (polymerase chain reaction) makes many copies of a DNA sample. <b>Gel electrophoresis</b> separates DNA fragments by size: small fragments move further.",
      "<b>DNA fingerprinting</b>: comparing band patterns identifies suspects or relatives. The <b>Human Genome Project</b> mapped all human genes. <b>Bioethics</b> weighs benefits against risks and privacy."
    ],
    rules: ["Restriction enzyme cuts → ligase joins → plasmid vector → bacteria make protein", "PCR copies DNA · electrophoresis sorts by size (small travel further)", "Weigh benefits vs risks (bioethics)"],
    terms: [["restriction enzyme", "enzyme that cuts DNA at a specific base sequence"], ["DNA ligase", "enzyme that joins pieces of DNA"], ["plasmid", "small ring of DNA used as a vector"], ["vector", "carrier that takes a gene into a host cell"], ["recombinant DNA", "DNA made by joining DNA from different sources"], ["electrophoresis", "method that separates DNA fragments by size in a gel"], ["DNA fingerprinting", "identifying people by their DNA band pattern"], ["genetically modified organism", "organism whose DNA has been changed by gene technology"]] },

  /* ---------------- Biodiversity and Evolution ---------------- */
  { id: "t11s1", t: "t11", s: 1, name: "The Name-Tag Museum", focus: "Classification and dichotomous keys", scene: "library",
    special: "butterfly", specialName: "Specimen case", specialLine: "A butterfly in a glass case... its name tag is missing!",
    tint: "#E3D5B8", floor: "#BBA98A", dim: .6, code: "40316", item: "🏷️ Name-tag sticker",
    intro: [K("chiikawa", "cry", "So many creatures and no name tags... 😖"), K("hachiware", "normal", "Let's classify them! Kingdom, phylum, class... down to species."), K("usagi", "happy", "I'm Usagi usagi! URA! 🐰")],
    notes: [
      "<b>Biodiversity</b> is the variety of living things. <b>Classification</b> groups organisms by shared features into a <b>hierarchy</b>: Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species.",
      "A <b>species</b> is a group of organisms that can interbreed to produce <b>fertile</b> offspring.",
      "<b>Binomial nomenclature</b>: each species has a two-part Latin name, <i>Genus species</i> (e.g. <i>Homo sapiens</i>); the genus has a capital letter and the name is in italics (or underlined).",
      "<b>Three domains</b>: Bacteria, Archaea, Eukarya. <b>Five kingdoms</b>: Prokaryotae (Monera), Protoctista, Fungi, Plantae, Animalia.",
      "A <b>dichotomous key</b> uses pairs of contrasting statements to identify organisms step by step. Use features that are stable and easy to see."
    ],
    rules: ["Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species", "Species = can interbreed → fertile offspring", "Binomial name: Genus (capital) species (lower case), italics"],
    terms: [["biodiversity", "the variety of living things"], ["classification", "sorting organisms into groups by shared features"], ["species", "organisms that can interbreed to give fertile offspring"], ["genus", "group of closely related species"], ["binomial nomenclature", "two-part scientific naming system"], ["dichotomous key", "identification key using pairs of choices"], ["kingdom", "a major group of organisms, e.g. Plantae"], ["domain", "the highest rank: Bacteria, Archaea or Eukarya"]] },
  { id: "t11s2", t: "t11", s: 2, name: "The Survival Island", focus: "Natural selection and evolution", scene: "garden",
    special: "globe", specialName: "Island globe", specialLine: "A little globe with islands... each island has different finches!",
    tint: "#B7D9A4", floor: "#8DB97A", dim: .6, code: "86251", item: "🏝️ Island sticker",
    intro: [K("chiikawa", "shock", "Some moths are dark, some are pale... the birds are eating the pale ones?! 😱"), K("hachiware", "normal", "That's natural selection! The best-suited survive and pass on their alleles."), K("usagi", "happy", "Survival of the... YAHA-est! 🐰")],
    notes: [
      "<b>Evolution</b> is the change in the inherited features of a population over many generations.",
      "<b>Natural selection</b> (Darwin): (1) individuals show <b>variation</b>; (2) more offspring are produced than can survive, so there is <b>competition</b> (struggle for existence); (3) those with favourable features <b>survive and reproduce</b>; (4) they pass on the favourable <b>alleles</b>, which become more common.",
      "Examples: <b>antibiotic-resistant bacteria</b> (resistant mutants survive treatment); <b>peppered moths</b> (dark moths survived better on sooty trees).",
      "<b>Artificial selection</b>: humans choose which organisms breed, e.g. high-yield rice, dog breeds.",
      "Origin of life: early Earth conditions may have formed simple organic molecules; the first cells were prokaryotes. Theories are supported or changed by new evidence."
    ],
    rules: ["Variation → competition → survival of the fittest → reproduction → alleles passed on", "Environment selects; individuals do not choose to change", "Artificial selection: humans choose the breeders"],
    terms: [["evolution", "change in inherited features of a population over generations"], ["natural selection", "better-adapted individuals survive and reproduce more"], ["adaptation", "a feature that helps an organism survive in its environment"], ["competition", "struggle between organisms for limited resources"], ["antibiotic resistance", "bacteria no longer killed by an antibiotic"], ["artificial selection", "humans choosing which organisms breed"]] },
  { id: "t11s3", t: "t11", s: 3, name: "The Fossil Cave", focus: "Evidence for evolution and speciation", scene: "pond",
    special: "fossil", specialName: "Fossil rock", specialLine: "An ancient spiral shell is trapped in the rock... how old is it?",
    tint: "#8FA9B8", floor: "#6B8494", dim: .76, code: "27960", item: "🐚 Fossil sticker",
    intro: [K("rakko", "brave", "Boss stage. The rocks remember everything. Read their evidence. ⚔️"), K("chiikawa", "cry", "It's dark and ancient in here... uuu... 🥺"), K("kurimanju", "happy", "Old things... like good tea leaves... 🍵")],
    notes: [
      "<b>Fossils</b> are remains or traces of organisms preserved in rock. Deeper rock layers are usually older, so the <b>fossil record</b> shows how organisms changed over time.",
      "The fossil record is incomplete: soft-bodied organisms rarely fossilise, and many fossils are destroyed or undiscovered.",
      "<b>Comparative anatomy</b>: <b>homologous structures</b> (e.g. the pentadactyl limb in humans, bats, whales) have the same basic structure but different functions, suggesting a <b>common ancestor</b>.",
      "<b>Molecular evidence</b>: closely related species have more similar DNA and protein sequences.",
      "<b>Speciation</b>: when populations are <b>isolated</b> (e.g. by mountains or sea), different selection pressures and mutations make them change until they can no longer interbreed, forming new species."
    ],
    rules: ["Evidence: fossils · homologous structures · DNA/protein similarities", "Deeper layers → usually older fossils", "Isolation + different selection → new species (cannot interbreed)"],
    terms: [["fossil", "preserved remains or traces of an ancient organism"], ["fossil record", "the sequence of fossils in rock layers over time"], ["homologous structure", "same basic structure, different function, from a common ancestor"], ["common ancestor", "an ancient species from which others evolved"], ["speciation", "formation of a new species"], ["isolation", "separation of populations so they cannot interbreed"]] },

  /* ---------------- Life Processes in Plants ---------------- */
  { id: "t12s1", t: "t12", s: 1, name: "The Root Tunnel", focus: "Mineral nutrition and water uptake", scene: "garden",
    special: "plant", specialName: "Seedling pot", specialLine: "Tiny root hairs wiggle in the soil... they're drinking!",
    tint: "#C9B28F", floor: "#9C8565", dim: .62, code: "53748", item: "🌱 Root-hair sticker",
    intro: [K("chiikawa", "shock", "We're UNDER the ground?! It's all roots! 😱"), K("hachiware", "normal", "Roots take in water and minerals. Root hairs are the champions of absorption!"), K("usagi", "happy", "Dig dig dig! URA! 🐰")],
    notes: [
      "Plants are <b>autotrophs</b>: they make organic food by photosynthesis, but need <b>mineral ions</b> from the soil.",
      "<b>Nitrate</b> → amino acids and proteins (lack: poor growth, yellow older leaves). <b>Magnesium</b> → chlorophyll (lack: yellowing between veins). Farmers add <b>fertilisers</b> (N, P, K).",
      "<b>Root hair cells</b> have a long, thin extension giving a large surface area, and a thin wall.",
      "Water enters root hairs by <b>osmosis</b> (soil water has a higher water potential than cell sap).",
      "Mineral ions are absorbed mainly by <b>active transport</b> (against the gradient, needs respiration), sometimes by diffusion.",
      "Water moves across the root cortex to the <b>xylem</b>, then up the stem. Gas exchange in roots is by diffusion from air spaces in the soil; waterlogged soil lacks O₂."
    ],
    rules: ["Water in by osmosis · ions in by active transport", "N → proteins · Mg → chlorophyll", "Root hairs: long, thin → large surface area"],
    terms: [["autotroph", "organism that makes its own organic food"], ["root hair cell", "root cell with a long extension for absorption"], ["fertiliser", "substance added to soil to supply mineral ions"], ["mineral ion", "inorganic ion needed by plants, e.g. nitrate"], ["cortex", "tissue between the root surface and the xylem"], ["waterlogged", "soil full of water, lacking air"]] },
  { id: "t12s2", t: "t12", s: 2, name: "The Transpiration Tower", focus: "Transpiration and water transport", scene: "greenhouse",
    special: "potometer", specialName: "Potometer", specialLine: "A leafy shoot in a glass tube... a tiny air bubble is moving!",
    tint: "#BFE3D0", floor: "#8DB9A2", dim: .6, code: "68092", item: "💦 Water-droplet sticker",
    intro: [K("chiikawa", "sparkle", "The water is climbing UP the stem all by itself?! ✨"), K("hachiware", "normal", "Transpiration pulls it! Water evaporates from leaves and the whole column moves up."), K("momonga", "happy", "Water flows towards me because I'm adorable. 💜")],
    notes: [

      "<b>Transpiration pull</b>: water lost from leaves pulls water up the <b>xylem</b> as a continuous column (water molecules stick together by cohesion).",
      "Xylem vessels are dead, hollow, lignified tubes with no end walls, good for carrying water and minerals.",

      "A <b>potometer</b> measures water <b>uptake</b> (about equal to water loss) by the movement of an air bubble. Transpiration also cools the plant and transports minerals."

    rules: ["Evaporation from leaves → transpiration pull → water up the xylem", "Faster: bright, warm, dry, windy", "Potometer measures water UPTAKE"],
    terms: [["transpiration", "loss of water vapour from a plant's leaves"], ["transpiration pull", "pulling of water up the xylem by water loss from leaves"], ["xylem vessel", "dead, hollow, lignified tube carrying water"], ["potometer", "apparatus that measures water uptake by a shoot"], ["humidity", "amount of water vapour in the air"], ["lignin", "hard substance that strengthens xylem walls"]] },
  { id: "t12s3", t: "t12", s: 3, name: "The Phloem Express", focus: "Translocation and support in plants", scene: "lab",
    special: "pump", specialName: "Sugar pump", specialLine: "Sweet sap rushes through a little pipe... up AND down!",
    tint: "#E0C8A8", floor: "#B8A080", dim: .74, code: "19436", item: "🍯 Sweet-sap sticker",
    intro: [K("rakko", "brave", "Boss stage. Water goes up; sugar goes where it's needed. Know your pipes. ⚔️"), K("chiikawa", "brave", "Xylem up... phloem both ways... I-I've got it! 💪"), K("usagi", "happy", "Sugar express! All aboard! 🐰🚂")],
    notes: [

      "Phloem sieve tubes are living cells with sieve plates. Xylem is dead and carries water and minerals <b>upwards</b> only.",
      "Evidence: <b>ringing</b> a stem (removing the bark and phloem) makes the bark above swell with sugar; <b>aphids'</b> mouthparts feed from phloem sap.",

    terms: [["translocation", "transport of sucrose and amino acids in the phloem"], ["phloem", "living tissue that carries organic food"], ["sieve tube", "phloem cell with perforated end walls"], ["source", "part of a plant that makes or releases sugar"], ["sink", "part of a plant that uses or stores sugar"], ["ringing experiment", "removing a ring of bark to show phloem transport"]] },

  /* ---------------- Gas Exchange in Humans ---------------- */
  { id: "t13s1", t: "t13", s: 1, name: "The Airway Adventure", focus: "The breathing system and alveoli", scene: "cellworld",
