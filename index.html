[4, "Why is interphase NOT a 'resting' stage?", ["The cell is growing, making proteins and organelles and replicating DNA", "The cell is dividing its nucleus", "The chromosomes are lined up", "The cell is dead"], "Lots happens before division.", "During interphase the cell is very active: it grows, makes new organelles and copies its DNA ready for division."],
[5, "Chiikawa counted cells in a root tip: 90% in interphase, 10% dividing. Which conclusion is best?", ["Interphase takes up most of the cell cycle time", "Mitosis takes longer than interphase", "Most cells in the root are dead", "Root cells never divide"], "More cells in a stage = longer stage.", "The proportion of cells in each stage reflects how long that stage lasts, so interphase is the longest part of the cycle."],
[5, "A student says: 'The daughter cells from mitosis are genetically different from the parent.' Evaluate.", ["Wrong: DNA is copied exactly and shared equally, so they are genetically identical", "Correct: crossing over happens in mitosis", "Correct: each daughter gets half the chromosomes", "Wrong: they have twice as much DNA"], "Is there any shuffling in mitosis?", "In mitosis, replicated chromatids separate equally, so both daughter cells are genetically identical to the parent (barring mutations)."],
[6, "You want to see as many cells in mitosis as possible under a microscope. Which part of a plant should you use?", ["The root tip, squashed and stained", "A mature leaf", "The middle of the stem", "A dry seed coat"], "Where is growth happening fastest?", "The root tip has many actively dividing cells. Squashing spreads them into a single layer and staining shows the chromosomes."],
[6, "You make a flip-book of mitosis. Which picture sequence is correct?", ["Chromosomes appear → line up in the middle → chromatids pulled apart → two nuclei form → cell splits", "Two nuclei form → chromosomes appear → cell splits → line up", "Chromatids pulled apart → chromosomes appear → line up", "Cell splits → DNA replicates → chromosomes line up"], "PMAT, then cytokinesis.", "Prophase (chromosomes visible) → metaphase (line up) → anaphase (chromatids apart) → telophase (nuclei form) → cytokinesis (cell splits)."]
];
QB.t4s2 = [
[1, "What type of cells does meiosis produce?", ["Gametes (sex cells)", "Skin cells", "Muscle cells", "Root tip cells"], "Meiosis is for sexual reproduction.", "Meiosis produces gametes such as sperm and egg cells."],
[1, "How many daughter cells are made from one cell by meiosis?", ["Four", "Two", "One", "Eight"], "Meiosis has TWO divisions.", "Two divisions produce four haploid daughter cells."],
[2, "Human body cells have 46 chromosomes. How many do human gametes have?", ["23", "46", "92", "12"], "Gametes are haploid.", "Gametes are haploid (n = 23), so fertilisation restores the diploid number (2n = 46)."],
[2, "What are homologous chromosomes?", ["A pair of chromosomes of the same size and shape, one from each parent, carrying the same genes", "Two sister chromatids", "Chromosomes from the same parent only", "Chromosomes in a gamete"], "Homo- = same.", "Homologous chromosomes are a matching pair (one maternal, one paternal) with genes for the same features at the same positions."],
[2, "What is crossing over?", ["Exchange of parts between chromatids of homologous chromosomes during meiosis I", "Chromosomes crossing to the other side of the cell in mitosis", "Two gametes fusing", "DNA replication"], "It happens when homologous chromosomes pair.", "In meiosis I, chromatids of homologous chromosomes exchange sections, making new combinations of alleles."],
[3, "Why is it important that gametes are haploid?", ["So the chromosome number stays constant from one generation to the next after fertilisation", "So gametes can divide by mitosis faster", "So gametes are larger", "So gametes do not need nuclei"], "n + n = ?", "Two haploid gametes (n) fuse to form a diploid zygote (2n). Without halving, the chromosome number would double every generation."],
[3, "A dog's body cells have 78 chromosomes. How many chromosomes are in a dog sperm?", ["39", "78", "156", "18"], "Halve it.", "Gametes have half the diploid number: 78 ÷ 2 = 39."],
{ b: 3, type: "dial", q: "Set each dial for meiosis.", labels: ["Number of divisions", "Daughter cells", "Chromosome number"], dials: [["1", "2", "4"], ["2", "4", "8"], ["Haploid", "Diploid"]], answer: [1, 1, 0],
  hint: "Meiosis I halves the number; meiosis II separates chromatids.", explain: "Meiosis has 2 divisions, producing 4 daughter cells that are haploid." },
[4, "Which TWO events in meiosis create genetic variation?", ["Crossing over and independent assortment", "DNA replication and cytokinesis", "Spindle formation and interphase", "Growth and repair"], "They shuffle genes and chromosomes.", "Crossing over swaps sections of chromatids; independent assortment randomly mixes maternal and paternal chromosomes into gametes."],
[4, "An organism has 2 pairs of homologous chromosomes. By independent assortment alone, how many different gamete combinations are possible?", ["4", "2", "8", "16"], "The formula is 2ⁿ, where n = number of pairs.", "2² = 4 combinations. Humans (23 pairs) can make 2²³ (over 8 million) combinations."],
[4, "Why are brothers and sisters (not identical twins) different from each other?", ["Each came from different gametes, produced with crossing over and independent assortment, plus random fertilisation", "They have different numbers of chromosomes", "Mitosis makes them different", "They have different parents"], "Think of the three sources of variation.", "Every gamete is genetically unique, and any sperm can fertilise any egg, so each child gets a unique combination."],
[5, "Usagi says: 'Meiosis is just mitosis done twice.' Evaluate.", ["Wrong: in meiosis homologous chromosomes pair, cross over and separate in the first division, halving the chromosome number", "Correct: meiosis is two mitoses", "Correct: both give identical cells", "Wrong: meiosis has only one division"], "What happens in meiosis I that never happens in mitosis?", "Meiosis I separates homologous pairs (after crossing over), which never happens in mitosis. The products are haploid and genetically different."],
[5, "Which statement about variation is best supported?", ["Variation from meiosis helps a population survive changes, because some individuals may have useful features", "Variation is always harmful", "Variation only comes from the environment", "Identical offspring are always better"], "Think about a new disease or climate change.", "Genetic variation means some individuals may survive new conditions, which helps the species adapt (natural selection)."],
[6, "You model meiosis with 2 pairs of coloured socks (red = from mum, blue = from dad). Which model shows independent assortment?", ["Shuffling which colour from each pair goes into each gamete, giving different mixes", "Always putting both red socks in one gamete", "Cutting socks in half", "Keeping all socks in one pile"], "Each pair separates independently.", "Each homologous pair separates independently, so gametes can get any mix of maternal and paternal chromosomes."],
[6, "You write a comic explaining why fertilisation needs meiosis. Which storyline is correct?", ["Sperm (23) + egg (23) → zygote (46); without meiosis, a baby would have 92 chromosomes", "Sperm (46) + egg (46) → zygote (46)", "Sperm (23) + egg (46) → zygote (69)", "Sperm (12) + egg (12) → zygote (24)"], "n + n = 2n.", "Meiosis halves the number so that two gametes restore 46 chromosomes at fertilisation."]
];
QB.t4s3 = [
[1, "Which type of cell division is used for growth and repair?", ["Mitosis", "Meiosis", "Both equally", "Neither"], "Repair needs identical cells.", "Mitosis produces genetically identical cells for growth, repair and replacement."],
[1, "Where does meiosis take place in humans?", ["In the testes and ovaries", "In the skin", "In the liver", "In the bone marrow"], "Where are gametes made?", "Meiosis happens in reproductive organs: the testes (sperm) and ovaries (eggs)."],
[2, "Which type of division produces genetically identical cells?", ["Mitosis", "Meiosis", "Fertilisation", "Crossing over"], "No shuffling happens.", "Mitosis gives identical diploid cells; meiosis gives genetically different haploid cells."],
[2, "Why does a cut on your skin heal?", ["Skin cells divide by mitosis to replace damaged cells", "Skin cells divide by meiosis", "New skin diffuses in", "Blood turns into skin"], "Repair = identical new cells.", "Cells near the wound divide by mitosis to replace the lost cells with identical ones."],
[2, "Taking a cutting of a plant to grow a new plant uses which type of division?", ["Mitosis (asexual reproduction)", "Meiosis (sexual reproduction)", "Fertilisation", "Phagocytosis"], "The new plant is a clone.", "Cuttings grow by mitosis, so the new plant is genetically identical to the parent: asexual reproduction."],
[3, "Which of these would divide by meiosis?", ["A cell in the anther making pollen", "A root tip cell", "A skin cell", "A white blood cell precursor in bone marrow"], "Pollen grains contain male gametes.", "Anthers make pollen by meiosis. Root tips, skin and bone marrow divide by mitosis."],
[3, "A cell divides and gives two cells, each with 46 chromosomes and identical DNA. Which division was it?", ["Mitosis", "Meiosis I", "Meiosis II", "Fertilisation"], "Two identical diploid cells.", "Two identical diploid daughter cells mean mitosis."],
{ b: 3, type: "dial", q: "Compare mitosis and meiosis.", labels: ["Mitosis: daughter cells", "Meiosis: daughter cells", "Crossing over happens in"], dials: [["2 diploid", "4 haploid", "2 haploid"], ["2 diploid", "4 haploid", "2 haploid"], ["Mitosis", "Meiosis", "Both"]], answer: [0, 1, 1],
  hint: "Mitosis: 1 division. Meiosis: 2 divisions and pairing of homologues.", explain: "Mitosis gives 2 identical diploid cells; meiosis gives 4 genetically different haploid cells, with crossing over in meiosis I." },
[4, "A cell has 20 chromosomes. After meiosis, how many chromosomes are in each cell, and how many cells are there?", ["10 chromosomes, 4 cells", "20 chromosomes, 2 cells", "10 chromosomes, 2 cells", "40 chromosomes, 4 cells"], "Meiosis: halve the number, 4 cells.", "Meiosis produces 4 haploid cells, each with 20 ÷ 2 = 10 chromosomes."],
[4, "Why is cancer linked to cell division?", ["Cancer cells divide by mitosis in an uncontrolled way, forming a tumour", "Cancer cells divide by meiosis", "Cancer cells stop dividing", "Cancer cells have no DNA"], "What goes wrong with the control of the cell cycle?", "Normally mitosis is tightly controlled. In cancer, mutations let cells divide without control, forming tumours."],
[4, "Identical twins form when one zygote splits into two. Why are they genetically identical?", ["The two embryos came from the same zygote, whose cells were made by mitosis", "They came from two different sperm", "They were made by meiosis only", "They share the same gametes by chance"], "One zygote → mitosis.", "Both twins come from the same fertilised egg and develop by mitosis, so their DNA is identical."],
[5, "A gardener wants many copies of a prize-winning rose with exactly the same flower colour. Which method is best, and why?", ["Cuttings, because mitosis produces genetically identical plants", "Seeds, because meiosis produces identical offspring", "Seeds, because they grow faster", "Cuttings, because meiosis mixes genes"], "Which division gives clones?", "Cuttings grow by mitosis, so every new plant is identical to the parent. Seeds (from meiosis and fertilisation) would show variation."],
[5, "Hachiware says: 'Asexual reproduction is always better than sexual reproduction.' Which is the best judgement?", ["Not always: it is fast and keeps good features, but the lack of variation means a new disease could wipe out all the clones", "True: variation is always bad", "False: asexual reproduction is always slower", "True: clones never get diseases"], "Weigh pros and cons.", "Asexual reproduction is fast and needs one parent, but no variation means the population may not survive changes like new diseases."],
[6, "You design a revision table. Which row correctly compares mitosis and meiosis?", ["Mitosis: 1 division, 2 identical diploid cells, growth/repair | Meiosis: 2 divisions, 4 varied haploid cells, gametes", "Mitosis: 2 divisions, gametes | Meiosis: 1 division, repair", "Both: 4 haploid cells", "Mitosis: crossing over | Meiosis: no pairing"], "Divisions, number, ploidy, variation, purpose.", "Mitosis: one division → 2 identical diploid cells. Meiosis: two divisions → 4 genetically different haploid gametes."],
[6, "A scientist wants to test a new drug that stops cancer cells dividing. Which cells would be best to watch in the first lab test?", ["Fast-dividing cells grown in culture, comparing treated and untreated groups", "Red blood cells, which do not divide", "Dead cells", "Only gametes"], "You need dividing cells and a control.", "Use actively dividing cells, compare a treated group with an untreated control and count the proportion of cells in mitosis."]
];

QB.t5s1 = [
[1, "What is an enzyme?", ["A biological catalyst, usually a protein", "A type of sugar", "A hormone made of fat", "A mineral ion"], "It speeds up reactions without being used up.", "Enzymes are biological catalysts, mostly proteins, that speed up reactions in living things."],
[1, "What is the name of the part of an enzyme where the substrate binds?", ["Active site", "Centromere", "Stroma", "Nucleus"], "It's where the action happens!", "The substrate fits into the active site to form an enzyme–substrate complex."],
[2, "How do enzymes speed up reactions?", ["They lower the activation energy needed", "They raise the temperature of the cell", "They add energy to the substrate", "They are used up in the reaction"], "Think of lowering a hurdle.", "Enzymes provide a pathway with lower activation energy, so reactions happen faster at body temperature."],
[2, "What does 'enzymes are specific' mean?", ["Each enzyme acts on only one substrate (or a few similar ones) because of the shape of its active site", "Enzymes work at every temperature", "Enzymes can digest anything", "Enzymes are only found in the stomach"], "Lock and key.", "The active site has a shape complementary to one particular substrate, so each enzyme catalyses one type of reaction."],
[2, "Which process is an example of anabolism?", ["Making proteins from amino acids", "Digesting starch to maltose", "Respiration of glucose", "Breaking down fat"], "Ana- = building up.", "Anabolism builds large molecules from small ones and needs energy, e.g. protein synthesis, photosynthesis."],
[3, "Amylase digests starch but not protein. Which idea best explains this?", ["The shape of amylase's active site is complementary only to starch", "Protein is too small", "Amylase is used up by starch", "Protein has no active site"], "Only the right key fits the lock.", "Amylase's active site fits starch molecules, not proteins, so it can only catalyse starch hydrolysis."],
{ b: 3, q: "The diagram shows an enzyme and three molecules. Which molecule is most likely to be its substrate?", svg: "lockKey", fix: true, choices: ["A", "B", "C", "All of them"], answer: 0,
  hint: "Compare each shape with the notch in the enzyme.", explain: "Molecule A has a shape complementary to the active site, so it can bind and form an enzyme–substrate complex." },
{ b: 3, type: "dial", q: "Classify each process.", labels: ["Respiration", "Photosynthesis", "Digestion"], dials: [["Anabolism", "Catabolism"], ["Anabolism", "Catabolism"], ["Anabolism", "Catabolism"]], answer: [1, 0, 1],
  hint: "Building up = anabolism. Breaking down = catabolism.", explain: "Respiration and digestion break molecules down (catabolism). Photosynthesis builds glucose from CO₂ and water (anabolism)." },
[4, "After a reaction, the amount of enzyme is the same as at the start. What does this show?", ["Enzymes are not used up, so they can be reused many times", "Enzymes are made by the substrate", "No reaction happened", "Enzymes turn into products"], "Catalysts are unchanged at the end.", "Enzymes are unchanged at the end of a reaction and can catalyse the reaction again and again, so only small amounts are needed."],
[4, "How does the induced fit model differ from the lock-and-key model?", ["In induced fit, the active site changes shape slightly as the substrate binds", "In induced fit, any substrate can bind", "In induced fit, the enzyme is used up", "In induced fit, there is no active site"], "Think of a glove fitting a hand.", "The lock-and-key model shows a rigid active site. The induced fit model says the active site moulds slightly around the substrate for a tighter fit."],
[4, "Digestive enzymes are extracellular. What does this mean?", ["They are made inside cells but work outside the cells that made them", "They work only inside the nucleus", "They are made outside cells", "They never leave the mitochondria"], "Extra- = outside.", "Extracellular enzymes are secreted and act outside the cell, e.g. amylase in the mouth. Respiratory enzymes are intracellular."],
[5, "Usagi says: 'Enzymes make reactions happen that would never happen otherwise.' Which is the best judgement?", ["Not quite: enzymes speed up reactions that could happen anyway, by lowering activation energy", "Correct: enzymes create new reactions", "Correct: enzymes add energy", "Wrong: enzymes slow reactions down"], "Catalysts change the RATE.", "Enzymes don't make impossible reactions happen. They speed up reactions by lowering activation energy, so they happen fast enough at body temperature."],
[5, "Which evidence best supports the idea that enzymes are proteins?", ["Enzymes stop working after boiling, just like other proteins that denature", "Enzymes are colourless", "Enzymes dissolve in water", "Enzymes are found in cells"], "What happens to proteins when heated?", "Like other proteins, enzymes lose their function when heated because they denature. (Most enzymes also give a positive Biuret test.)"],
[6, "You draw a comic of how an enzyme works. Which order is correct?", ["Substrate collides with active site → E–S complex forms → reaction happens → products leave → enzyme is free again", "Enzyme is used up → products form → substrate appears", "Products bind → substrate leaves → enzyme dies", "Enzyme binds to any molecule → it explodes"], "The enzyme is reused.", "The substrate binds to the active site forming an E–S complex; it reacts; the products are released; the unchanged enzyme can bind another substrate."],
[6, "Chiikawa wants to show that catalase in potato speeds up breakdown of hydrogen peroxide. Which plan is best?", ["Add equal volumes of H₂O₂ to fresh potato and to boiled potato; compare the volume of oxygen collected in the same time", "Add H₂O₂ to fresh potato only", "Add water to potato", "Heat H₂O₂ with no potato"], "Include a control with denatured enzyme.", "Boiled potato (denatured enzyme) is the control. Keep volumes, temperature and potato mass the same, and compare O₂ produced."]
];
QB.t5s2 = [

[1, "At which pH does pepsin in the stomach work best?", ["About pH 2", "About pH 7", "About pH 9", "About pH 12"], "The stomach contains hydrochloric acid.", "Pepsin works best in acidic conditions, about pH 2."],
[2, "Why does enzyme activity decrease quickly above the optimum temperature?", ["The enzyme denatures: the active site changes shape so the substrate no longer fits", "The substrate evaporates", "The enzyme is used up", "Molecules move more slowly"], "Heat changes protein shape.", "Above the optimum, bonds holding the enzyme's shape break; the active site changes and can no longer bind the substrate."],
[2, "What happens to an enzyme at 4 °C (in a fridge)?", ["It is inactive but not denatured; it works again when warmed", "It is permanently destroyed", "It works faster", "It turns into a substrate"], "Cold slows molecules down.", "At low temperatures, molecules move slowly and collide less, so activity is low, but the enzyme's shape is not damaged."],
[2, "Why does the rate increase as temperature rises from 10 °C to 30 °C?", ["Molecules gain kinetic energy and collide more often with the active site", "The enzyme denatures", "The substrate is used up faster", "pH falls"], "More energy, more collisions.", "Higher temperature gives molecules more kinetic energy, so more successful collisions between enzyme and substrate happen per second."],
{ b: 3, svg: "tempGraph", fix: true, q: "On the graph, which point shows the optimum temperature?", choices: ["Point B", "Point A", "Point C", "None of them"], answer: 0, hint: "The highest point.", explain: "Point B is the peak of the curve: the temperature at which the rate is highest." },
[3, "Trypsin works in the small intestine. Which pH suits it best?", ["About pH 8 (slightly alkaline)", "About pH 2", "About pH 5", "About pH 12"], "Pancreatic juice and bile are alkaline.", "Trypsin works best in slightly alkaline conditions (about pH 8) in the small intestine."],
{ b: 3, type: "dial", q: "Look at the pH graph. Set each dial.", svg: "phGraph", labels: ["Enzyme P is likely", "Enzyme Q is likely", "Optimum pH of Q"], dials: [["Pepsin", "Trypsin"], ["Pepsin", "Trypsin"], ["About 2", "About 8"]], answer: [0, 1, 1],

  hint: "B to C is above the optimum.", explain: "Above the optimum temperature the enzyme's active site changes shape (denaturation), so fewer E–S complexes form and the rate falls." },
{ b: 4, q: "On the substrate graph, what limits the rate at point Y?", svg: "substrateGraph", fix: true, choices: ["Enzyme concentration (all active sites are occupied)", "Substrate concentration", "The enzyme has been denatured", "There is no substrate"], answer: 0,
  hint: "Adding more substrate at Y doesn't raise the rate.", explain: "At Y, all active sites are busy, so extra substrate cannot increase the rate. Enzyme concentration is the limiting factor. At X, substrate concentration is limiting." },
[4, "Two tubes of starch + amylase are kept at 0 °C and 80 °C for 10 minutes, then both moved to 37 °C. What happens?", ["The 0 °C tube starts digesting starch; the 80 °C tube does not", "Both tubes digest starch", "Neither tube digests starch", "Only the 80 °C tube digests starch"], "Cold = inactive; hot = denatured.", "At 0 °C the enzyme was only inactive, so it works when warmed. At 80 °C it was denatured permanently."],
[5, "A student tests amylase at 20, 40 and 60 °C and concludes the optimum is exactly 40 °C. Evaluate.", ["The conclusion is too precise; more temperatures near 40 °C (e.g. 30, 35, 45 °C) are needed", "The conclusion is certainly correct", "The optimum must be 60 °C", "Temperature does not affect amylase"], "Big gaps between temperatures hide the true peak.", "With only three widely spaced temperatures, the true optimum could be anywhere between 20 and 60 °C. Test smaller intervals near the highest rate."],
[5, "Usagi says: 'Boiling an enzyme is the same as putting it in the fridge, because both stop it working.' Evaluate.", ["Wrong: boiling denatures it permanently; cold only makes it inactive temporarily", "Correct: both destroy the enzyme", "Correct: both speed it up", "Wrong: the fridge denatures it"], "Can each one recover?", "Boiling changes the active site shape permanently. Cold slows molecules; the enzyme works again when warmed."],
[6, "You investigate the effect of pH on amylase. Which plan is best?", ["Use buffer solutions of different pH; keep amylase volume, starch concentration and temperature the same; time how long until iodine no longer turns blue-black", "Change pH and temperature at the same time", "Use one pH only", "Add different enzymes at each pH"], "Change ONE variable; measure an end point.", "Buffers control pH; all other variables are kept constant. The time for starch to disappear (iodine stays brown) measures the rate."],
[6, "A factory uses an enzyme from bacteria living in hot springs. Why is this a good idea?", ["The enzyme has a high optimum temperature, so reactions can run fast at high temperatures without denaturing it", "Hot-spring enzymes work only in the cold", "It is cheaper to boil enzymes", "Bacteria enzymes never denature at any temperature"], "Enzymes are adapted to their habitat.", "Enzymes from organisms in hot springs are stable at high temperatures, so industrial processes can run hot and fast."]
];
QB.t5s3 = [
[1, "What does an enzyme inhibitor do?", ["It slows down or stops enzyme activity", "It speeds up the enzyme", "It becomes the product", "It makes more enzyme"], "Inhibit = hold back.", "Inhibitors reduce the rate of enzyme-catalysed reactions."],
[1, "Which enzyme is added to milk to make lactose-free milk?", ["Lactase", "Pepsin", "Amylase", "Lipase"], "Enzymes are often named after their substrate.", "Lactase breaks lactose into glucose and galactose, so people who are lactose intolerant can drink the milk."],
[2, "How does a competitive inhibitor work?", ["It has a similar shape to the substrate and binds to the active site", "It binds elsewhere and changes the enzyme's shape", "It raises the temperature", "It destroys the substrate"], "It competes for the same place.", "A competitive inhibitor resembles the substrate and occupies the active site, blocking the substrate."],
[2, "How does a non-competitive inhibitor work?", ["It binds to a site other than the active site and changes the active site's shape", "It fits into the active site", "It adds more substrate", "It lowers the pH only"], "Non-competitive = doesn't compete for the active site.", "It binds elsewhere on the enzyme, changing the active site so the substrate no longer fits well."],
[2, "Why does biological washing powder contain proteases?", ["To break down protein stains such as blood and egg", "To remove sugar from clothes", "To make clothes smell nice", "To bleach clothes"], "Protease acts on protein.", "Proteases hydrolyse proteins in stains into soluble amino acids and peptides that wash away."],

{ b: 3, type: "dial", q: "Match each enzyme to its use.", labels: ["Pectinase", "Protease", "Lactase"], dials: [["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"], ["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"], ["Clearer fruit juice", "Meat tenderiser", "Lactose-free milk"]], answer: [0, 1, 2],
  hint: "Pectin is in fruit cell walls; meat is protein.", explain: "Pectinase breaks down pectin to release more, clearer juice; protease tenderises meat; lactase makes lactose-free milk." },
[4, "Cyanide stops a respiratory enzyme, and more substrate cannot reverse it. Which best describes cyanide?", ["A non-competitive inhibitor", "A competitive inhibitor", "A substrate", "A catalyst"], "More substrate doesn't help.", "Because adding substrate does not overcome it, cyanide acts as a non-competitive inhibitor (it binds away from the active site)."],
[4, "With a competitive inhibitor present, the maximum rate is still reached at very high substrate concentration. What does this tell you?", ["At high substrate concentration, substrate molecules out-compete the inhibitor for active sites", "The inhibitor denatures the enzyme", "The enzyme is used up", "The inhibitor has become a product"], "Who wins the race to the active site?", "With lots of substrate, the chance of substrate (not inhibitor) binding is high, so the maximum rate can still be reached."],
[4, "Why is pectinase added when making apple juice?", ["It breaks down pectin in cell walls, so more juice is released and it is clearer", "It adds sugar", "It kills bacteria", "It makes the juice fizzy"], "Pectin holds plant cells together.", "Pectinase hydrolyses pectin, breaking down cell walls to release more juice and reduce cloudiness."],
[5, "Momonga says: 'Enzymes in industry are always better than chemical catalysts.' Which is the best judgement?", ["Often better (specific, work at low temperature, save energy), but they can be denatured and may be expensive to purify", "Always better in every way", "Always worse", "They are the same as chemical catalysts"], "Consider pros and cons.", "Enzymes are specific and work under mild conditions, saving energy. But they are sensitive to temperature and pH, and can be costly."],
[5, "A company claims its washing powder works 'at any temperature'. Which is the best evaluation?", ["Unlikely: enzymes have an optimum temperature and are denatured at high temperatures", "Correct: enzymes work at all temperatures", "Correct: enzymes are not proteins", "Wrong: enzymes work only below 0 °C"], "Remember the temperature graph.", "Enzymes have a limited working range: low activity when cold and denatured when very hot. The claim is misleading."],

{ b: 3, type: "dial", q: "Where does each happen?", labels: ["Photolysis of water", "Carbon fixation", "ATP made using light"], dials: [["Thylakoids", "Stroma"], ["Thylakoids", "Stroma"], ["Thylakoids", "Stroma"]], answer: [0, 1, 0],

[2, "Why is the Calvin cycle called a CYCLE?", ["RuBP is regenerated so it can fix more CO₂", "It goes round the chloroplast", "It happens only at night", "It releases oxygen in circles"], "What happens to most triose phosphate?", "Most triose phosphate is used to remake RuBP, which can accept CO₂ again, so the reactions repeat."],
[2, "Which enzyme-controlled stage turns GP into triose phosphate?", ["Reduction using ATP and NADPH", "Photolysis using light", "Oxidation using oxygen", "Hydrolysis using water"], "GP gains hydrogen.", "GP is reduced to triose phosphate using ATP (energy) and NADPH (hydrogen)."],

[3, "What is GP converted into, using ATP and NADPH?", ["Triose phosphate", "RuBP directly without energy", "Oxygen", "Water"], "A 3-carbon sugar.", "GP is reduced to triose phosphate using ATP and NADPH. Triose phosphate is used to make glucose and to regenerate RuBP."],
[3, "Why does the rate of the Calvin cycle rise with temperature (up to a point)?", ["It is controlled by enzymes, which work faster when warmer", "It uses light energy directly", "CO₂ becomes hotter", "Water evaporates faster"], "What controls the reactions?", "The Calvin cycle is a series of enzyme-controlled reactions, so it speeds up with temperature until enzymes start to denature."],
[4, "A plant is moved from light into darkness. What happens to GP and RuBP soon after?", ["GP builds up and RuBP decreases", "RuBP builds up and GP decreases", "Both increase", "Both stay the same"], "No ATP and NADPH → GP can't be reduced.", "Without light, no ATP or NADPH is made, so GP cannot be converted to triose phosphate (GP accumulates) and RuBP isn't regenerated (it falls)."],
[4, "The CO₂ concentration suddenly drops, but light stays bright. What happens to RuBP?", ["RuBP builds up because less is used to fix CO₂", "RuBP decreases", "RuBP turns into oxygen", "No change"], "RuBP is the CO₂ acceptor.", "With less CO₂, less RuBP is used in fixation, while it is still regenerated from triose phosphate, so RuBP accumulates."],

[5, "Hachiware says: 'The glucose made in photosynthesis is only used for respiration.' Evaluate.", ["Incomplete: it is also turned into starch (storage), sucrose (transport), cellulose (cell walls), amino acids and lipids", "Correct: plants only respire glucose", "Wrong: plants don't use glucose", "Wrong: glucose is turned into oxygen"], "What else do plants need to build?", "Triose phosphate and glucose are used for respiration and to make starch, sucrose, cellulose, amino acids (with nitrate) and lipids."],
[5, "Why do plants store starch rather than glucose in their cells?", ["Starch is insoluble, so it does not affect osmosis and stays in place", "Starch is sweeter", "Glucose cannot be made in leaves", "Starch releases oxygen"], "Think about water potential.", "Starch is insoluble and compact, so large amounts can be stored without drawing water into the cells by osmosis."],
[6, "You draw a flow chart of photosynthesis. Which is correct?", ["Light + H₂O → (thylakoids) → O₂ + ATP + NADPH → (stroma) CO₂ + RuBP → GP → triose phosphate → glucose / RuBP", "CO₂ → O₂ directly in the thylakoids", "Glucose → CO₂ + H₂O in the stroma", "ATP → light → water"], "Two linked stages.", "Light reactions make O₂, ATP and NADPH; the Calvin cycle uses them to fix CO₂ into GP, then triose phosphate, glucose and RuBP."],
[6, "A student wants to show that CO₂ is fixed into sugar. Which plan would give the clearest evidence?", ["Supply the plant with CO₂ containing radioactive carbon, then detect radioactivity in GP and sugars over time", "Measure leaf length", "Count stomata", "Test the leaf with Benedict's only"], "Follow the carbon atoms.", "Labelled carbon from CO₂ appears first in GP, then in triose phosphate and sugars, showing the path of carbon fixation."]

[4, "Why is a plant with its leaf in a flask of sodium hydrogencarbonate set up alongside the soda lime flask?", ["It is the control, supplying CO₂ so only CO₂ differs between the set-ups", "It absorbs more CO₂", "It kills the leaf", "It adds starch directly"], "Sodium hydrogencarbonate releases CO₂.", "The control leaf has CO₂; the test leaf does not. Only one variable differs, so the result shows CO₂ is needed."],
[5, "A student tested a leaf that was NOT destarched and found starch after 6 hours in light. The student concludes the leaf photosynthesised during the experiment. Evaluate.", ["Not valid: the starch could have been made before the experiment", "Valid: starch always comes from the last 6 hours", "Valid: iodine shows the time starch was made", "Not valid: iodine does not test for starch"], "Why destarch first?", "Without destarching, stored starch from before the experiment could give a positive result, so the conclusion is not supported."],
[5, "Two students used hydrogencarbonate indicator. One tube stayed red in dim light. Student A says 'the plant is dead'. Student B says 'it is at the compensation point'. Who is more likely right, and how could you check?", ["Student B; move the tube to bright light (should turn purple) and to darkness (should turn yellow)", "Student A; dead plants keep indicator red", "Neither; indicator never changes", "Student A; no need to check"], "What would a living plant do in different light?", "A living plant at the compensation point shows no net change. Changing the light should change the colour; a dead plant would not turn purple."],
[6, "You design an experiment to show CO₂ is needed for photosynthesis. Which plan is best?", ["Destarch two plants; put one in a bag with soda lime (absorbs CO₂) and one with sodium hydrogencarbonate; give both light; test a leaf from each for starch", "Put one plant in light and one in darkness", "Test one plant for starch without destarching", "Water one plant and not the other"], "Remove only CO₂ from one set-up.", "Soda lime removes CO₂; the control has CO₂. Both are destarched and kept in the same light and temperature. Only the control makes starch."],
[6, "You want to find the compensation point of a plant using hydrogencarbonate indicator. Which plan is best?", ["Set up identical tubes of leaves and indicator at a range of light intensities; after the same time, find the intensity where the indicator stays red", "Use one tube in bright light only", "Use tubes without leaves", "Put all tubes in darkness"], "The compensation point shows no net change.", "Across a range of light intensities, the tube that stays red shows photosynthesis = respiration: the compensation point."]

QB.t7s1 = [

[2, "What is glucose broken down into during glycolysis?", ["Two molecules of pyruvate", "Carbon dioxide and water", "Lactic acid only", "Six molecules of CO₂"], "A 6-carbon molecule splits into two 3-carbon molecules.", "Glycolysis splits glucose (6C) into 2 pyruvate (3C), with a net gain of 2 ATP."],
[2, "Where does the Krebs cycle happen?", ["In the mitochondrial matrix", "In the cytoplasm", "In the nucleus", "On the cell membrane"], "The fluid inside the mitochondrion.", "The Krebs cycle takes place in the matrix of the mitochondrion, releasing CO₂."],
[2, "What is the role of oxygen in aerobic respiration?", ["It is the final acceptor of hydrogen (electrons), forming water", "It splits glucose in glycolysis", "It is released as a product", "It makes carbon dioxide"], "Where does the water come from?", "In oxidative phosphorylation, oxygen accepts hydrogen at the end of the carrier chain, forming water. Without it, the chain stops."],
[3, "Which stage of aerobic respiration produces the MOST ATP?", ["Oxidative phosphorylation", "Glycolysis", "Krebs cycle", "They all make the same amount"], "It happens on the inner membrane.", "Oxidative phosphorylation on the cristae produces most of the ATP, using hydrogen carried by NADH."],
[3, "Why are cristae folded?", ["To give a large surface area for the reactions that make ATP", "To store glucose", "To make the mitochondrion move", "To trap light"], "More membrane, more carriers.", "Folding the inner membrane gives more surface area for the carriers and enzymes of oxidative phosphorylation."],
{ b: 3, type: "dial", q: "The diagram shows a mitochondrion. Name A, B and C.", svg: "mito", labels: ["A", "B", "C"], dials: [["Outer membrane", "Crista (inner membrane)", "Matrix"], ["Outer membrane", "Crista (inner membrane)", "Matrix"], ["Outer membrane", "Crista (inner membrane)", "Matrix"]], answer: [0, 1, 2],
  hint: "A is the outermost line; B is the folded line; C is the fluid inside.", explain: "A is the outer membrane, B a crista (fold of the inner membrane, where most ATP is made), C the matrix (site of the Krebs cycle)." },
{ b: 4, type: "dial", q: "Where does each stage happen?", labels: ["Glycolysis", "Krebs cycle", "Oxidative phosphorylation"], dials: [["Cytoplasm", "Matrix", "Cristae"], ["Cytoplasm", "Matrix", "Cristae"], ["Cytoplasm", "Matrix", "Cristae"]], answer: [0, 1, 2],

[4, "Which process does NOT use ATP?", ["Diffusion of oxygen into cells", "Muscle contraction", "Active transport", "Protein synthesis"], "Passive processes need no ATP.", "Diffusion is passive and needs no ATP. Contraction, active transport and protein synthesis all need energy."],
[5, "Usagi says: 'Plants photosynthesise, so they don't need to respire.' Which is the best judgement?", ["Wrong: all living cells, including plant cells, respire all the time to release energy", "Correct: plants only photosynthesise", "Correct: plants respire only at night", "Wrong: plants only respire, never photosynthesise"], "Do root cells photosynthesise?", "Plant cells respire day and night to make ATP. Photosynthesis only happens in green cells in light."],
[5, "A student claims 'respiration is the same as breathing'. Which is the best correction?", ["Breathing moves air in and out of the lungs; respiration is a chemical process in cells that releases energy from food", "They are the same thing", "Breathing happens in cells", "Respiration only happens in the lungs"], "One is a physical movement; one is chemistry.", "Breathing (ventilation) is the movement of air. Respiration is a series of enzyme-controlled reactions in every living cell."],
[6, "You design a comic journey of a glucose molecule in aerobic respiration. Which path is correct?", ["Cytoplasm (glycolysis → pyruvate) → matrix (Krebs cycle, CO₂ released) → cristae (oxidative phosphorylation, O₂ → water, most ATP)", "Matrix → cytoplasm → nucleus", "Chloroplast → matrix → cytoplasm", "Cristae → cytoplasm → matrix"], "Follow the order of the stages.", "Glucose is split in the cytoplasm; pyruvate enters the matrix for the Krebs cycle; NADH delivers hydrogen to the cristae where O₂ forms water and most ATP is made."],
[6, "Chiikawa wants to explain why a runner needs oxygen. Which explanation is best?", ["Oxygen allows aerobic respiration, which releases much more ATP per glucose for muscle contraction than anaerobic respiration", "Oxygen gives the muscles sugar", "Oxygen stops lactic acid being made in the lungs", "Oxygen turns fat into muscle"], "Compare ATP yields.", "With oxygen, glucose is fully broken down, releasing far more ATP than glycolysis alone. More ATP powers more contraction."]

[2, "What makes bread dough rise?", ["Carbon dioxide gas produced by yeast", "Oxygen from the flour", "Ethanol boiling", "Lactic acid"], "Bubbles of gas get trapped.", "Yeast respires anaerobically, producing CO₂ bubbles that are trapped in the dough, making it rise. Ethanol evaporates during baking."],

[3, "Which product is made by BOTH aerobic respiration and anaerobic respiration in yeast, but NOT by anaerobic respiration in muscles?", ["Carbon dioxide", "Lactic acid", "Water", "Ethanol"], "Muscles' anaerobic product has no gas.", "CO₂ is produced by aerobic respiration and by yeast fermentation, but not by lactic acid fermentation in muscles."],
{ b: 3, type: "dial", q: "Set each dial for anaerobic respiration.", labels: ["In muscles: product", "In yeast: products", "ATP per glucose"], dials: [["Lactic acid", "Ethanol + CO₂", "CO₂ + water"], ["Lactic acid", "Ethanol + CO₂", "CO₂ + water"], ["2", "About 30+"]], answer: [0, 1, 0],

  hint: "Which liquid goes milky with a gas?", explain: "Y is limewater. It turns milky because the yeast produces CO₂ in anaerobic respiration." },
[4, "The glucose solution was boiled and cooled before adding yeast. Why?", ["To remove dissolved oxygen and kill other microbes", "To add more sugar", "To feed the yeast", "To make ethanol"], "Boiling drives off dissolved gases.", "Boiling removes dissolved oxygen (anaerobic conditions) and kills microbes. It is cooled so the yeast is not killed."],
[5, "Hachiware says: 'Anaerobic respiration is useless because it makes so little ATP.' Evaluate.", ["Not true: it gives a quick burst of energy when oxygen is short, and is useful to humans in baking, brewing and yoghurt", "True: it has no use at all", "True: only plants do it", "False: it makes more ATP than aerobic respiration"], "Think of sprinting and bread.", "Although inefficient, anaerobic respiration lets muscles keep working briefly without enough oxygen, and humans use fermentation to make food and drinks."],
[5, "A student sets up yeast + glucose at 35 °C and yeast + glucose at 80 °C. Only the 35 °C tube bubbles. Which conclusion is best?", ["At 80 °C, the yeast's enzymes were denatured, so respiration stopped", "Yeast only respires at night", "Glucose melts at 80 °C", "CO₂ cannot form at high temperature"], "Respiration is controlled by enzymes.", "Respiration is enzyme-controlled. At 80 °C, enzymes are denatured and yeast cells die, so no CO₂ is produced."],
[6, "You want to find the best temperature for bread dough to rise. Which plan is best?", ["Put equal portions of the same dough in measuring cylinders in water baths at 20, 30, 40 and 50 °C; measure the volume after the same time", "Put dough at one temperature and watch", "Use different recipes at each temperature", "Bake the dough first"], "Change only temperature; measure volume.", "Keep dough, yeast amount and time the same; change only temperature. The increase in volume shows the rate of CO₂ production."],

{ b: 4, type: "dial", q: "Compare aerobic and anaerobic respiration (in muscles).", labels: ["Oxygen needed?", "ATP per glucose", "Waste product"], dials: [["Aerobic only", "Both", "Neither"], ["Aerobic: much more", "Anaerobic: much more"], ["Aerobic: CO₂ + water; anaerobic: lactic acid", "Aerobic: lactic acid; anaerobic: CO₂"]], answer: [0, 0, 0],

[5, "A student concludes from the vacuum flask experiment: 'Germinating seeds respire faster than dry seeds.' The student only used germinating and boiled seeds. Evaluate.", ["Not supported: dry (living) seeds were not tested, so no comparison with them can be made", "Fully supported by the results", "Wrong: boiled seeds respire the most", "Wrong: seeds cannot respire"], "What was actually compared?", "The experiment only compared living germinating seeds with dead seeds. To compare with dry seeds, a flask of dry living seeds is needed."],

[5, "Usagi says: 'Digestion only happens in the stomach.' Evaluate.", ["Wrong: digestion starts in the mouth (amylase) and is completed in the small intestine by pancreatic and intestinal enzymes", "Correct: only the stomach digests", "Wrong: digestion only happens in the large intestine", "Correct: the mouth only chews"], "Follow a piece of bread from start to end.", "Starch digestion starts in the mouth; protein digestion starts in the stomach; most digestion is completed in the small intestine."],
[5, "A student says 'bile is an enzyme because it helps digest fat'. Which is the best response?", ["Bile is not an enzyme: it emulsifies fats physically, so lipase has more surface area to work on", "Correct: bile is a lipase", "Correct: bile digests starch", "Wrong: bile has no effect on fat"], "Does bile change the fat molecule itself?", "Bile salts break large fat globules into small droplets (physical change). Lipase then chemically digests the fat."],
[6, "You design a test to show that amylase digests starch. Which plan is best?", ["Mix starch with amylase and starch with water (control) at 37 °C; take samples every minute and test with iodine until blue-black no longer appears", "Mix starch and amylase and heat to 100 °C", "Test starch alone with Benedict's", "Add iodine to amylase only"], "Control + regular sampling.", "The control shows starch doesn't disappear by itself. Iodine tests over time show when the starch has been digested."],
[6, "You create a 'journey of a cheese sandwich' comic. Which route is correct?", ["Mouth (chewing, amylase) → oesophagus (peristalsis) → stomach (pepsin, HCl) → duodenum (bile, pancreatic enzymes) → ileum (digestion finished, absorption)", "Mouth → stomach → mouth → ileum", "Oesophagus → large intestine → stomach", "Stomach → mouth → duodenum"], "Follow the alimentary canal in order.", "Food passes mouth → oesophagus → stomach → small intestine (duodenum then ileum) → large intestine, being digested along the way."]
];
QB.t8s3 = [
[1, "Where is most digested food absorbed?", ["The small intestine (ileum)", "The stomach", "The large intestine", "The oesophagus"], "It's lined with villi.", "Most absorption happens in the ileum of the small intestine, which has a huge surface area."],
[1, "Which vessel in a villus absorbs fatty acids and glycerol?", ["The lacteal", "The hepatic portal vein", "The capillary network", "The oesophagus"], "It's part of the lymphatic system.", "Fatty acids and glycerol re-form fats that enter the lacteal (a lymph vessel) in the villus."],
[2, "What is the main job of the large intestine (colon)?", ["To absorb most of the remaining water and minerals", "To digest proteins", "To make bile", "To absorb all glucose"], "Faeces become more solid there.", "The large intestine absorbs water (and minerals) from undigested material, forming faeces."],
[2, "Where does the hepatic portal vein carry absorbed glucose and amino acids?", ["To the liver", "To the lungs", "To the brain", "To the kidneys"], "Hepatic = liver.", "The hepatic portal vein takes blood rich in absorbed nutrients from the intestine directly to the liver."],
[2, "What is assimilation?", ["The use of absorbed food molecules by body cells", "The removal of undigested food", "The breaking down of large food molecules", "The chewing of food"], "After absorption comes...", "Assimilation is when absorbed nutrients are used, e.g. amino acids to build proteins, glucose for respiration."],
[3, "Villi have microvilli on their epithelial cells. What is the advantage?", ["A much larger surface area for absorption", "They digest fat", "They produce bile", "They make the intestine shorter"], "Folds on folds on folds.", "Microvilli greatly increase the surface area, so more nutrients can be absorbed quickly."],
[3, "Why does a villus have a dense capillary network?", ["Blood carries absorbed nutrients away quickly, keeping a steep concentration gradient", "Capillaries digest food", "Capillaries store fat", "Blood makes the villus move"], "Think of diffusion.", "The blood flow removes absorbed glucose and amino acids, so their concentration stays low in the blood and diffusion continues fast."],
{ b: 3, type: "dial", q: "The diagram shows a villus. Name A, B and C.", svg: "villus", labels: ["A", "B", "C"], dials: [["Epithelium (one cell thick)", "Blood capillary", "Lacteal"], ["Epithelium (one cell thick)", "Blood capillary", "Lacteal"], ["Epithelium (one cell thick)", "Blood capillary", "Lacteal"]], answer: [0, 1, 2],
  hint: "A is the outer layer; B the red network; C the central tube.", explain: "A is the epithelium (thin, short diffusion distance), B the blood capillaries (absorb glucose, amino acids), C the lacteal (absorbs fats)." },
{ b: 4, type: "dial", q: "Where does each absorbed substance go first?", labels: ["Glucose", "Amino acids", "Fatty acids + glycerol"], dials: [["Blood capillaries", "Lacteal"], ["Blood capillaries", "Lacteal"], ["Blood capillaries", "Lacteal"]], answer: [0, 0, 1],
  hint: "Fats take the lymph route.", explain: "Glucose and amino acids enter the blood capillaries (→ hepatic portal vein → liver). Fatty acids and glycerol re-form fats in the lacteal." },
[4, "A disease flattens the villi. Which symptom would you expect?", ["Poor absorption of nutrients, leading to weight loss and deficiencies", "Better absorption", "More bile production", "Faster peristalsis only"], "Flatter = less surface area.", "Flattened villi greatly reduce the surface area, so fewer nutrients are absorbed even if the diet is good."],
[4, "The liver converts extra amino acids into urea. Why can't the body store extra amino acids?", ["There is no storage form for amino acids, so the excess is deaminated and the rest is used for energy", "Amino acids are stored in fat", "Amino acids are poisonous in all amounts", "Amino acids turn into bile"], "Glucose → glycogen, but amino acids → ?", "Unlike glucose (stored as glycogen), excess amino acids cannot be stored. The liver deaminates them: the amino group becomes urea."],
[5, "Hachiware says: 'Food is inside your body as soon as you swallow it.' Evaluate.", ["Not quite: food in the gut is still outside body cells; it only enters the body after absorption through the gut wall", "Correct: the gut is inside the body", "Correct: swallowing is absorption", "Wrong: food never enters the body"], "Where does absorption happen?", "The gut is a tube open at both ends. Nutrients only enter the body's tissues when they are absorbed into the blood or lymph."],
[5, "A student claims 'the longer the small intestine, the better, so humans should have a 100 m intestine'. Which is the best evaluation?", ["A long intestine helps absorption, but there are limits: it must fit the body and food takes longer to pass; villi also raise surface area efficiently", "Correct: longer is always better", "Wrong: length has no effect on absorption", "Wrong: absorption happens in the stomach"], "Think about trade-offs.", "Length increases surface area and time for absorption, but body space is limited. Villi and microvilli increase the area without needing more length."],
[6, "You design a model villus from craft materials. Which set of features is most accurate?", ["A finger shape with a thin outer layer, a red net of capillaries and a central white lacteal, covered with tiny bumps (microvilli)", "A thick tube with no blood vessels", "A flat sheet with a large vein only", "A balloon filled with bile"], "Include all adaptations.", "A good model shows a large surface area (finger shape, microvilli), a thin epithelium, a capillary network and a central lacteal."],
[6, "You write a story of a glucose molecule from a rice ball to a muscle cell. Which route is correct?", ["Starch digested to glucose → absorbed into villus capillaries → hepatic portal vein → liver → blood → muscle cell (respiration)", "Rice → lacteal → lungs → muscle", "Glucose → large intestine → faeces → muscle", "Starch absorbed whole → brain → muscle"], "Digest, absorb, transport, assimilate.", "Starch is digested to glucose, absorbed into the capillaries, carried by the hepatic portal vein to the liver, then by the blood to cells for respiration."]
];

/* ============================================================
   5a. Graph-reading questions (appended to each stage's bank)
   Format: [stage, bloom, diagram, question, choices (correct first), hint, explanation]

[
["t1s1", 4, "gMinerals", "The bar chart shows seedlings grown in different mineral solutions. Lack of which ion reduced growth the MOST?", ["Nitrate", "Magnesium", "Phosphate", "None: all grew equally"], "Find the shortest bar.", "Seedlings without nitrate grew only 8 cm: without nitrogen they cannot make amino acids and proteins for growth."],
["t1s1", 3, "gMinerals", "Using the bar chart, how much shorter were the seedlings without magnesium than those in the complete solution?", ["10 cm", "14 cm", "24 cm", "38 cm"], "Subtract the two bars.", "24 cm − 14 cm = 10 cm shorter."],
["t1s1", 4, "gWater", "The bar chart shows the water content of four tissues. Which tissue is most likely to have the lowest rate of metabolism?", ["Dry seed, because with little water few reactions can happen in solution", "Jellyfish, because it has the most water", "Lettuce, because it is a plant", "Human body, because it is warm"], "Reactions need water as a solvent.", "A dry seed contains only 10% water, so few reactions can take place: it is dormant until it absorbs water."],
["t1s2", 3, "gEnergy", "Using the bar chart, about how many times more energy does 1 g of lipid release than 1 g of carbohydrate?", ["About 2 times", "About 4 times", "About the same", "About half"], "39 ÷ 17 ≈ ?", "39 ÷ 17 ≈ 2.3, so lipid releases about twice as much energy per gram."],
["t1s2", 4, "gEnergy", "Look at the bar chart. Why do animals that migrate long distances store energy mainly as fat?", ["Fat stores more than twice the energy per gram, so less body mass must be carried", "Fat is a protein", "Carbohydrate releases no energy", "Fat is easier to see"], "Compare the lipid bar with the others.", "Lipid stores 39 kJ per g compared with 17 kJ per g, so a fat store is much lighter for the same amount of energy."],
["t1s2", 3, "gBenedict", "The graph is a calibration line for Benedict's test. An unknown drink gives 0.6 g of precipitate. What is its glucose concentration?", ["1.2 %", "0.6 %", "0.3 %", "2.4 %"], "Read across from 0.6 g to the line, then down.", "0.6 g on the y-axis meets the line at 1.2 % glucose."],
["t1s3", 4, "gHeatEnzyme", "The graph shows enzyme activity after heating the enzyme, then testing at 37 °C. Why is there no activity after heating to 70 °C?", ["The enzyme was permanently denatured, so cooling did not restore it", "The enzyme was only inactive and works when cooled", "70 °C is the optimum temperature", "The substrate was used up"], "Testing was at 37 °C, yet no activity returned.", "High temperature changed the enzyme's shape permanently, so even at 37 °C the active site no longer fits the substrate."],
["t1s3", 3, "gHeatEnzyme", "Using the graph, above which temperature does heating start to damage the enzyme clearly?", ["About 40 °C", "About 20 °C", "About 70 °C", "It is never damaged"], "Where does the line start to fall?", "Activity stays near 100% up to 40 °C, then falls: heating above about 40 °C denatures the enzyme."],
["t1s3", 3, "gProteinFood", "Using the bar chart, which food would best help a teenager's growth and repair?", ["Soybean", "Rice", "Apple", "All are the same"], "Growth needs protein.", "Soybean has the most protein (36 g per 100 g), providing amino acids for new cells."],
["t2s1", 4, "gFieldCells", "The bar chart shows the number of cells seen at different magnifications. What is the best explanation for the pattern?", ["At higher magnification the field of view is smaller, so fewer cells fit in view", "Cells die at higher magnification", "Higher magnification shrinks cells", "The stain fades"], "What happens to the area you can see?", "As magnification increases, you see a smaller area of the slide, so fewer (but larger-looking) cells appear."],
["t2s1", 3, "gFieldCells", "Using the bar chart, how many times fewer cells are seen at ×400 than at ×40?", ["40 times", "10 times", "4 times", "117 times"], "Divide 120 by 3.", "120 ÷ 3 = 40 times fewer cells."],
["t2s2", 4, "gMito", "The bar chart shows mitochondria per cell. Which cell type is likely to need the most energy, and why?", ["Heart muscle, because it has the most mitochondria for aerobic respiration", "Fat cells, because they store energy", "Skin cells, because they are on the outside", "Liver cells, because they are the largest"], "Mitochondria release energy.", "Heart muscle contracts non-stop, so it needs lots of ATP from aerobic respiration and has the most mitochondria."],
["t2s2", 5, "gMito", "A student looks at the bar chart and says 'fat cells don't respire because they have few mitochondria.' Evaluate.", ["Wrong: fat cells still have mitochondria and respire; they just need less energy than heart cells", "Correct: few mitochondria means no respiration", "Correct: fat cells only photosynthesise", "Wrong: fat cells have the most mitochondria"], "Is 150 the same as zero?", "All living cells respire. Fat cells have fewer mitochondria because they are less active, not because they don't respire."],
["t2s3", 4, "gUptake", "The graph shows uptake of two substances. Which one most likely crosses the membrane using carrier proteins?", ["B, because its uptake levels off when all carriers are busy", "A, because it rises in a straight line", "Both use carriers equally", "Neither crosses the membrane"], "What limits the rate at high concentration?", "B levels off: the carrier proteins become saturated. A keeps rising, typical of simple diffusion through the bilayer."],
["t2s3", 5, "gUptake", "Which statement about substance A in the graph is best supported?", ["It probably diffuses through the bilayer, so its rate depends on the concentration gradient", "It needs ATP", "It cannot enter the cell", "It uses the same carriers as B"], "A straight line means no limit is reached.", "A's rate is proportional to its concentration, as expected for simple diffusion (e.g. small, lipid-soluble molecules)."],
["t3s1", 4, "gCubes", "The graph shows how long colour takes to reach the centre of agar cubes. What does it show?", ["Larger cubes take much longer because the distance is longer and surface area to volume ratio is smaller", "Size has no effect", "Smaller cubes take longer", "Colour moves faster in large cubes"], "Compare 1 cm and 4 cm.", "A 4 cm cube takes 60 min versus 4 min: bigger objects have a smaller SA:V and longer diffusion distances."],
["t3s1", 3, "gSAV", "Using the bar chart, which cube has a surface area to volume ratio of 2?", ["The 3 cm cube", "The 1 cm cube", "The 2 cm cube", "The 4 cm cube"], "Find the bar with height 2.", "The 3 cm cube has SA:V = 54 ÷ 27 = 2."],
["t3s1", 5, "gSAV", "Look at the bar chart. Which conclusion about single-celled organisms is best supported?", ["Being small gives a large SA:V, so diffusion across the surface can supply the whole cell", "Being small reduces diffusion", "Large cells have a larger SA:V", "SA:V is the same for all sizes"], "Which cube has the largest ratio?", "The smallest cube has the largest SA:V, which is why tiny organisms can rely on diffusion alone."],
["t3s2", 4, "gPotato", "The graph shows the change in mass of potato strips in sucrose solutions. What is the best estimate of the cell sap concentration?", ["About 0.27 M", "0 M", "About 0.6 M", "About 0.1 M"], "Where is there NO change in mass?", "The line crosses 0 % at about 0.27 M: there the solution has the same water potential as the cell sap, so no net osmosis."],
["t3s2", 3, "gPotato", "Using the graph, in which solution did the potato strips gain the most water?", ["0 M (pure water)", "0.3 M", "0.6 M", "0.4 M"], "Look for the largest positive value.", "In pure water the strips gained 18 % in mass: water entered the cells by osmosis."],
["t3s2", 5, "gPotato", "The graph uses % change in mass rather than change in mass. Why is this better?", ["Strips may start with different masses, so % change allows a fair comparison", "It makes the numbers bigger", "Mass cannot be measured", "It removes the need for repeats"], "Think about strips of different starting masses.", "Percentage change corrects for different starting masses, so results from different strips can be compared fairly."],
["t3s3", 4, "gOxygenIons", "The graph shows ion uptake by roots at different oxygen concentrations. Why does uptake rise with oxygen?", ["More O₂ means more aerobic respiration, giving more ATP for active transport", "Oxygen carries the ions", "Ions diffuse faster in oxygen", "Oxygen increases osmosis"], "Active transport needs ATP.", "Ion uptake is by active transport, which needs ATP from aerobic respiration; more O₂ gives more ATP."],
["t3s3", 5, "gOxygenIons", "Look at the graph. Above about 20 % oxygen, uptake hardly increases. What is the most likely limiting factor there?", ["The number of carrier proteins in the membrane", "Oxygen concentration", "Light intensity", "The size of the root"], "Oxygen no longer limits the rate.", "When extra O₂ has no effect, another factor limits uptake, most likely the number of carrier proteins."],
["t3s3", 3, "gRootIons", "The bar chart compares K⁺ concentration in soil water and in root hair cells. How do the cells take in more K⁺?", ["Active transport", "Diffusion", "Osmosis", "Phagocytosis"], "The cell already has much more K⁺ than the soil.", "K⁺ moves from low (0.5 mM) to high (120 mM) concentration, against the gradient, so it needs active transport."],
["t4s1", 4, "gDNA", "The graph shows DNA per cell during the cell cycle. What is happening at P?", ["DNA replication during interphase", "Anaphase", "Cytokinesis", "Crossing over"], "The DNA amount doubles.", "Between 8 and 12 hours the DNA doubles from 2 to 4 units: DNA is being replicated in interphase."],
["t4s1", 4, "gDNA", "In the graph, what happens at Q, when the DNA per cell suddenly halves?", ["The cell divides into two, sharing the DNA equally", "DNA is replicated", "The cell dies", "Meiosis II starts"], "Where does half the DNA go?", "At the end of mitosis the cell divides (cytokinesis), so each daughter cell gets half the replicated DNA: back to 2 units."],
["t4s1", 3, "gStages", "The bar chart shows the % of root tip cells in each stage. A full cell cycle takes 20 hours. About how long is metaphase?", ["About 36 minutes", "About 3 hours", "About 17 hours", "About 6 minutes"], "3 % of 20 hours.", "3 % × 20 h = 0.6 h ≈ 36 minutes. The % of cells in a stage reflects how long the stage lasts."],
["t4s2", 4, "gMeioDNA", "The graph shows DNA per cell during meiosis. Why is the DNA at R half the amount at the start?", ["DNA replicates once but the cell divides twice, forming haploid gametes", "DNA is destroyed in meiosis", "The cell divides only once", "Crossing over removes DNA"], "Count the replications and the divisions.", "One replication (2 → 4) is followed by two divisions (4 → 2 → 1), so the gametes have half the original DNA."],
["t4s2", 3, "gChromNum", "Using the bar chart, which cells are haploid?", ["Sperm and egg", "Skin cell and zygote", "Only the zygote", "All four"], "Haploid = half the body-cell number.", "Sperm and eggs have 23 chromosomes (n). Skin cells and the zygote have 46 (2n)."],
["t4s2", 4, "gChromNum", "Look at the bar chart. Why does the zygote have the same number of chromosomes as a skin cell?", ["Two haploid gametes (23 + 23) fuse at fertilisation, restoring 46", "The zygote copies the skin cell", "The zygote divides by meiosis", "Sperm have 46 chromosomes"], "Add the gametes together.", "23 + 23 = 46: meiosis halves the number, fertilisation restores it."],
["t4s3", 4, "gTumour", "The graph shows cell numbers in two tissues over 30 days. Which tissue is most likely a tumour, and why?", ["B, because its cells keep dividing by mitosis without control", "A, because its number is steady", "Both are tumours", "Neither, because cells never increase"], "Normal tissue replaces cells but doesn't keep growing.", "Tissue B's cell number rises rapidly and keeps rising: uncontrolled mitosis. Tissue A stays steady, like normal tissue."],
["t5s1", 4, "gEnergyProfile", "The graph shows the energy changes in a reaction with and without an enzyme. What does it show?", ["The enzyme lowers the activation energy (the peak is lower)", "The enzyme adds energy to the reaction", "The enzyme changes the products", "The enzyme makes the reaction release more energy"], "Compare the heights of the two peaks.", "Both reactions start and end at the same energy, but the peak is lower with the enzyme: less activation energy is needed."],
["t5s1", 4, "gProduct", "The graph shows product formed in an enzyme reaction. Why does it level off after about 5 minutes?", ["The substrate has been used up", "The enzyme has been used up", "The enzyme stopped working because it is tired", "More product is being destroyed"], "Enzymes are not used up.", "The enzyme is still active, but all the substrate has been converted, so no more product forms."],
["t5s2", 4, "gTwoTemps", "The graph shows product formed at 35 °C and 60 °C. Why does the 60 °C curve level off at a LOWER amount of product?", ["The enzyme was denatured before all the substrate was used", "There was less substrate at 60 °C", "The product was destroyed at 60 °C", "Enzymes work better at 60 °C"], "At 60 °C the reaction is fast at first, then stops early.", "At 60 °C, molecules collide fast at first, but the enzyme is soon denatured, so the reaction stops with substrate left over."],
["t5s2", 4, "gStarchTime", "The bar chart shows the time for amylase to digest starch at different pH values. Which pH is closest to the optimum?", ["pH 7", "pH 4", "pH 8", "pH 5"], "The optimum gives the SHORTEST time.", "The shortest time (3 min at pH 7) means the fastest rate. Time and rate are inversely related."],
["t5s3", 4, "gInhibitors", "The graph shows rate against substrate concentration for P (no inhibitor) and two inhibitors. Which curve shows a non-competitive inhibitor?", ["R", "Q", "P", "Both Q and R"], "More substrate cannot overcome a non-competitive inhibitor.", "R levels off far below P even at high substrate concentration. Q almost reaches P's rate, so it is competitive."],
["t5s3", 4, "gStain", "The bar chart shows stain removal by biological washing powder. Why is removal so low at 80 °C?", ["The enzymes (proteases, lipases) are denatured", "The stain dissolves too fast", "The powder works best when boiling", "Enzymes are not used in washing powder"], "Enzymes are proteins.", "At 80 °C the enzymes lose their shape, so they cannot digest the stain. 40 °C is near their optimum."],
["t6s2", 3, "gAbsorb", "The graph shows absorption spectra. Which colour of light, marked X, is absorbed LEAST by chlorophyll?", ["Green", "Red", "Blue", "Violet"], "X is in the middle of the spectrum.", "Around 550 nm (green), chlorophyll absorbs very little, so green light is reflected and leaves look green."],
["t6s2", 4, "gAbsorb", "Look at the absorption spectra. How do carotenoids help photosynthesis?", ["They absorb blue-green wavelengths (450–500 nm) that chlorophyll absorbs less, and pass on the energy", "They absorb red light at 700 nm", "They absorb green light at 550 nm best", "They release oxygen directly"], "Where does the orange line peak?", "Carotenoids absorb around 450–490 nm, widening the range of wavelengths the leaf can use."],
["t6s2", 5, "gAction", "The action spectrum has a similar shape to chlorophyll's absorption spectrum. What does this suggest?", ["Light absorbed by chlorophyll (and other pigments) is the light used in photosynthesis", "Green light gives the fastest photosynthesis", "Pigments are not needed", "Photosynthesis happens only in the dark"], "Where the pigment absorbs, the rate is high.", "High rates occur at wavelengths that pigments absorb strongly (blue and red), so absorbed light drives photosynthesis."],
["t6s3", 4, "gO2Light", "The graph shows O₂ collected from pondweed. The lamp is switched off at L. Why does the line become flat?", ["Without light, photolysis stops, so no more O₂ is released", "The pondweed died at L", "CO₂ ran out at L", "O₂ is only made at night"], "Which reaction releases O₂?", "O₂ comes from photolysis in the light-dependent reactions, which need light. With no light, O₂ release stops."],
["t6s3", 3, "gO2Light", "Using the graph, what was the rate of O₂ production while the lamp was on?", ["2.5 cm³ per minute", "25 cm³ per minute", "10 cm³ per minute", "0.25 cm³ per minute"], "Divide the volume by the time.", "25 cm³ in 10 minutes = 2.5 cm³ per minute."],
["t6s4", 4, "gGPRuBP", "The graph shows two Calvin cycle compounds when the light is switched off. Which curve is GP?", ["S, because GP builds up when there is no ATP or NADPH to reduce it", "T, because GP falls in the dark", "Both curves are GP", "Neither; GP disappears instantly"], "In the dark, GP is still made but not used.", "CO₂ is still fixed to RuBP to make GP, but GP can't be reduced without ATP and NADPH, so GP (S) rises and RuBP (T) falls."],
["t6s4", 4, "gCO2drop", "The graph shows two Calvin cycle compounds when CO₂ is lowered. Which curve is RuBP?", ["M, because less RuBP is used to fix CO₂ while it is still being regenerated", "N, because RuBP falls when CO₂ falls", "Both curves", "Neither"], "RuBP is the CO₂ acceptor.", "With less CO₂, RuBP is used more slowly but still regenerated, so it builds up (M). GP falls (N) because less is made."],
["t6s5", 4, "gTempPS", "The graph shows the rate of photosynthesis at different temperatures. Why does the rate fall above 30 °C?", ["Enzymes of the Calvin cycle begin to denature", "Light intensity falls at high temperature", "CO₂ is destroyed by heat", "Chlorophyll turns into starch"], "The Calvin cycle is enzyme-controlled.", "Above the optimum temperature, enzymes change shape and the rate falls steeply."],
["t6s5", 5, "gGreenhouse", "The bar chart shows winter tomato yields. A farmer can afford only one change. Which conclusion is best supported?", ["Adding CO₂ increases yield, and adding light as well increases it further, so both light and CO₂ were limiting", "Adding CO₂ has no effect", "Extra light alone was tested and works best", "Normal air gives the highest yield"], "Compare each bar with the one before.", "Yield rose from 5 to 8 with CO₂ and to 11 with CO₂ + light, so both were limiting in winter. (Light alone was not tested.)"],
["t6s5", 4, "gBubbles", "The graph shows bubbles per minute at different lamp distances. Which is the best description?", ["The rate falls steeply as the lamp moves away, because light intensity decreases", "The rate rises with distance", "The rate falls at an even, steady rate", "Distance has no effect"], "Look at the shape of the curve.", "Bubbling falls from 60 to 5 per minute: light intensity drops quickly with distance, so light limits the rate."],
["t6s6", 4, "gCompensation", "The graph shows net CO₂ uptake by a plant. What is point K?", ["The compensation point: photosynthesis rate equals respiration rate", "The point where photosynthesis stops", "The point where respiration stops", "The optimum temperature"], "At K the net CO₂ uptake is zero.", "At K, CO₂ used in photosynthesis equals CO₂ released by respiration, so there is no net exchange."],
["t6s6", 4, "gCompensation", "Using the graph, why is net CO₂ uptake negative (below 0) in darkness?", ["Only respiration happens, so the plant releases CO₂", "Photosynthesis is fastest in darkness", "The plant stops respiring", "CO₂ is absorbed by the soil"], "Which process never stops?", "In darkness there is no photosynthesis, but respiration continues, so there is a net release of CO₂."],
["t7s1", 3, "gATP", "Using the bar chart, which stage of aerobic respiration makes the most ATP?", ["Oxidative phosphorylation", "Glycolysis", "Krebs cycle", "They are equal"], "Find the tallest bar.", "Oxidative phosphorylation on the cristae makes about 34 of the ATP from each glucose."],
["t7s1", 4, "gCyanide", "The graph shows oxygen uptake by cells. Cyanide is added at C. What is the best explanation?", ["Cyanide inhibits a respiratory enzyme, so oxygen can no longer accept hydrogen and uptake stops", "Cyanide releases oxygen", "Cyanide speeds up glycolysis", "The cells started photosynthesising"], "Where is oxygen used in respiration?", "Cyanide stops the carrier chain in oxidative phosphorylation, so oxygen is no longer used and aerobic respiration stops."],
["t7s1", 5, "gATP", "Look at the bar chart. A student says 'glycolysis is the most important stage because it happens first.' Evaluate.", ["Not supported: glycolysis makes only 2 ATP; most ATP comes from oxidative phosphorylation, which needs oxygen", "Correct: the first stage makes the most ATP", "Correct: glycolysis makes 34 ATP", "Wrong: glycolysis makes no ATP"], "Compare the bars.", "Glycolysis is essential but yields little ATP. Oxidative phosphorylation provides most of the energy."],
["t7s2", 4, "gLactate", "The graph shows blood lactic acid during and after exercise. Why does it keep falling after E?", ["Extra oxygen (the oxygen debt) is used to break down lactic acid", "Muscles stop making ATP", "Lactic acid turns into glucose instantly in the muscles", "The person stops breathing"], "Exercise ended at E.", "After exercise, heavy breathing supplies extra O₂ to break down lactic acid, so its level falls back to normal."],
["t7s2", 3, "gLactate", "Using the graph, how long after exercise stopped did it take for lactic acid to fall back to about 3 mM?", ["About 20 minutes", "About 3 minutes", "About 30 minutes after the start of exercise", "About 40 minutes"], "Exercise stopped at 10 minutes.", "Lactic acid reaches about 3 mM at 30 minutes, which is 20 minutes after exercise stopped at 10 minutes."],

function openModal(html, { wide = false, closable = true, onClose = null } = {}) {
  $modal.innerHTML = `<div class="overlay" id="ov"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" id="mbox">
    ${closable ? `<button class="iconbtn x" id="mx" aria-label="${"Close"}">✕</button>` : ""}${html}</div></div>`;
  const close = () => { closeModal(); onClose && onClose(); };
  if (closable) {
    document.getElementById("mx").onclick = () => { SFX.tap(); $modal._close && $modal._close(); };
    document.getElementById("ov").onclick = e => { if (e.target.id === "ov" && $modal._close) $modal._close(); };
  }
  $modal._close = closable ? close : null;
  const f = $modal.querySelector(".modal button:not(.x), .modal input"); if (f) f.focus({ preventScroll: true });
  return document.getElementById("mbox");
}
function closeModal() { $modal.innerHTML = ""; $modal._close = null; }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($journal.innerHTML) { $journal.innerHTML = ""; return; }
  if ($modal._close) $modal._close();
});

function codePreview(d) {
  const rows = TOPICS.map((T, ti) => d.done[ti] ? `<li>${T.icon} ${esc(T.name)}: <b>${d.done[ti]}/${topicRooms(ti).length}</b> stages ${starStr(d.stars[ti])}</li>` : "").join("");

  return `<div class="preview small"><b>This code contains:</b> ${d.escaped} stage${d.escaped === 1 ? "" : "s"} escaped${rows ? `<ul style="margin:4px 0;padding-left:20px">${rows}</ul>` : ". "}${d.lock ? `${d.lock}/5 locks open in <b>${esc(nextR.name)}</b>, ` : ""}🔥 ${d.streak}-day streak, 🛡️ ${d.shields} shield${d.shields === 1 ? "" : "s"}.</div>`;
}

// A self-contained answer widget (multiple choice, dials or spelling) used outside escape rooms
function miniQuiz(el, p, done) {
  let over = false;
  const finish = ok => { if (over) return; over = true; el.querySelectorAll("button,input").forEach(x => (x.disabled = true)); done(ok); };
  if (p.type === "mc") {
    const idx = p.choices.map((_, i) => i), order = p.fix ? idx.sort((a, b) => p.choices[a].localeCompare(p.choices[b])) : shuffle(idx);
    el.innerHTML = `<div class="choices">${order.map((i, n) => `<button class="choice" data-i="${i}"><b>${"ABCD"[n]}</b><span>${esc(p.choices[i])}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".choice").forEach(b => b.onclick = () => { const ok = Number(b.dataset.i) === p.answer; b.classList.add(ok ? "right" : "wrong"); if (!ok) el.querySelector(`[data-i="${p.answer}"]`).classList.add("right"); finish(ok); });
  } else if (p.type === "dial") {

    el.innerHTML = `<div class="dials">${p.dials.map((o, d) => `<div class="dial">${p.labels ? `<span class="dlabel">${esc(p.labels[d])}</span>` : ""}<button class="arr" data-d="${d}" data-dir="-1" aria-label="Previous option">▲</button><div class="face" id="mf${d}">${esc(o[pos[d]])}</div><button class="arr" data-d="${d}" data-dir="1" aria-label="Next option">▼</button></div>`).join("")}</div><div class="row" style="justify-content:center"><button class="btn" id="mdOk">Check 🔓</button></div>`;
    el.querySelectorAll(".arr").forEach(b => b.onclick = () => { const d = Number(b.dataset.d), n = p.dials[d].length; pos[d] = (pos[d] + Number(b.dataset.dir) + n) % n; SFX.click(); document.getElementById("mf" + d).textContent = p.dials[d][pos[d]]; });
    document.getElementById("mdOk").onclick = () => { const ok = pos.every((v, d) => v === p.answer[d]); if (!ok) p.dials.forEach((o, d) => { document.getElementById("mf" + d).textContent = o[p.answer[d]]; }); finish(ok); };
  } else {
    el.innerHTML = `<div class="spell"><div class="sboxes" id="mBoxes">${spellBoxes(p.answer, "")}</div><p class="small muted">${countLetters(p.answer)} letters · starts with “${esc(p.answer[0].toUpperCase())}”</p>

    const inp = document.getElementById("mIn");
    inp.oninput = () => { document.getElementById("mBoxes").innerHTML = spellBoxes(p.answer, inp.value); };
    const go = () => { if (!normWord(inp.value)) { toast("Type the word first ✏️"); return; } const ok = normWord(inp.value) === normWord(p.answer); if (!ok) document.getElementById("mBoxes").innerHTML = spellBoxes(p.answer, p.answer); finish(ok); };
    document.getElementById("mOk").onclick = go; inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); go(); } }); setTimeout(() => inp.focus({ preventScroll: true }), 60);
  }
}

      const ok = p => !chosen.includes(p.id) && (!p.gen || (spells < 3 && !lockSpell));
      let c = room.pool.filter(p => ok(p) && p.b >= lo && p.b <= hi);
